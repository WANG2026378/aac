<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自然探索家 — 動物・昆蟲・植物</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;}
  body{min-height:100vh;background:linear-gradient(180deg,#a8e063 0%,#dbf5c0 40%,#e8f9ff 100%);color:#234a2e;padding:14px;}
  #app{max-width:900px;margin:0 auto;}
  header{text-align:center;margin-bottom:10px;}
  h1{font-size:1.8em;color:#1f6b34;text-shadow:1px 1px 0 #fff;}
  .subtitle{color:#3c7a4a;font-weight:bold;margin-top:4px;}

  .tabs{display:flex;gap:8px;justify-content:center;margin:16px 0 6px;flex-wrap:wrap;}
  .tab{background:#fff;border:3px solid #7cc36a;border-radius:30px;padding:10px 20px;font-size:1.05em;font-weight:bold;color:#2e6b3a;cursor:pointer;transition:transform .1s;}
  .tab:active{transform:scale(.96);}
  .tab.active{background:#2e9e3f;color:#fff;border-color:#1d6b2a;}
  .count-note{text-align:center;color:#4a7a55;font-size:.85em;margin-bottom:12px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;}
  .species-card{background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(30,107,52,.2);cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .species-card:hover{transform:translateY(-5px);box-shadow:0 12px 26px rgba(30,107,52,.32);}
  .stage{height:170px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#dfeecb;}
  .stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;}
  .card-body{padding:12px 14px;}
  .card-name{font-size:1.2em;font-weight:bold;color:#1f6b34;}
  .card-en{font-size:.78em;color:#7a9a82;font-style:italic;}
  .card-tag{display:inline-block;background:#eafbe4;border-radius:12px;padding:2px 10px;font-size:.76em;font-weight:bold;color:#2e9e3f;margin-top:6px;}

  .modal{position:fixed;inset:0;background:rgba(20,50,25,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;}
  .modal.hidden{display:none;}
  .detail{background:#fff;border-radius:24px;max-width:660px;width:100%;max-height:92vh;overflow-y:auto;animation:pop .35s;}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .detail-stage{height:280px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border-radius:24px 24px 0 0;background:#dfeecb;}
  .detail-stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;}
  .photo-credit{font-size:.74em;color:#7a9a82;margin:6px 0 2px;}
  .photo-credit a{color:#4a7aa0;}
  .illus-box{margin:14px 0;border-radius:16px;overflow:hidden;border:2px solid #cfe6bf;}
  .illus-head{background:#eafbe4;color:#2e7b3a;font-weight:bold;font-size:.92em;padding:7px 12px;}
  .illus-stage{height:180px;display:flex;align-items:center;justify-content:center;}
  .detail-body{padding:20px 22px;}
  .detail-name{font-size:1.6em;font-weight:bold;color:#1f6b34;}
  .detail-en{color:#7a9a82;font-style:italic;margin-bottom:6px;}

  .voice-bar{display:flex;gap:8px;align-items:center;background:#eef6ff;border:2px solid #9cc9ee;border-radius:14px;padding:8px 12px;margin:12px 0;flex-wrap:wrap;}
  .voice-bar .vlabel{font-weight:bold;color:#0b5ea8;font-size:.9em;}
  .vbtn{border:none;border-radius:12px;padding:8px 14px;font-weight:bold;cursor:pointer;font-family:inherit;font-size:.92em;}
  .vplay{background:#2e9e3f;color:#fff;} .vpause{background:#f5a623;color:#4a3000;} .vstop{background:#e0332c;color:#fff;}
  .vstatus{font-size:.82em;color:#4a7a55;}

  .info-row{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap;}
  .info-pill{background:#f0faec;border-radius:14px;padding:8px 12px;font-size:.9em;flex:1;min-width:130px;}
  .info-pill b{color:#2e9e3f;display:block;font-size:.8em;margin-bottom:2px;}
  .sec-title{font-weight:bold;color:#1f6b34;margin:16px 0 6px;font-size:1.1em;}
  .sec-body{line-height:1.7;color:#33503a;}
  .fun-list{list-style:none;}
  .fun-list li{background:#fffbe8;border-left:4px solid #f5c518;border-radius:8px;padding:8px 12px;margin-bottom:8px;line-height:1.6;}
  .food-chain{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;background:#eafbf0;border-radius:14px;padding:12px;font-weight:bold;}
  .food-chain .arrow{color:#2e9e3f;font-size:1.3em;}
  .chain-item{background:#fff;border:2px solid #7cc36a;border-radius:20px;padding:6px 12px;font-size:.9em;}

  .btn{border:none;border-radius:14px;padding:12px 20px;font-size:1.05em;font-weight:bold;cursor:pointer;font-family:inherit;}
  .yt-btn{background:#ff0000;color:#fff;box-shadow:0 4px 0 #b30000;display:inline-flex;align-items:center;gap:8px;text-decoration:none;transition:transform .1s;}
  .yt-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b30000;}
  .close-btn{background:#2e9e3f;color:#fff;box-shadow:0 4px 0 #1d6b2a;}
  .btn-row{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap;}

  .quiz-box{background:#f0faec;border-radius:16px;padding:16px;margin-top:16px;}
  .quiz-q{font-weight:bold;margin-bottom:10px;}
  .quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .quiz-opt{background:#fff;border:2px solid #7cc36a;border-radius:12px;padding:10px;font-weight:bold;cursor:pointer;color:#2e6b3a;}
  .quiz-opt.correct{background:#c8f7c5;border-color:#2e9e3f;}
  .quiz-opt.wrong{background:#ffd6d4;border-color:#e0332c;}
  .quiz-fb{text-align:center;font-weight:bold;margin-top:8px;min-height:1.4em;}

  footer{text-align:center;font-size:.78em;color:#4a7a55;margin-top:20px;}

  @keyframes flap{0%,100%{transform:rotate(-18deg);}50%{transform:rotate(18deg);}}
  @keyframes sway{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
  @keyframes bobUp{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  @keyframes swim{0%{transform:translateX(-30px);}100%{transform:translateX(30px);}}
  @keyframes glow{0%,100%{opacity:.3;}50%{opacity:1;}}
  @keyframes crawl{0%{transform:translateX(-18px);}100%{transform:translateX(18px);}}
  @keyframes spin{from{transform:rotate(0);}to{transform:rotate(360deg);}}
  @keyframes wob{0%,100%{transform:rotate(-8deg);}50%{transform:rotate(8deg);}}
  @keyframes drift{0%{transform:translate(-10px,0);}100%{transform:translate(14px,-10px);}}
  .anim-flap{transform-origin:right center;animation:flap .5s infinite;}
  .anim-flap2{transform-origin:left center;animation:flap .5s infinite;}
  .anim-sway{transform-origin:bottom center;animation:sway 2.5s ease-in-out infinite;}
  .anim-bob{animation:bobUp 2s ease-in-out infinite;}
  .anim-swim{animation:swim 2.5s ease-in-out infinite alternate;}
  .anim-glow{animation:glow 1.5s ease-in-out infinite;}
  .anim-crawl{animation:crawl 3s ease-in-out infinite alternate;}
  .anim-spin{animation:spin 9s linear infinite;}
  .anim-wob{transform-origin:bottom center;animation:wob 2s ease-in-out infinite;}
  .anim-drift{animation:drift 3s ease-in-out infinite alternate;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🌿 自然探索家 🔍</h1>
    <div class="subtitle">動物・昆蟲・植物 — 生態與趣聞大發現!</div>
  </header>
  <div class="tabs" id="tabs">
    <button class="tab active" data-c="animal">🐾 動物</button>
    <button class="tab" data-c="insect">🐛 昆蟲</button>
    <button class="tab" data-c="plant">🌱 植物</button>

  <div class="count-note" id="countNote"></div>

</div>

<div class="modal hidden" id="modal"><div class="detail" id="detail"></div></div>

     ecology:"石虎是台灣目前唯一的野生貓科動物,主要住在苗栗、台中、南投一帶的淺山。牠是夜行性動物,白天躲起來睡覺,晚上才出來獵食。石虎會幫忙控制老鼠的數量,是淺山生態系的重要成員。因為棲地被開發、路殺和農藥,石虎越來越少,全台估計只剩不到七百隻。",

    {id:"venus",name:"捕蠅草",en:"Venus Flytrap",tag:"🪤 會吃蟲的植物",bg:"linear-gradient(135deg,#3a8a3a,#1d5a1d)",

     ecology:"捕蠅草是最有名的食蟲植物。因為牠原本住在養分很少的沼澤地,土裡缺少氮,所以演化出會夾住昆蟲的葉子,靠消化蟲子來補充養分。牠的葉子像一個張開的夾子,邊緣有刺毛,裡面有敏感的感覺毛。當昆蟲碰到感覺毛,夾子就會快速合起來把蟲抓住,再慢慢消化。",

/* ========== 真實照片(維基共享,自由授權) ========== */
const PHOTOS = {
  leopardcat:"Close-up_of_a_Leopard_Cat_in_Sundarban.jpg",
  dolphin:"Tursiops_truncatus_01.jpg",
  owl:"Bubo_bubo_1_(Martin_Mecnarowski).jpg",
  blackbear:"Formosan_Black_Bear.JPG",
  seaturtle:"Green_turtle_swimming_over_coral_reefs_in_Kona.jpg",
  bat:"Lesser_short-nosed_fruit_bat_(Cynopterus_brachyotis).jpg",
  beetle:"Japanese_rhinoceros_beetle_(Trypoxylus_dichotomus)_(20492490700).jpg",
  bee:"Apis_mellifera_Western_honey_bee.jpg",
  firefly:"Firefly_-_Photinus_pyralis,_Woodbridge,_Virginia.jpg",
  ant:"Wood_Ants_-_formica_rufa_-_geograph.org.uk_-_1381268.jpg",
  butterfly:"Papilio_machaon_(Old_World_swallowtail).jpg",
  cicada:"Green-eyed_Cicada_(Megapomponia_imperatoria)_(8693270250).jpg",
  sunflower:"A_Sunflower.jpg",
  venus:"Venus_Flytrap_showing_trigger_hairs.jpg",
  mimosa:"Mimosa_pudica_L._(Touch_me_not_plant)_-_Flickr_-_lalithamba.jpg",
  lotus:"Lotus_flower_nelumbo_nucifera.jpg",
  bamboo:"Arashiyama_Bamboo_Grove_(Unsplash).jpg",
  dandelion:"Dandelion_seed_head_(Taraxacum_officinale).jpg"
};
function photoSrc(id, w){ return "https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(PHOTOS[id])+"?width="+(w||600); }
function photoPage(id){ return "https://commons.wikimedia.org/wiki/File:"+encodeURIComponent(PHOTOS[id]); }

/* ========== 語音朗讀 ========== */
const synth = window.speechSynthesis;
let zhVoice = null;
function loadVoice(){
  const vs = synth ? synth.getVoices() : [];
  zhVoice = vs.find(v=>/zh[-_]?(TW|Hant)/i.test(v.lang)) || vs.find(v=>v.lang && v.lang.toLowerCase().startsWith("zh")) || null;
}
if(synth){ loadVoice(); synth.onvoiceschanged = loadVoice; }
function narrationText(s){
  return `${s.name}。${s.ecology} 有趣的是,${s.fun.join(" ")}`;
}
function speak(text, onEnd){
  if(!synth){ return false; }
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-TW"; u.rate = 0.95; u.pitch = 1.0;
  if(zhVoice) u.voice = zhVoice;
  if(onEnd) u.onend = onEnd;
  synth.speak(u);
  return true;
}

/* ========== 渲染 ========== */
const $ = id=>document.getElementById(id);
let curCat = "animal";
const CAT_NAME = {animal:"動物",insect:"昆蟲",plant:"植物"};

function renderGrid(){
  const grid=$("grid"); grid.innerHTML="";
  $("countNote").textContent = `目前「${CAT_NAME[curCat]}」共 ${DATA[curCat].length} 種 ・ 全部合計 18 種生物`;
  DATA[curCat].forEach(s=>{
    const card=document.createElement("div");
    card.className="species-card";
    card.innerHTML=`<div class="stage" style="background:${s.bg}"><img loading="lazy" alt="${s.name}" src="${photoSrc(s.id,500)}"></div>
      <div class="card-body"><div class="card-name">${s.name}</div>
      <div class="card-en">${s.en}</div><span class="card-tag">${s.tag}</span></div>`;
    const stage=card.querySelector(".stage");
    stage.querySelector("img").onerror=function(){ stage.style.background=s.bg; stage.innerHTML=s.svg; };
    card.onclick=()=>openDetail(s);
    grid.appendChild(card);
  });
}
function ytUrl(q){ return "https://www.youtube.com/results?search_query="+encodeURIComponent(q); }

function openDetail(s){
  synth && synth.cancel();
  const chain = s.chain.map((c,i)=>`<span class="chain-item">${c}</span>${i<s.chain.length-1?'<span class="arrow">→</span>':''}`).join("");
  const funs = s.fun.map(f=>`<li>💡 ${f}</li>`).join("");
  const voiceSupported = !!synth;
  $("detail").innerHTML = `
    <div class="detail-stage" id="detailStage" style="background:${s.bg}"><img alt="${s.name}" src="${photoSrc(s.id,700)}"></div>
    <div class="detail-body">
      <div class="detail-name">${s.name} <span style="font-size:.6em">${s.tag}</span></div>
      <div class="detail-en">${s.en}</div>
      <div class="photo-credit">📷 照片來源:<a href="${photoPage(s.id)}" target="_blank" rel="noopener">Wikimedia Commons</a>(自由授權)</div>
      <div class="voice-bar">
        <span class="vlabel">🔊 語音朗讀</span>
        ${voiceSupported ? `
          <button class="vbtn vplay" id="vPlay">▶️ 播放</button>
          <button class="vbtn vpause" id="vPause">⏸️ 暫停</button>
          <button class="vbtn vstop" id="vStop">⏹️ 停止</button>
          <span class="vstatus" id="vStatus">點播放,聽哆啦老師介紹!</span>
        ` : `<span class="vstatus">這個瀏覽器不支援語音,建議用 Chrome 或 Edge 開啟。</span>`}
      </div>
      <div class="info-row">
        <div class="info-pill"><b>🏠 棲息地</b>${s.habitat}</div>
        <div class="info-pill"><b>🍽️ 食物</b>${s.diet}</div>
        <div class="info-pill"><b>📏 大小</b>${s.size}</div>
        <div class="info-pill"><b>⚠️ 現況</b>${s.status}</div>
      </div>
      <div class="sec-title">🌍 生態小百科</div>
      <div class="sec-body">${s.ecology}</div>
      <div class="illus-box"><div class="illus-head">🎨 動態插圖</div><div class="illus-stage" style="background:${s.bg}">${s.svg}</div></div>
      <div class="sec-title">🔗 牠在食物鏈的位置</div>
      <div class="food-chain">${chain}</div>
      <div class="sec-title">✨ 有趣的冷知識</div>
      <ul class="fun-list">${funs}</ul>
      <div class="quiz-box"><div class="quiz-q">🧠 小測驗:${s.quiz.q}</div>
        <div class="quiz-opts" id="quizOpts"></div><div class="quiz-fb" id="quizFb"></div></div>
      <div class="btn-row">
        <a class="btn yt-btn" href="${ytUrl(s.yt)}" target="_blank" rel="noopener">▶️ 看「${s.name}」影片</a>
        <button class="btn close-btn" id="closeBtn">關閉</button>
      </div>
    </div>`;

  const hero=$("detailStage"), heroImg=hero.querySelector("img");
  if(heroImg) heroImg.onerror=function(){ hero.style.background=s.bg; hero.innerHTML=s.svg; };

  if(voiceSupported){
    $("vPlay").onclick=()=>{
      if(synth.paused){ synth.resume(); $("vStatus").textContent="朗讀中…🔊"; return; }
      $("vStatus").textContent="朗讀中…🔊";
      speak(narrationText(s), ()=>{ $("vStatus").textContent="朗讀完畢!👏"; });
    };
    $("vPause").onclick=()=>{ if(synth.speaking && !synth.paused){ synth.pause(); $("vStatus").textContent="已暫停 ⏸️"; } };
    $("vStop").onclick=()=>{ synth.cancel(); $("vStatus").textContent="已停止 ⏹️"; };
  }

  const opts=$("quizOpts");
  s.quiz.opts.forEach((o,i)=>{
    const b=document.createElement("button");
    b.className="quiz-opt"; b.textContent=o;
    b.onclick=()=>{
      if(opts.dataset.done) return;
      opts.dataset.done="1";
      [...opts.children].forEach((x,j)=>{ if(j===s.quiz.a)x.classList.add("correct"); });
      if(i===s.quiz.a){ b.classList.add("correct"); $("quizFb").textContent="🎉 答對了!你真是自然小達人!"; $("quizFb").style.color="#2e9e3f"; }
      else { b.classList.add("wrong"); $("quizFb").textContent="再看看上面的介紹吧!正確答案已標示綠色。"; $("quizFb").style.color="#e0332c"; }
    };
    opts.appendChild(b);
  });
  $("closeBtn").onclick=closeModal;
  $("modal").classList.remove("hidden");
}
function closeModal(){ synth && synth.cancel(); $("modal").classList.add("hidden"); }

$("tabs").querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    synth && synth.cancel();
    $("tabs").querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active"); curCat=t.dataset.c; renderGrid();
  };
});
$("modal").onclick=e=>{ if(e.target===$("modal")) closeModal(); };
renderGrid();
</script>
