<!doctype html>
<html lang="zh-Hant">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="教學網">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FF6B6B">
<link rel="manifest" href="manifest.json">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>十二碼足球 3D · 明星隊長</title>
<style>
  :root{
    --ink:#f7fbf7;
    --panel:rgba(9,20,14,.82);
    --line:rgba(255,255,255,.28);
    --gold:#f4c542;
    --red:#e85f4f;
    --green:#42c66a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07130c;font-family:"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink)}
  button,input{font:inherit}
  #scene{position:fixed;inset:0}
  #scene canvas{display:block;width:100%;height:100%;touch-action:none}
  .ui{position:fixed;inset:0;pointer-events:none;display:grid;grid-template-rows:auto 1fr auto}
  .top{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;
    min-height:64px;padding:10px 16px;background:linear-gradient(rgba(5,14,9,.9),rgba(5,14,9,.28));
  }
  .title{font-size:clamp(19px,3vw,27px);font-weight:950;white-space:nowrap;text-shadow:0 2px 6px #000}
  .shots{display:flex;gap:7px;justify-content:center}
  .dot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.72);background:rgba(255,255,255,.2)}
  .dot.goal{background:var(--gold);border-color:#fff1a2}
  .dot.save{background:var(--red);border-color:#ffc0b8}
  .dot.miss{background:#59636d;border-color:#cbd2d8}
  .actions{display:flex;justify-content:flex-end;gap:8px;pointer-events:auto}
  .icon{
    width:42px;height:42px;border:1px solid var(--line);border-radius:7px;
    background:rgba(7,20,12,.78);color:#fff;font-size:21px;font-weight:950;cursor:pointer;
  }
  .icon:hover{background:rgba(33,82,48,.9)}
  .middle{position:relative}
  .aim-note{
    position:absolute;left:50%;top:7px;transform:translateX(-50%);
    min-width:230px;padding:9px 15px;border:1px solid var(--line);border-radius:7px;
    background:var(--panel);text-align:center;font-weight:900;text-shadow:0 1px 3px #000;
  }
  .timer{
    position:absolute;left:50%;top:55px;transform:translateX(-50%);
    width:min(72vw,420px);height:10px;border-radius:5px;overflow:hidden;background:rgba(255,255,255,.24);
  }
  .timer span{display:block;width:100%;height:100%;background:var(--gold);transition:width .1s linear,background .2s}
  .timer span.danger{background:var(--red)}
  .bottom{padding:0 14px max(12px,env(safe-area-inset-bottom));display:grid;gap:9px}
  .roster{
    justify-self:center;width:min(96vw,820px);
    display:grid;grid-template-columns:repeat(5,1fr);gap:5px;
  }
  .roster-item{
    min-width:0;padding:7px 5px;border:1px solid var(--line);border-radius:6px;
    background:rgba(6,17,10,.68);text-align:center;font-size:12px;font-weight:850;
    opacity:.58;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .roster-item.active{opacity:1;background:rgba(35,104,55,.9);border-color:#bde7c8}
  .roster-item.done{opacity:.78}
  .dashboard{
    justify-self:center;width:min(96vw,900px);min-height:100px;
    display:grid;grid-template-columns:minmax(190px,1.2fr) minmax(240px,1fr) auto;
    gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--line);
    border-radius:7px;background:var(--panel);backdrop-filter:blur(8px);
    box-shadow:0 7px 24px rgba(0,0,0,.25);
  }
  .player-name{font-size:22px;font-weight:950;margin-bottom:4px}
  .nation{font-size:13px;color:#c9d6cd}
  .stats{display:grid;gap:6px}
  .stat{display:grid;grid-template-columns:43px 1fr 28px;gap:7px;align-items:center;font-size:12px;font-weight:850}
  .bar{height:9px;border-radius:5px;background:rgba(255,255,255,.18);overflow:hidden}
  .bar span{display:block;height:100%;border-radius:inherit}
  .stamina span{background:var(--green)} .power span{background:#f0923e}.smart span{background:#57a6ec}
  .score-box{text-align:right;white-space:nowrap}
  .score{font-size:21px;font-weight:950}
  .upload{display:flex;justify-content:flex-end;gap:7px;margin-top:7px;pointer-events:auto}
  .upload label,.upload button{
    min-height:36px;padding:0 10px;border:1px solid var(--line);border-radius:6px;
    background:rgba(255,255,255,.09);color:#fff;font-size:12px;font-weight:850;cursor:pointer;
    display:inline-flex;align-items:center;
  }
  #avatar{position:absolute;width:1px;height:1px;opacity:0}
  .result{
    position:fixed;inset:0;display:none;place-items:center;padding:20px;
    background:rgba(1,8,4,.72);pointer-events:auto;
  }
  .result.show{display:grid}
  .result-panel{
    width:min(92vw,400px);padding:27px;text-align:center;border:1px solid var(--line);
    border-radius:8px;background:#10251a;box-shadow:0 18px 60px #000;
  }
  .result h2{font-size:30px;margin:0 0 8px}.result p{font-size:19px;line-height:1.5;margin:0 0 20px}
  .result button{width:100%;height:48px;border:0;border-radius:7px;background:#3da75d;color:#fff;font-weight:950;cursor:pointer}
  .select-screen{
    position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:22px;
    background:radial-gradient(circle at 50% 26%,rgba(51,118,70,.78),rgba(2,10,5,.94) 66%);
    pointer-events:auto;
  }
  .select-screen.hide{display:none}
  .select-inner{width:min(1080px,96vw);text-align:center}
  .select-inner h1{font-size:clamp(28px,5vw,48px);margin:0 0 7px;text-shadow:0 4px 14px #000}
  .select-inner>p{margin:0 0 22px;color:#d6e5da;font-size:17px}
  .captains{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
  .captain-card{
    position:relative;min-width:0;min-height:255px;padding:15px 10px 13px;
    border:1px solid rgba(255,255,255,.32);border-radius:8px;
    background:linear-gradient(180deg,rgba(255,255,255,.15),rgba(9,22,13,.9));
    color:#fff;cursor:pointer;overflow:hidden;
  }
  .captain-card:hover,.captain-card:focus-visible{border-color:#fff2a0;transform:translateY(-4px);outline:0}
  .shirt-icon{
    width:78px;height:91px;margin:0 auto 12px;border-radius:23px 23px 10px 10px;
    background:linear-gradient(90deg,var(--shirt) 0 40%,var(--secondary) 40% 60%,var(--shirt) 60%);
    border:4px solid rgba(255,255,255,.82);display:grid;place-items:center;
    font-size:32px;font-weight:950;text-shadow:0 2px 5px #000;
    box-shadow:0 9px 22px rgba(0,0,0,.28);
  }
  .captain-card h2{font-size:18px;margin:0 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .captain-card .country{height:34px;font-size:12px;color:#ccd9d0}
  .mini-stats{display:grid;gap:5px;margin-top:10px}
  .mini-stat{display:grid;grid-template-columns:30px 1fr 22px;gap:5px;align-items:center;font-size:10px;font-weight:850;text-align:left}
  .mini-stat .bar{height:7px}
  .choose{display:block;margin-top:12px;color:#ffe67c;font-size:13px;font-weight:950}
  .fallback{position:fixed;inset:0;display:none;place-items:center;background:#10251a;padding:25px;text-align:center}
  @media(max-width:680px){
    .top{grid-template-columns:1fr auto;padding:8px 10px}
    .shots{grid-row:2;grid-column:1/-1}
    .actions{grid-column:2}
    .aim-note{top:4px;font-size:14px}
    .timer{top:48px}
    .bottom{padding-left:8px;padding-right:8px}
    .dashboard{grid-template-columns:1fr auto;gap:8px;padding:9px}
    .stats{grid-column:1/-1;grid-row:2}
    .player-name{font-size:18px}
    .score{font-size:18px}
    .roster-item{font-size:10px;padding:6px 2px}
    .upload label,.upload button{padding:0 7px}
    .select-screen{padding:12px;overflow:auto;place-items:start center}
    .select-inner{padding:20px 0}
    .captains{grid-template-columns:repeat(2,minmax(0,1fr))}
    .captain-card{min-height:224px}
    .captain-card:last-child{grid-column:1/-1;width:50%;justify-self:center}
    .shirt-icon{width:64px;height:75px}
  }
</style>
</head>
<body>
<div id="scene"></div>
<div class="ui">
  <header class="top">
    <div class="title">十二碼足球 3D</div>
    <div class="shots" id="shots" aria-label="五球結果"></div>
    <div class="actions">
      <button class="icon" id="sound" type="button" title="開關音效">♪</button>
      <button class="icon" id="restart" type="button" title="重新開始">↻</button>
    </div>
  </header>
  <div class="middle">
    <div class="aim-note" id="note">移動準星，點球門射門</div>
    <div class="timer"><span id="timerBar"></span></div>
  </div>
  <footer class="bottom">
    <div class="roster" id="roster"></div>
    <div class="dashboard">
      <div>
        <div class="player-name" id="playerName"></div>
        <div class="nation" id="nation"></div>
      </div>
      <div class="stats">
        <div class="stat"><b>體力</b><span class="bar stamina"><span id="staminaBar"></span></span><span id="staminaValue"></span></div>
        <div class="stat"><b>力量</b><span class="bar power"><span id="powerBar"></span></span><span id="powerValue"></span></div>
        <div class="stat"><b>智慧</b><span class="bar smart"><span id="smartBar"></span></span><span id="smartValue"></span></div>
      </div>
      <div class="score-box">
        <div class="score" id="score">進球 0 / 5</div>
        <div class="upload">
          <label for="avatar">守門員頭像</label>
          <input id="avatar" type="file" accept="image/png,image/jpeg,image/webp">
          <button id="clearAvatar" type="button">預設</button>
        </div>
      </div>
    </div>
  </footer>
</div>
<div class="result" id="result">
  <div class="result-panel">
    <h2 id="resultTitle">比賽完成</h2>
    <p id="resultText"></p>
    <button id="again" type="button">明星隊長再戰</button>
  </div>
</div>
<div class="select-screen" id="selectScreen">
  <div class="select-inner">
    <h1>選擇明星隊長</h1>
    <p>選中的球員先踢，另外四位隊長接著上場</p>
    <div class="captains" id="captains"></div>
  </div>
</div>
<div class="fallback" id="fallback">這個瀏覽器無法啟動 3D 畫面，請改用最新版 Chrome 或 Safari。</div>

<script src="十二碼足球3D_assets/node_modules/three/build/three.min.js"></script>
<script>
(() => {
  'use strict';
  if(!window.THREE){
    document.getElementById('fallback').style.display='grid';
    return;
  }

  const PLAYERS = [
    {name:'Lionel Messi',short:'梅西',nation:'阿根廷隊長',number:10,height:.94,skin:0xd7a477,hair:0x241b17,shirt:0x78b9e8,secondary:0xffffff,shorts:0xffffff,power:84,smart:99,stamina:86,foot:'left',beard:true},
    {name:'Cristiano Ronaldo',short:'C 羅',nation:'葡萄牙隊長',number:7,height:1.06,skin:0xc98f65,hair:0x171412,shirt:0xb21f32,secondary:0x1a7d42,shorts:0x126138,power:99,smart:89,stamina:96,foot:'right'},
    {name:'Kylian Mbappé',short:'姆巴佩',nation:'法國隊長',number:10,height:1.00,skin:0x6e422d,hair:0x151210,shirt:0x163c8c,secondary:0xd62836,shorts:0x102c68,power:95,smart:92,stamina:98,foot:'right'},
    {name:'Harry Kane',short:'凱恩',nation:'英格蘭隊長',number:9,height:1.07,skin:0xe0b18a,hair:0x674831,shirt:0xf2f2ee,secondary:0x273b68,shorts:0x263454,power:94,smart:94,stamina:89,foot:'right',beard:true},
    {name:'Son Heung-min',short:'孫興慜',nation:'韓國隊長',number:7,height:1.03,skin:0xe0b18a,hair:0x171515,shirt:0xd72f3f,secondary:0x172b45,shorts:0x172b45,power:91,smart:96,stamina:94,foot:'right'}
  ];

  const sceneHost = document.getElementById('scene');
  const note = document.getElementById('note');
  const timerBar = document.getElementById('timerBar');
  const shotsEl = document.getElementById('shots');
  const rosterEl = document.getElementById('roster');
  const playerNameEl = document.getElementById('playerName');
  const nationEl = document.getElementById('nation');
  const staminaBar = document.getElementById('staminaBar');
  const powerBar = document.getElementById('powerBar');
  const smartBar = document.getElementById('smartBar');
  const staminaValue = document.getElementById('staminaValue');
  const powerValue = document.getElementById('powerValue');
  const smartValue = document.getElementById('smartValue');
  const scoreEl = document.getElementById('score');
  const result = document.getElementById('result');
  const selectScreen = document.getElementById('selectScreen');
  const captainsEl = document.getElementById('captains');
  let soundOn = true;
  let audio;

  const renderer = new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  sceneHost.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x7bb9d4);
  scene.fog = new THREE.Fog(0x8eb6bc,32,68);
  const camera = new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,120);
  camera.position.set(0,4.7,12.8);
  const cameraTarget = new THREE.Vector3(0,1.8,-9.5);
  camera.lookAt(cameraTarget);

  scene.add(new THREE.HemisphereLight(0xc9edff,0x173d22,2.3));
  const sun = new THREE.DirectionalLight(0xfff4d4,3.6);
  sun.position.set(-8,16,9);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  sun.shadow.camera.left=-18;sun.shadow.camera.right=18;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-12;
  scene.add(sun);
  const rim = new THREE.DirectionalLight(0x8cc7ff,1.3);
  rim.position.set(10,8,-20);
  scene.add(rim);

  function pitchTexture(){
    const c=document.createElement('canvas');c.width=1024;c.height=1024;
    const x=c.getContext('2d');
    x.fillStyle='#247b3d';x.fillRect(0,0,1024,1024);
    for(let i=0;i<10;i++){x.fillStyle=i%2?'#2c8746':'#267f40';x.fillRect(i*103,0,103,1024)}
    x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=7;
    x.strokeRect(8,8,1008,1008);
    x.beginPath();x.moveTo(512,0);x.lineTo(512,1024);x.stroke();
    x.strokeRect(294,0,436,260);
    x.strokeRect(382,0,260,110);
    x.beginPath();x.arc(512,180,7,0,Math.PI*2);x.fillStyle='#fff';x.fill();
    x.beginPath();x.arc(512,180,120,.22*Math.PI,.78*Math.PI);x.stroke();
    const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
  }
  const field = new THREE.Mesh(
    new THREE.PlaneGeometry(42,68),
    new THREE.MeshStandardMaterial({map:pitchTexture(),roughness:.92,metalness:0})
  );
  field.rotation.x=-Math.PI/2;field.position.set(0,-.02,-12);field.receiveShadow=true;scene.add(field);

  function box(w,h,d,color,x,y,z){
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color,roughness:.75}));
    m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;
  }
  box(42,5,5,0x46535b,0,2.3,-29);
  box(42,3.5,4,0x56616a,0,1.3,21);
  box(5,4,62,0x4b575f,-23,1.6,-7);
  box(5,4,62,0x4b575f,23,1.6,-7);
  const crowdGeo=new THREE.BufferGeometry();
  const crowdPos=[],crowdCol=[];
  const colors=[new THREE.Color(0xf2d05a),new THREE.Color(0xe85b4a),new THREE.Color(0xe8eef2),new THREE.Color(0x59a5e8)];
  for(let i=0;i<1500;i++){
    const back=i<600;
    crowdPos.push((Math.random()-.5)*40,1+Math.random()*4,back?-26.2-Math.random()*2:(Math.random()<.5?-20.8:20.8));
    const cc=colors[i%colors.length];crowdCol.push(cc.r,cc.g,cc.b);
  }
  crowdGeo.setAttribute('position',new THREE.Float32BufferAttribute(crowdPos,3));
  crowdGeo.setAttribute('color',new THREE.Float32BufferAttribute(crowdCol,3));
  const crowd=new THREE.Points(crowdGeo,new THREE.PointsMaterial({size:.11,vertexColors:true}));
  scene.add(crowd);

  const goalGroup=new THREE.Group();goalGroup.position.z=-18;scene.add(goalGroup);
  const postMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.35});
  const postGeo=new THREE.CylinderGeometry(.095,.095,4.6,18);
  const leftPost=new THREE.Mesh(postGeo,postMat);leftPost.position.set(-5,2.3,0);leftPost.castShadow=true;
  const rightPost=leftPost.clone();rightPost.position.x=5;
  const crossbar=new THREE.Mesh(new THREE.CylinderGeometry(.095,.095,10,18),postMat);
  crossbar.rotation.z=Math.PI/2;crossbar.position.set(0,4.55,0);crossbar.castShadow=true;
  goalGroup.add(leftPost,rightPost,crossbar);
  const netMat=new THREE.LineBasicMaterial({color:0xdde8e3,transparent:true,opacity:.5});
  const netPoints=[];
  for(let x=-5;x<=5.01;x+=.5){netPoints.push(x,0,-1.7,x,4.5,-1.7)}
  for(let y=0;y<=4.51;y+=.45){netPoints.push(-5,y,-1.7,5,y,-1.7)}
  for(let z=-1.7;z<=0.01;z+=.34){
    netPoints.push(-5,0,z,-5,4.5,z,5,0,z,5,4.5,z);
  }
  const netGeo=new THREE.BufferGeometry();netGeo.setAttribute('position',new THREE.Float32BufferAttribute(netPoints,3));
  goalGroup.add(new THREE.LineSegments(netGeo,netMat));
  const aimPlane=new THREE.Mesh(
    new THREE.PlaneGeometry(10,4.5),
    new THREE.MeshBasicMaterial({transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false})
  );
  aimPlane.position.set(0,2.25,-17.88);scene.add(aimPlane);
  const reticle=new THREE.Mesh(
    new THREE.TorusGeometry(.28,.035,12,32),
    new THREE.MeshBasicMaterial({color:0xffd847,depthTest:false})
  );
  reticle.position.set(0,2.2,-17.82);reticle.renderOrder=20;scene.add(reticle);

  function transparentMaterial(color,opacity=.84){
    return new THREE.MeshStandardMaterial({color,roughness:.64,transparent:true,opacity});
  }
  function cylinderBetween(radius,length,material){
    const mesh=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius*.94,length,12),material);
    mesh.position.y=-length/2;mesh.castShadow=true;return mesh;
  }
  function numberTexture(number,color='#17231a'){
    const c=document.createElement('canvas');c.width=128;c.height=128;
    const x=c.getContext('2d');x.clearRect(0,0,128,128);
    x.fillStyle='rgba(255,255,255,.92)';x.beginPath();x.arc(64,64,48,0,Math.PI*2);x.fill();
    x.fillStyle=color;x.font='900 58px Arial';x.textAlign='center';x.textBaseline='middle';x.fillText(number,64,68);
    const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
  }
  function createHumanoid(profile,keeper=false){
    const root=new THREE.Group();
    const scale=profile.height||1;root.scale.setScalar(scale);
    const skin=transparentMaterial(profile.skin,keeper?1:.84);
    const shirt=transparentMaterial(profile.shirt,keeper?1:.84);
    const shorts=transparentMaterial(profile.shorts||profile.secondary,keeper?1:.84);
    const sock=transparentMaterial(profile.secondary,keeper?1:.84);
    const dark=transparentMaterial(profile.hair,keeper?1:.84);
    const torso=new THREE.Mesh(new THREE.CylinderGeometry(.38,.48,.9,16),shirt);
    torso.position.y=1.62;torso.castShadow=true;root.add(torso);
    const stripe=new THREE.Mesh(new THREE.BoxGeometry(.16,.75,.05),transparentMaterial(profile.secondary,keeper?1:.8));
    stripe.position.set(0,1.63,.405);root.add(stripe);
    const number=new THREE.Mesh(new THREE.PlaneGeometry(.34,.34),new THREE.MeshBasicMaterial({map:numberTexture(profile.number),transparent:true,opacity:keeper?1:.88}));
    number.position.set(0,1.62,.44);root.add(number);
    const pelvis=new THREE.Mesh(new THREE.BoxGeometry(.68,.35,.4),shorts);pelvis.position.y=1.02;pelvis.castShadow=true;root.add(pelvis);
    const head=new THREE.Mesh(new THREE.SphereGeometry(.31,24,18),skin);head.position.y=2.42;head.castShadow=true;root.add(head);
    const hair=new THREE.Mesh(new THREE.SphereGeometry(.315,20,14,0,Math.PI*2,0,Math.PI*.48),dark);
    hair.position.y=2.51;hair.castShadow=true;root.add(hair);
    if(profile.beard){
      const beard=new THREE.Mesh(new THREE.SphereGeometry(.25,18,12,0,Math.PI*2,Math.PI*.48,Math.PI*.35),dark);
      beard.position.set(0,2.34,.055);beard.scale.set(1,.7,.92);root.add(beard);
    }
    const rigs={arms:[],legs:[]};
    [-1,1].forEach(side=>{
      const shoulder=new THREE.Group();shoulder.position.set(side*.47,1.9,0);root.add(shoulder);
      shoulder.add(cylinderBetween(.105,.65,shirt));
      const elbow=new THREE.Group();elbow.position.y=-.63;shoulder.add(elbow);elbow.add(cylinderBetween(.09,.58,skin));
      rigs.arms.push({upper:shoulder,lower:elbow});
      const hip=new THREE.Group();hip.position.set(side*.22,.94,0);root.add(hip);
      hip.add(cylinderBetween(.14,.72,shorts));
      const knee=new THREE.Group();knee.position.y=-.7;hip.add(knee);knee.add(cylinderBetween(.12,.68,sock));
      const shoe=new THREE.Mesh(new THREE.BoxGeometry(.26,.16,.43),transparentMaterial(0x151918,keeper?1:.84));
      shoe.position.set(0,-.72,-.1);knee.add(shoe);
      rigs.legs.push({upper:hip,lower:knee});
    });
    root.userData.rigs=rigs;
    root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
    return root;
  }

  const keeperProfile={height:1.03,skin:0xd5a077,hair:0x241a16,shirt:0x5dce67,secondary:0xe8ff58,shorts:0x183a25,number:1};
  const keeper=createHumanoid(keeperProfile,true);keeper.position.set(0,0,-17.1);scene.add(keeper);
  keeper.userData.baseY=0;
  let avatarPlane=null;
  function setKeeperAvatar(data){
    if(avatarPlane){keeper.remove(avatarPlane);avatarPlane.material.map?.dispose();avatarPlane.material.dispose();avatarPlane.geometry.dispose();avatarPlane=null}
    if(!data)return;
    const loader=new THREE.TextureLoader();
    loader.load(data,texture=>{
      texture.colorSpace=THREE.SRGBColorSpace;
      avatarPlane=new THREE.Mesh(new THREE.CircleGeometry(.29,32),new THREE.MeshBasicMaterial({map:texture,transparent:true}));
      avatarPlane.position.set(0,2.42,.305);keeper.add(avatarPlane);
    });
  }

  const ball=new THREE.Mesh(
    new THREE.SphereGeometry(.23,32,20),
    new THREE.MeshStandardMaterial({map:(()=>{
      const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');
      x.fillStyle='#f4f4ef';x.fillRect(0,0,256,256);x.fillStyle='#1a211c';
      [[128,128],[38,56],[218,63],[53,208],[211,207]].forEach(([a,b])=>{x.beginPath();x.arc(a,b,28,0,Math.PI*2);x.fill()});
      const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
    })(),roughness:.72})
  );
  ball.position.set(0,.24,0);ball.castShadow=true;scene.add(ball);

  let lineup=PLAYERS.slice();
  let currentPlayer=null,currentIndex=0,shots=[],state='selecting',roundStart=performance.now(),roundSeconds=7;
  let animation=null,staminaNow=100,lastTime=performance.now();
  const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2(),aimPoint=new THREE.Vector3(0,2.2,-17.85);

  function renderHud(){
    shotsEl.innerHTML='';
    for(let i=0;i<5;i++){const d=document.createElement('span');d.className='dot'+(shots[i]?' '+shots[i]:'');shotsEl.appendChild(d)}
    rosterEl.innerHTML='';
    lineup.forEach((p,i)=>{
      const n=document.createElement('div');n.className='roster-item'+(i===currentIndex?' active':'')+(i<currentIndex?' done':'');
      n.textContent=p.short;rosterEl.appendChild(n);
    });
    const p=lineup[Math.min(currentIndex,4)];
    playerNameEl.textContent=`${p.short} · ${p.number}`;
    nationEl.textContent=p.nation;
    staminaBar.style.width=`${staminaNow}%`;powerBar.style.width=`${p.power}%`;smartBar.style.width=`${p.smart}%`;
    staminaValue.textContent=Math.round(staminaNow);powerValue.textContent=p.power;smartValue.textContent=p.smart;
    scoreEl.textContent=`進球 ${shots.filter(x=>x==='goal').length} / 5`;
  }
  function setPlayer(index){
    if(currentPlayer){scene.remove(currentPlayer)}
    currentIndex=index;const p=lineup[index];
    staminaNow=p.stamina;
    currentPlayer=createHumanoid(p,false);
    currentPlayer.position.set(p.foot==='left'?1.7:-1.7,0,4.8);
    currentPlayer.rotation.y=0;
    scene.add(currentPlayer);
    state='aiming';roundStart=performance.now();roundSeconds=Math.max(4.6,7-index*.5);
    note.textContent=`${p.short}上場：點球門射門`;
    reticle.visible=true;renderHud();
  }
  function resetPose(player){
    const r=player.userData.rigs;
    r.arms.forEach(a=>{a.upper.rotation.set(0,0,0);a.lower.rotation.set(0,0,0)});
    r.legs.forEach(l=>{l.upper.rotation.set(0,0,0);l.lower.rotation.set(0,0,0)});
  }
  function tone(freq,duration,delay=0){
    if(!soundOn)return;
    audio||=new (AudioContext||webkitAudioContext)();
    const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,audio.currentTime+delay);g.gain.exponentialRampToValueAtTime(.16,audio.currentTime+delay+.01);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+delay+duration);
    o.connect(g).connect(audio.destination);o.start(audio.currentTime+delay);o.stop(audio.currentTime+delay+duration+.03);
  }
  function updateAim(event){
    if(state!=='aiming')return;
    const rect=renderer.domElement.getBoundingClientRect();
    pointer.x=((event.clientX-rect.left)/rect.width)*2-1;
    pointer.y=-((event.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(pointer,camera);
    const hit=raycaster.intersectObject(aimPlane)[0];
    if(hit){
      aimPoint.copy(hit.point);
      aimPoint.x=THREE.MathUtils.clamp(aimPoint.x,-4.65,4.65);
      aimPoint.y=THREE.MathUtils.clamp(aimPoint.y,.45,4.25);
      reticle.position.set(aimPoint.x,aimPoint.y,-17.82);
    }
  }
  function missByTimeout(){
    if(state!=='aiming')return;
    state='result';shots.push('miss');note.textContent='時間到，這球射失';tone(85,.25);
    setTimeout(nextPlayer,1000);renderHud();
  }
  function shoot(){
    if(state!=='aiming')return;
    state='run';reticle.visible=false;
    const p=lineup[currentIndex];
    const elapsed=(performance.now()-roundStart)/1000;
    staminaNow=Math.max(24,p.stamina-elapsed*4.2);
    const effectivePower=p.power*(.46+.54*staminaNow/100);
    const intelligence=p.smart;
    const fatigue=(100-staminaNow)/100;
    const failChance=Math.max(.006,.14*(1-intelligence/100)+.11*fatigue);
    const failed=Math.random()<failChance;
    const spread=(100-intelligence)*.012*(1+fatigue);
    const actual=aimPoint.clone();
    actual.x+=THREE.MathUtils.randFloatSpread(spread);
    actual.y+=THREE.MathUtils.randFloatSpread(spread*.6);
    actual.x=THREE.MathUtils.clamp(actual.x,-5.6,5.6);actual.y=THREE.MathUtils.clamp(actual.y,.15,4.8);
    if(failed){actual.x=aimPoint.x<0?-6.2:6.2;actual.y=.45}
    const flightTime=THREE.MathUtils.clamp(1.02-effectivePower*.0062,.36,.68);
    const corner=Math.abs(actual.x)>4.1||actual.y>3.75;
    const guessed=Math.random()<.69;
    let keeperEnd=actual.clone();
    if(!guessed){keeperEnd.x=[-3.3,0,3.3][Math.floor(Math.random()*3)];keeperEnd.y=Math.random()<.35?3.1:1.5}
    keeperEnd.x=THREE.MathUtils.clamp(keeperEnd.x,-3.7,3.7);
    keeperEnd.y=THREE.MathUtils.clamp(keeperEnd.y,1.05,3.25);
    const saveChance=guessed?THREE.MathUtils.clamp(.76-(effectivePower-70)*.008-(corner?.21:0),.12,.78):.035;
    const saved=!failed&&Math.random()<saveChance;
    animation={
      start:performance.now(),kickAt:.82,ballStarted:false,p,actual,keeperEnd,saved,failed,
      flightTime,effectivePower,startPlayer:currentPlayer.position.clone(),
      ballStart:new THREE.Vector3(0,.24,0),keeperStart:keeper.position.clone()
    };
    renderHud();tone(120,.1);
  }
  function updateAction(now){
    if(!animation)return;
    const a=animation,t=(now-a.start)/1000,r=currentPlayer.userData.rigs;
    if(t<a.kickAt){
      const run=Math.min(1,t/a.kickAt);
      currentPlayer.position.z=THREE.MathUtils.lerp(a.startPlayer.z,.75,run);
      currentPlayer.position.x=THREE.MathUtils.lerp(a.startPlayer.x,a.p.foot==='left'?.38:-.38,run);
      const cycle=Math.sin(run*Math.PI*5)*.55;
      r.legs[0].upper.rotation.x=cycle;r.legs[1].upper.rotation.x=-cycle;
      r.arms[0].upper.rotation.x=-cycle*.65;r.arms[1].upper.rotation.x=cycle*.65;
      if(run>.68){
        const k=(run-.68)/.32;
        const kickIndex=a.p.foot==='left'?0:1;
        const plantIndex=1-kickIndex;
        r.legs[kickIndex].upper.rotation.x=THREE.MathUtils.lerp(-.35,1.28,k);
        r.legs[kickIndex].lower.rotation.x=THREE.MathUtils.lerp(.55,-.25,k);
        r.legs[plantIndex].upper.rotation.x=-.18;
        currentPlayer.rotation.z=(a.p.foot==='left'?-1:1)*k*.09;
      }
      return;
    }
    if(!a.ballStarted){
      a.ballStarted=true;a.ballStartTime=now;state='flight';
      tone(150+a.effectivePower*1.45,.14);
    }
    const ft=(now-a.ballStartTime)/1000/a.flightTime;
    const q=Math.min(1,ft);
    ball.position.lerpVectors(a.ballStart,a.actual,q);
    ball.position.y+=Math.sin(q*Math.PI)*(.7+Math.abs(a.actual.y-1.8)*.12);
    ball.rotation.x+=.24;ball.rotation.z+=.18;
    const dive=THREE.MathUtils.smoothstep(q,0,.86);
    keeper.position.x=THREE.MathUtils.lerp(a.keeperStart.x,a.keeperEnd.x,dive);
    keeper.position.y=THREE.MathUtils.lerp(0,Math.max(0,a.keeperEnd.y-1.3),dive);
    keeper.rotation.z=THREE.MathUtils.lerp(0,-a.keeperEnd.x*.12,dive);
    const kr=keeper.userData.rigs;
    kr.arms[0].upper.rotation.z=-1.25;kr.arms[1].upper.rotation.z=1.25;
    if(ft>=1){
      animation=null;state='result';
      shots.push(a.failed?'miss':a.saved?'save':'goal');
      note.textContent=a.failed?'踢偏了！':a.saved?'守門員撲到了！':'漂亮進球！';
      if(a.saved){ball.position.copy(a.keeperEnd).add(new THREE.Vector3(0,.25,.15));tone(92,.25)}
      else if(!a.failed){tone(480,.12);tone(720,.2,.12)}
      renderHud();setTimeout(nextPlayer,1300);
    }
  }
  function nextPlayer(){
    if(shots.length>=5){finish();return}
    ball.position.set(0,.24,0);keeper.position.set(0,0,-17.1);keeper.rotation.set(0,0,0);resetPose(keeper);
    setPlayer(shots.length);
  }
  function finish(){
    state='finished';reticle.visible=false;
    const goals=shots.filter(x=>x==='goal').length;
    document.getElementById('resultTitle').textContent=goals>=4?'世界級表現！':goals>=2?'隊長完成挑戰':'再戰一次';
    document.getElementById('resultText').textContent=`五位明星隊長合計踢進 ${goals} 球。`;
    result.classList.add('show');
  }
  function startWithCaptain(index){
    lineup=[PLAYERS[index],...PLAYERS.filter((_,i)=>i!==index)];
    selectScreen.classList.add('hide');
    shots=[];animation=null;result.classList.remove('show');
    ball.position.set(0,.24,0);keeper.position.set(0,0,-17.1);keeper.rotation.set(0,0,0);resetPose(keeper);
    setPlayer(0);
  }
  function openSelection(){
    state='selecting';animation=null;shots=[];result.classList.remove('show');
    if(currentPlayer){scene.remove(currentPlayer);currentPlayer=null}
    ball.position.set(0,.24,0);keeper.position.set(0,0,-17.1);keeper.rotation.set(0,0,0);resetPose(keeper);
    reticle.visible=false;selectScreen.classList.remove('hide');
    renderHud();
  }
  function restart(){
    shots=[];animation=null;result.classList.remove('show');
    ball.position.set(0,.24,0);keeper.position.set(0,0,-17.1);keeper.rotation.set(0,0,0);resetPose(keeper);
    setPlayer(0);
  }

  renderer.domElement.addEventListener('pointermove',updateAim);
  renderer.domElement.addEventListener('pointerdown',event=>{updateAim(event);shoot()});
  document.getElementById('restart').addEventListener('click',openSelection);
  document.getElementById('again').addEventListener('click',openSelection);
  document.getElementById('sound').addEventListener('click',event=>{soundOn=!soundOn;event.currentTarget.textContent=soundOn?'♪':'×'});
  document.getElementById('avatar').addEventListener('change',event=>{
    const file=event.target.files?.[0];if(!file)return;
    const reader=new FileReader();reader.onload=()=>{localStorage.setItem('keeper3dAvatar',reader.result);setKeeperAvatar(reader.result)};reader.readAsDataURL(file);
  });
  document.getElementById('clearAvatar').addEventListener('click',()=>{localStorage.setItem('keeper3dAvatar','');setKeeperAvatar('')});
  setKeeperAvatar(localStorage.getItem('keeper3dAvatar')||'');
  function renderCaptainSelection(){
    captainsEl.innerHTML='';
    PLAYERS.forEach((p,index)=>{
      const card=document.createElement('button');
      card.type='button';card.className='captain-card';
      card.style.setProperty('--shirt',`#${p.shirt.toString(16).padStart(6,'0')}`);
      card.style.setProperty('--secondary',`#${p.secondary.toString(16).padStart(6,'0')}`);
      card.innerHTML=`
        <span class="shirt-icon">${p.number}</span>
        <h2>${p.short}</h2>
        <div class="country">${p.nation}</div>
        <div class="mini-stats">
          <div class="mini-stat"><b>體力</b><span class="bar stamina"><span style="width:${p.stamina}%"></span></span><span>${p.stamina}</span></div>
          <div class="mini-stat"><b>力量</b><span class="bar power"><span style="width:${p.power}%"></span></span><span>${p.power}</span></div>
          <div class="mini-stat"><b>智慧</b><span class="bar smart"><span style="width:${p.smart}%"></span></span><span>${p.smart}</span></div>
        </div>
        <span class="choose">選他先上場</span>`;
      card.addEventListener('click',()=>startWithCaptain(index));
      captainsEl.appendChild(card);
    });
  }
  renderCaptainSelection();

  function resize(){
    renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    if(innerWidth<680){camera.position.set(0,4.9,15.5);cameraTarget.set(0,1.8,-10.5)}
    else{camera.position.set(0,4.7,12.8);cameraTarget.set(0,1.8,-9.5)}
    camera.lookAt(cameraTarget);
  }
  addEventListener('resize',resize);
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min(.04,(now-lastTime)/1000);lastTime=now;
    if(state==='aiming'){
      const elapsed=(now-roundStart)/1000;
      staminaNow=Math.max(24,lineup[currentIndex].stamina-elapsed*4.2);
      const remain=Math.max(0,roundSeconds-elapsed),ratio=remain/roundSeconds;
      timerBar.style.width=`${ratio*100}%`;timerBar.classList.toggle('danger',ratio<.32);
      if(remain<=0)missByTimeout();
      renderHud();
      const rigs=keeper.userData.rigs,sway=Math.sin(now*.0024)*.22;
      keeper.position.x=Math.sin(now*.0018)*1.8;
      rigs.legs[0].upper.rotation.x=sway;rigs.legs[1].upper.rotation.x=-sway;
    }
    updateAction(now);
    camera.position.x=THREE.MathUtils.lerp(camera.position.x,currentPlayer?currentPlayer.position.x*.05:0,dt*1.4);
    camera.lookAt(cameraTarget);
    renderer.render(scene,camera);
  }
  staminaNow=lineup[0].stamina;renderHud();resize();requestAnimationFrame(frame);
})();
</script>
<script src="offline-register.js" defer></script>
</body>
</html>
