name: Fly Brain Windows Portable
on:
  push:
    branches: [build/fly-brain-windows-portable]
    paths: ['tools/fly-brain-windows/**', '.github/workflows/fly-brain-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools/fly-brain-windows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build DLL, bundle Python, and test the EXE
        shell: pwsh
        working-directory: tools/fly-brain-windows
        env:
          PYTHONUTF8: '1'
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'Visual Studio C++ tools not found' }
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          ./build-windows.ps1
      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: fly-brain-windows-x64
          path: tools/fly-brain-windows/dist/果蠅腦-Windows-x64.zip
          if-no-files-found: error
          retention-days: 90
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          path: tools/fly-brain-windows/dist/*.log
          if-no-files-found: ignore
