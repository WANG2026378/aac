<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="教學網">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FF6B6B">
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三國識字大戰 — 國小一至四年級國字學習</title>
<style>
:root{
  --ink:#2b1d0e; --paper:#f3e6c8; --paper2:#e8d5a8; --gold:#c9a227; --gold2:#e8c96a;
  --red:#8e2f24; --wei:#2f5b8e; --shu:#2f7d4f; --wu:#a33b2e; --qun:#6b5b95;
  --dark:#1a120a; --panel:#faf3e0;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"Noto Serif TC","BiauKai","DFKai-SB","Kaiti TC","Microsoft JhengHei",serif;
  background:radial-gradient(ellipse at 50% 30%, #3a2a16 0%, #1a120a 75%);
  color:var(--ink); overflow:hidden; user-select:none;
}
.screen{display:none; position:absolute; inset:0; overflow:hidden;}
.screen.on{display:flex; flex-direction:column;}

/* ===== 標題畫面 ===== */
#scr-title{align-items:center; justify-content:center; text-align:center;
  background:radial-gradient(ellipse at 50% 25%, #4a3418 0%, #16100a 80%);}
#scr-title h1{
  font-size:clamp(44px,8vw,88px); margin:8px 0; letter-spacing:12px; color:var(--gold2);
  text-shadow:0 0 24px rgba(232,201,106,.35), 0 3px 0 #6b4d12;
}
#scr-title .sub{color:#d8c69a; font-size:clamp(15px,2.2vw,22px); letter-spacing:6px; margin-bottom:26px;}
.force-row{display:flex; gap:26px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
.force-card{
  width:180px; padding:18px 12px 14px; border-radius:14px; cursor:pointer;
  background:linear-gradient(180deg,#f7ecd2,#e6d3a6); border:3px solid #7a5c22;
  box-shadow:0 8px 22px rgba(0,0,0,.5); transition:transform .15s;
}
.force-card:hover{transform:translateY(-6px) scale(1.03);}
.force-card .fc-flag{font-size:52px; font-weight:900; line-height:1.1;}
.force-card .fc-name{font-size:19px; margin-top:6px; font-weight:700;}
.force-card .fc-desc{font-size:12.5px; color:#5a4a28; margin-top:6px; line-height:1.5;}
.f-wei .fc-flag{color:var(--wei);} .f-shu .fc-flag{color:var(--shu);} .f-wu .fc-flag{color:var(--wu);}
.title-links{margin-top:30px; display:flex; gap:14px; justify-content:center;}
.title-note{margin-top:22px; color:#9a8a66; font-size:12.5px; line-height:1.7;}

/* ===== 共用按鈕 ===== */
.btn{
  display:inline-block; padding:9px 20px; border-radius:9px; cursor:pointer; border:2px solid #6d5017;
  background:linear-gradient(180deg,#e8c96a,#c9a227); color:#3a2a08; font-weight:700;
  font-family:inherit; font-size:15px; letter-spacing:2px; box-shadow:0 3px 8px rgba(0,0,0,.4);
}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{background:linear-gradient(180deg,#efe3c2,#dcc890); }
.btn.red{background:linear-gradient(180deg,#c05a4a,#8e2f24); color:#ffe9d8; border-color:#5c1d15;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ===== 地圖畫面 ===== */
#scr-map{background:#20180e;}
.topbar{
  display:flex; align-items:center; gap:14px; padding:8px 16px; flex-wrap:wrap;
  background:linear-gradient(180deg,#3d2c14,#2a1e0d); border-bottom:2px solid #6d5017; color:#f0e2bb;
}
.topbar .tb-title{font-size:20px; font-weight:900; letter-spacing:3px; color:var(--gold2);}
.topbar .tb-stat{font-size:14.5px; background:#00000038; padding:4px 12px; border-radius:8px;}
.topbar .spacer{flex:1;}
#map-wrap{flex:1; position:relative; overflow:hidden;}
#map-svg{width:100%; height:100%; display:block;}
.city-node{cursor:pointer;}
.city-node:hover .city-ring{stroke-width:4;}
#map-hint{
  position:absolute; left:50%; bottom:12px; transform:translateX(-50%);
  background:#000000a8; color:#f5e8c4; padding:7px 18px; border-radius:20px; font-size:14px; letter-spacing:1px;
  pointer-events:none; white-space:nowrap;
}

/* ===== 戰鬥畫面 ===== */
#scr-battle{background:radial-gradient(ellipse at 50% 20%, #4a2c18 0%, #170f08 80%); color:#f2e6c8;}
.battle-head{text-align:center; padding:10px 0 2px; font-size:21px; letter-spacing:4px; color:var(--gold2); font-weight:900;}
.battle-sub{text-align:center; font-size:13px; color:#c8b488; margin-bottom:4px;}
.battle-arena{display:flex; align-items:stretch; justify-content:center; gap:2vw; padding:6px 12px;}
.fighter{width:min(240px,26vw); text-align:center;}
.fighter .pbox{border-radius:18px; overflow:hidden; border:1px solid #f0d878; padding:4px;
  box-shadow:0 12px 28px rgba(0,0,0,.65), inset 0 0 0 1px rgba(255,245,205,.25);
  background:linear-gradient(145deg,#f0d878,#7a5c22 38%,#160e06 72%);}
.fighter .pbox svg,.fighter .pbox .portrait-art{display:block; width:100%; height:auto; border-radius:13px; box-shadow:0 0 0 1px rgba(0,0,0,.55);}
.fighter .pbox .portrait-art{aspect-ratio:5/6; object-fit:cover; object-position:center 20%; background:#111;}
.fighter .fname{font-size:18px; font-weight:900; margin-top:6px; letter-spacing:2px;}
.fighter .ftitle{font-size:12px; color:#cdb98c;}
.hpbar{height:14px; background:#00000070; border-radius:8px; margin-top:6px; border:1px solid #00000090; overflow:hidden;}
.hpbar i{display:block; height:100%; background:linear-gradient(90deg,#4caf50,#8bc34a); border-radius:8px; transition:width .4s;}
.hpbar.enemy i{background:linear-gradient(90deg,#d84335,#f0704f);}
.hp-num{font-size:12px; margin-top:3px; color:#e8d9ad;}
.vs-mid{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-width:120px;}
.vs-mark{font-size:40px; font-weight:900; color:#e8c96a; text-shadow:0 0 16px #c9a22766;}
#combo-tag{font-size:14px; color:#ffd76e; min-height:20px; font-weight:700;}
#battle-log{font-size:13.5px; color:#f0dfae; min-height:22px; text-align:center; padding:0 10px;}
.q-panel{
  margin:6px auto 0; width:min(860px,94vw); background:linear-gradient(180deg,#f7ecd2,#eadbb2);
  border:3px solid #7a5c22; border-radius:16px; padding:14px 18px 16px; color:var(--ink);
  box-shadow:0 10px 30px rgba(0,0,0,.6);
}
.q-type{font-size:13px; color:#8a6a1e; font-weight:700; letter-spacing:2px;}
.q-text{font-size:clamp(20px,3vw,30px); font-weight:900; margin:6px 0 12px; line-height:1.45;}
.q-text .bigchar{font-size:1.6em; color:var(--red); padding:0 4px;}
.opt-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.opt{
  padding:12px 10px; border-radius:10px; border:2px solid #9a7b33; background:#fdf6e2;
  font-size:clamp(17px,2.4vw,23px); font-weight:700; cursor:pointer; text-align:center; font-family:inherit;
  transition:transform .1s;
}
.opt:hover{background:#fff; transform:scale(1.02);}
.opt.correct{background:#c9e8c0; border-color:#3d7a35;}
.opt.wrong{background:#eebfb5; border-color:#8e2f24;}
.opt:disabled{cursor:default;}
.q-feedback{min-height:24px; font-size:14.5px; margin-top:9px; font-weight:700; color:#5a4a1c; line-height:1.5;}
.battle-foot{text-align:center; padding:8px;}

/* ===== 圖鑑 / 生字簿 ===== */
.page{flex:1; overflow-y:auto; padding:16px 20px 40px;}
.page-inner{max-width:1080px; margin:0 auto;}
.gal-tabs{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.gtab{padding:7px 18px; border-radius:20px; border:2px solid #6d5017; cursor:pointer;
  background:#3a2c14; color:#d8c69a; font-family:inherit; font-size:15px; font-weight:700; letter-spacing:2px;}
.gtab.on{background:linear-gradient(180deg,#e8c96a,#c9a227); color:#3a2a08;}
.gal-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px;}
.gal-card{background:linear-gradient(180deg,#fff8df 0%,#ead39b 66%,#d2ac5a 100%); border:1px solid #8a681f; border-radius:14px;
  overflow:hidden; cursor:pointer; text-align:center; padding:6px 6px 10px; transition:transform .12s, box-shadow .12s;
  box-shadow:0 8px 18px rgba(0,0,0,.36), inset 0 0 0 1px rgba(255,255,255,.42);}
.gal-card:hover{transform:translateY(-5px); box-shadow:0 12px 24px rgba(0,0,0,.42), 0 0 0 2px rgba(232,201,106,.42);}
.gal-card svg,.gal-card .portrait-art{display:block; width:100%; height:auto; background:#111; border-radius:10px; box-shadow:0 0 0 1px rgba(56,35,10,.45);}
.gal-card .portrait-art{aspect-ratio:5/6; object-fit:cover; object-position:center 20%;}
.gal-card .gname{font-weight:900; font-size:16.5px; margin-top:6px; letter-spacing:2px;}
.gal-card .gtitle{font-size:11.5px; color:#6b5220;}
.gal-card.locked{filter:grayscale(1) brightness(.55);}
.char-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(86px,1fr)); gap:10px;}
.char-cell{background:linear-gradient(180deg,#f7ecd2,#e6d3a6); border:2px solid #7a5c22; border-radius:10px;
  text-align:center; padding:10px 4px 6px; cursor:pointer; transition:transform .1s;}
.char-cell:hover{transform:scale(1.06);}
.char-cell .cc-ch{font-size:34px; font-weight:900;}
.char-cell .cc-zy{font-size:12px; color:#7a5c22;}
.char-cell.learned{box-shadow:0 0 0 3px #4caf5080;}
.dict-stats{color:#d8c69a; font-size:14px; margin-bottom:12px; letter-spacing:1px;}

/* ===== 彈窗 ===== */
.modal-mask{display:none; position:fixed; inset:0; background:#000000b8; z-index:50;
  align-items:center; justify-content:center; padding:18px;}
.modal-mask.on{display:flex;}
.modal{background:linear-gradient(180deg,#faf3e0,#eddfb8); border:3px solid #7a5c22; border-radius:18px;
  max-width:720px; width:100%; max-height:92vh; overflow-y:auto; padding:20px 24px; position:relative;
  box-shadow:0 16px 50px rgba(0,0,0,.7);}
.modal .mx{position:absolute; top:10px; right:14px; font-size:26px; cursor:pointer; color:#7a5c22;
  background:none; border:none; font-weight:900; font-family:inherit;}
.w-detail{display:flex; gap:20px; flex-wrap:wrap;}
.w-detail .wd-left{width:220px; flex-shrink:0;}
.w-detail .wd-left svg,.w-detail .wd-left .portrait-art{width:100%; height:auto; border-radius:16px; border:1px solid #f0d878; background:#111; display:block;
  box-shadow:0 12px 26px rgba(0,0,0,.4), 0 0 0 4px #7a5c22;}
.w-detail .wd-left .portrait-art{aspect-ratio:5/6; object-fit:cover; object-position:center 20%;}
.w-detail .wd-right{flex:1; min-width:260px;}
.wd-name{font-size:30px; font-weight:900; letter-spacing:3px;}
.wd-zi{font-size:15px; color:#6b5220; margin-left:10px;}
.wd-tag{display:inline-block; font-size:12.5px; padding:2px 12px; border-radius:12px; color:#fff; margin:6px 6px 10px 0; letter-spacing:2px;}
.statrow{display:flex; align-items:center; gap:8px; margin:5px 0; font-size:14px;}
.statrow .sl{width:44px; font-weight:700;}
.statbar{flex:1; height:12px; background:#d9c69022; border:1px solid #a98c4d; border-radius:7px; overflow:hidden;}
.statbar i{display:block; height:100%; background:linear-gradient(90deg,#c9a227,#e8c96a);}
.statrow .sv{width:32px; text-align:right; font-weight:900;}
.wd-intro{font-size:15px; line-height:1.9; margin-top:10px; text-align:justify;}
.wd-look{font-size:13.5px; line-height:1.8; margin-top:10px; padding:10px 14px; background:#00000010;
  border-left:4px solid var(--gold); border-radius:6px; color:#4a3a18;}
.char-detail{text-align:center;}
.char-detail .cd-ch{font-size:96px; font-weight:900; line-height:1.15; color:var(--red);
  text-shadow:2px 2px 0 #c9a22740;}
.cd-grid{display:flex; justify-content:center; gap:26px; flex-wrap:wrap; margin:12px 0; font-size:16px;}
.cd-grid b{color:#8a6a1e;}
.cd-words{font-size:18px; letter-spacing:2px; line-height:2;}
.cd-words span{background:#00000012; padding:3px 14px; border-radius:9px; margin:0 6px; display:inline-block;}

/* 結果彈窗 */
#modal-result .modal{text-align:center; max-width:560px;}
#res-title{font-size:34px; font-weight:900; letter-spacing:6px; margin:6px 0 12px;}
#res-body{font-size:16px; line-height:2;}
#res-body .newchar{display:inline-block; background:#c9e8c0; border:1px solid #3d7a35; border-radius:8px;
  padding:1px 10px; margin:3px; font-size:19px; font-weight:900;}

/* 招募彈窗 */
#modal-recruit .modal{max-width:640px;}

@media (max-width:720px){
  .battle-arena .fighter{width:31vw;}
  .vs-mid{min-width:70px;}
  .opt-grid{grid-template-columns:1fr;}
  .force-card{width:150px;}
}
</style>
</head>
<body>

<!-- 標題 -->
<div id="scr-title" class="screen on">
  <h1>三國識字大戰</h1>
  <div class="sub">攻城掠地 × 國小一至四年級國字學習</div>
  <div style="color:#d8c69a; font-size:16px; letter-spacing:3px; margin-bottom:14px;">請選擇你的勢力</div>
  <div class="force-row" id="force-row"></div>
  <div class="title-links">
    <button class="btn ghost" onclick="openGallery(true)">武將圖鑑</button>
    <button class="btn ghost" onclick="openDict(true)">生字簿</button>
    <button class="btn ghost" id="btn-continue" style="display:none" onclick="loadGame()">繼續上次戰役</button>
  </div>
  <div class="title-note">答對國字題,武將就會出擊!佔領所有城池,一統天下。<br>城池等級越高,考的生字年級越高(一~四年級)。</div>
</div>

<!-- 地圖 -->
<div id="scr-map" class="screen">
  <div class="topbar">
    <span class="tb-title" id="tb-force">蜀</span>
    <span class="tb-stat" id="tb-turn">第 1 回合</span>
    <span class="tb-stat" id="tb-city">城池 3/16</span>
    <span class="tb-stat" id="tb-wnum">武將 5</span>
    <span class="tb-stat" id="tb-learn">已學生字 0</span>
    <span class="spacer"></span>
    <button class="btn ghost" onclick="restTurn()">休整補血</button>
    <button class="btn ghost" onclick="openGallery(false)">武將</button>
    <button class="btn ghost" onclick="openDict(false)">生字簿</button>
    <button class="btn ghost" onclick="saveGame(true)">存檔</button>
    <button class="btn red" onclick="backTitle()">回主畫面</button>
  </div>
  <div id="map-wrap"><svg id="map-svg" viewBox="0 0 960 560" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="map-hint">點選敵方相鄰城池發動進攻</div>
  </div>
</div>

<!-- 戰鬥 -->
<div id="scr-battle" class="screen">
  <div class="battle-head" id="bt-city">進攻 洛陽</div>
  <div class="battle-sub" id="bt-wave">守將 1/3</div>
  <div class="battle-arena">
    <div class="fighter">
      <div class="pbox" id="bt-mep"></div>
      <div class="fname" id="bt-men"></div><div class="ftitle" id="bt-met"></div>
      <div class="hpbar"><i id="bt-mehp"></i></div><div class="hp-num" id="bt-mehpn"></div>
    </div>
    <div class="vs-mid"><div class="vs-mark">VS</div><div id="combo-tag"></div><div id="battle-log"></div></div>
    <div class="fighter">
      <div class="pbox" id="bt-enp"></div>
      <div class="fname" id="bt-enn"></div><div class="ftitle" id="bt-ent"></div>
      <div class="hpbar enemy"><i id="bt-enhp"></i></div><div class="hp-num" id="bt-enhpn"></div>
    </div>
  </div>
  <div class="q-panel">
    <div class="q-type" id="q-type"></div>
    <div class="q-text" id="q-text"></div>
    <div class="opt-grid" id="q-opts"></div>
    <div class="q-feedback" id="q-fb"></div>
  </div>
  <div class="battle-foot"><button class="btn red" onclick="fleeBattle()">撤退</button></div>
</div>

<!-- 圖鑑 -->
<div id="scr-gallery" class="screen">
  <div class="topbar"><span class="tb-title">武將圖鑑</span><span class="spacer"></span>
    <button class="btn ghost" onclick="closeSub()">返回</button></div>
  <div class="page"><div class="page-inner">
    <div class="gal-tabs" id="gal-tabs"></div>
    <div class="gal-grid" id="gal-grid"></div>
  </div></div>
</div>

<!-- 生字簿 -->
<div id="scr-dict" class="screen">
  <div class="topbar"><span class="tb-title">生字簿</span><span class="spacer"></span>
    <button class="btn" onclick="startPractice()">練功房(自由練習)</button>
    <button class="btn ghost" onclick="closeSub()">返回</button></div>
  <div class="page"><div class="page-inner">
    <div class="gal-tabs" id="dict-tabs"></div>
    <div class="dict-stats" id="dict-stats"></div>
    <div class="char-grid" id="dict-grid"></div>
  </div></div>
</div>

<!-- 武將彈窗 -->
<div class="modal-mask" id="modal-warrior"><div class="modal">
  <button class="mx" onclick="closeModal('modal-warrior')">✕</button>
  <div class="w-detail" id="wd-body"></div>
</div></div>

<!-- 生字彈窗 -->
<div class="modal-mask" id="modal-char"><div class="modal" style="max-width:520px">
  <button class="mx" onclick="closeModal('modal-char')">✕</button>
  <div class="char-detail" id="cd-body"></div>
</div></div>

<!-- 出戰選將 -->
<div class="modal-mask" id="modal-pick"><div class="modal">
  <button class="mx" onclick="closeModal('modal-pick')">✕</button>
  <h3 style="margin:2px 0 12px; letter-spacing:3px;" id="pick-title">選擇出戰武將</h3>
  <div class="gal-grid" id="pick-grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr));"></div>
</div></div>

<!-- 結果 -->
<div class="modal-mask" id="modal-result"><div class="modal">
  <div id="res-title"></div><div id="res-body"></div>
  <div style="margin-top:16px"><button class="btn" id="res-btn" onclick="closeResult()">確定</button></div>
</div></div>

<!-- 招募 -->
<div class="modal-mask" id="modal-recruit"><div class="modal">
  <h3 style="margin:2px 0 4px; letter-spacing:3px;">招降敵將!</h3>
  <div style="font-size:14px; color:#6b5220; margin-bottom:8px;" id="rec-sub">答對這一題,敵將就願意歸順!</div>
  <div class="q-type" id="rq-type"></div>
  <div class="q-text" id="rq-text"></div>
  <div class="opt-grid" id="rq-opts"></div>
  <div class="q-feedback" id="rq-fb"></div>
</div></div>

<script>
/* ===== 生字資料庫:一至四年級(依台灣國小常用生字彙編) c字 z注音 r部首 w造詞 g年級 ===== */
const CHARS = [
/* ---------- 一年級 ---------- */
{c:"大",z:"ㄉㄚˋ",r:"大",w:["大家","大小"],g:1},
{c:"小",z:"ㄒㄧㄠˇ",r:"小",w:["小心","大小"],g:1},
{c:"上",z:"ㄕㄤˋ",r:"一",w:["上學","上面"],g:1},
{c:"下",z:"ㄒㄧㄚˋ",r:"一",w:["下課","上下"],g:1},
{c:"山",z:"ㄕㄢ",r:"山",w:["高山","山洞"],g:1},
{c:"水",z:"ㄕㄨㄟˇ",r:"水",w:["喝水","水果"],g:1},
{c:"火",z:"ㄏㄨㄛˇ",r:"火",w:["火車","生火"],g:1},
{c:"木",z:"ㄇㄨˋ",r:"木",w:["樹木","木頭"],g:1},
{c:"土",z:"ㄊㄨˇ",r:"土",w:["土地","泥土"],g:1},
{c:"日",z:"ㄖˋ",r:"日",w:["日出","生日"],g:1},
{c:"月",z:"ㄩㄝˋ",r:"月",w:["月亮","月光"],g:1},
{c:"天",z:"ㄊㄧㄢ",r:"大",w:["天空","今天"],g:1},
{c:"人",z:"ㄖㄣˊ",r:"人",w:["大人","人們"],g:1},
{c:"口",z:"ㄎㄡˇ",r:"口",w:["開口","門口"],g:1},
{c:"手",z:"ㄕㄡˇ",r:"手",w:["拍手","手心"],g:1},
{c:"耳",z:"ㄦˇ",r:"耳",w:["耳朵","木耳"],g:1},

 look:"演義描寫他「濃眉掀鼻,黑面短髯,形容古怪」——相貌平凡,才華卻蓋世。",
 p:{sk:"#c99a6e",ey:"sharp",br:"bushy",bd:"short",bc:"#26190d",ht:"cap",hc:"#4a4a3a",ac:"#6b6b52",at:"robe",ex:[]}},
{n:"馬岱",f:"蜀",z:"伯瞻",t:"平北將軍",wp:"大刀",wu:85,zh:60,ld:75,
 intro:"馬超的堂弟,隨馬超歸順劉備,多次參與北伐。諸葛亮臨終前授以密計,由他在關鍵時刻斬了謀反的魏延,安定了蜀漢軍心。作戰沉著可靠,是蜀漢中後期的重要將領。",
 look:"演義中他常隨馬超衝鋒陷陣,盔明甲亮,沉穩幹練。",
 p:{sk:"#dfb68e",ey:"calm",br:"flat",bd:"mo",bc:"#26190d",ht:"helm",hc:"#8a4a3a",ac:"#7a4a3a",at:"armor",ex:[]}},
{n:"關平",f:"蜀",z:"坦之",t:"少年虎將",wp:"大刀",wu:82,zh:68,ld:74,
 intro:"關羽的兒子(演義中為義子),自小隨父親征戰,武藝得關羽真傳。樊城之戰隨父奮戰,與龐德大戰三十回合不分勝負。麥城突圍時與父親一同被擒,寧死不降,忠孝兩全。",
 look:"演義中他年少英武,白面長身,常持刀侍立於關羽身側。",
 p:{sk:"#efcda6",ey:"calm",br:"flat",bd:"none",bc:"#222",ht:"band",hc:"#2f6b3f",ac:"#3f7a4f",at:"armor",ex:[]}},
{n:"徐庶",f:"蜀",z:"元直",t:"忠孝軍師",wp:"長劍",wu:62,zh:93,ld:80,
 intro:"潁川人,年輕時仗劍行俠,後棄武從文。是劉備的第一位軍師,用計大破曹仁的八門金鎖陣。曹操捉了他的母親逼他離開,他臨走前推薦了諸葛亮,並發誓「終身不為曹操設一謀」。",
 look:"演義中他葛巾布袍、皂絛烏履,一派瀟灑書生模樣,卻帶著俠客的英氣。",
 p:{sk:"#eec9a0",ey:"calm",br:"flat",bd:"goatee",bc:"#2a1d10",ht:"cap",hc:"#3a3a4a",ac:"#5a5a6b",at:"robe",ex:[]}},
{n:"法正",f:"蜀",z:"孝直",t:"奇謀之士",wp:"書卷",wu:45,zh:94,ld:76,
 intro:"扶風郿縣人,原是劉璋部下,後幫助劉備取得益州。漢中之戰他獻計聲東擊西,使黃忠陣斬夏侯淵,連曹操都感嘆:「我收盡天下英才,怎麼偏偏漏了法正?」是劉備最信任的謀士。",
 look:"史載他智術過人、恩怨分明,眉宇間帶著銳利的鋒芒。",
 p:{sk:"#eec9a0",ey:"sharp",br:"thin",bd:"goatee",bc:"#2a1d10",ht:"official",hc:"#5a4a6b",ac:"#6b5a7a",at:"robe",ex:[]}},
{n:"嚴顏",f:"蜀",z:"希伯",t:"斷頭將軍",wp:"大刀",wu:84,zh:62,ld:78,
 intro:"巴郡臨江人,劉璋帳下老將,鎮守江州。兵敗被張飛所擒,張飛喝令他投降,他昂然回答:「我州只有斷頭將軍,沒有投降將軍!」張飛敬佩他的氣節,親自解開繩索待為上賓。",
 look:"演義中他白髮蒼髯仍威風凜凜,寶刀不老,氣節如鋼。",
 p:{sk:"#d9ad84",ey:"aged",br:"bushy",bd:"full",bc:"#ddd8ce",ht:"helm",hc:"#5a5244",ac:"#6b5c3a",at:"armor",ex:["oldlines"]}},
/* ---------- 魏 (15) ---------- */
{n:"曹操",f:"魏",z:"孟德",t:"亂世梟雄・魏武帝",wp:"倚天劍",wu:72,zh:91,ld:96,
 intro:"沛國譙縣人,東漢末年最傑出的政治家、軍事家、詩人。他「挾天子以令諸侯」,官渡之戰以少勝多擊敗袁紹,統一北方。唯才是舉、屯田養民,也寫下〈短歌行〉等名篇。人們評價他:「治世之能臣,亂世之奸雄。」",
 look:"《三國志》注引記載他「姿貌短小,而神明英發」——個子不高,眼神卻銳利懾人。",
 p:{sk:"#e8c398",ey:"narrow",br:"angry",bd:"goatee",bc:"#26190d",ht:"official",hc:"#22283a",ac:"#2a3450",at:"robe",ex:[]}},
{n:"司馬懿",f:"魏",z:"仲達",t:"冢虎・晉朝奠基者",wp:"塵尾",wu:63,zh:96,ld:93,
 intro:"河內溫縣人,深謀遠慮,是諸葛亮北伐時最難纏的對手。他堅守不戰拖垮蜀軍,連「死諸葛嚇走活仲達」也不以為意,笑說:「我能料生,不能料死。」高平陵之變奪取魏國大權,為孫子司馬炎建立晉朝鋪路。",
 look:"史書稱他有「狼顧之相」——身體不動便能回頭後望,形容他深沉多疑、城府極深。",
 p:{sk:"#e8c398",ey:"narrow",br:"thin",bd:"goatee",bc:"#33261a",ht:"official",hc:"#3a2a4a",ac:"#4a3a5a",at:"robe",ex:[]}},
{n:"張遼",f:"魏",z:"文遠",t:"五子良將之首",wp:"月牙戟",wu:92,zh:78,ld:93,
 intro:"雁門馬邑人,原是呂布部將,歸曹後屢建奇功。合肥之戰率八百勇士突襲孫權十萬大軍,殺得吳軍聞風喪膽,「張遼止啼」——江東的小孩聽到他的名字都不敢哭。是智勇兼備的名將典範。",
 look:"演義中他面容剛毅、目光如電,披堅執銳,有大將之風。",
 p:{sk:"#dfb68e",ey:"sharp",br:"flat",bd:"short",bc:"#1d150c",ht:"helm",hc:"#2f4a6b",ac:"#2f4a6b",at:"armor",ex:[]}},
{n:"夏侯惇",f:"魏",z:"元讓",t:"獨眼將軍",wp:"大刀",wu:90,zh:58,ld:85,
 intro:"沛國譙縣人,曹操最信任的宗族大將。濮陽之戰左眼中箭,他大喊「父精母血,不可棄也」,拔箭吞睛,繼續作戰,軍中稱他「盲夏侯」。他為人清儉,把賞賜都分給將士,深得軍心。",
 look:"演義中他左眼帶傷、氣勢懾人,虯髯怒目,勇不可當。",
 p:{sk:"#dfb68e",ey:"sharp",br:"angry",bd:"full",bc:"#1d150c",ht:"helm",hc:"#2a3450",ac:"#33405e",at:"armor",ex:["eyepatch"]}},
{n:"夏侯淵",f:"魏",z:"妙才",t:"虎步關右",wp:"鐵胎弓",wu:91,zh:55,ld:84,
 intro:"夏侯惇的族弟,擅長千里奔襲,軍中流傳:「典軍校尉夏侯淵,三日五百,六日一千。」平定西涼,虎步關右,所向披靡。後鎮守漢中,在定軍山被黃忠突襲陣斬,壯烈戰死。",
 look:"演義中他弓馬嫻熟、行軍如風,是曹軍最迅捷的閃電戰名將。",
 p:{sk:"#dfb68e",ey:"sharp",br:"angry",bd:"mo",bc:"#1d150c",ht:"helm",hc:"#3a4a6b",ac:"#3a4a6b",at:"armor",ex:[]}},
{n:"許褚",f:"魏",z:"仲康",t:"虎痴",wp:"大刀",wu:96,zh:36,ld:68,
 intro:"譙國譙縣人,力大無窮,能倒拖牛尾走百步。擔任曹操的貼身護衛,忠心耿耿。潼關之戰他裸衣戰馬超,大戰兩百餘回合不分勝負,嚇得馬超問:「曹公的虎侯在哪裡?」從此「虎痴」威名遠播。",
 look:"《三國志》記載他「長八尺餘,腰大十圍,容貌雄毅,勇力絕人」。",
 p:{sk:"#e0a877",ey:"round",br:"bushy",bd:"short",bc:"#26190d",ht:"band",hc:"#8a6b34",ac:"#7a6b4a",at:"armor",ex:["wide"]}},
{n:"典韋",f:"魏",z:"-",t:"古之惡來",wp:"雙鐵戟",wu:95,zh:35,ld:66,
 intro:"陳留己吾人,單手能舉起軍門大旗,使一對重八十斤的鐵戟,曹操讚他是「古之惡來」(商朝著名大力士)。宛城之變中,他為掩護曹操逃走,獨守營門死戰,身無片甲仍殺敵數十人,壯烈犧牲。",
 look:"《三國志》記載他「形貌魁梧,旅力過人」,提戟而立如同鐵塔。",
 p:{sk:"#b57947",ey:"round",br:"bushy",bd:"full",bc:"#151008",ht:"band",hc:"#4a3a2a",ac:"#5a4a3a",at:"armor",ex:["wide"]}},
{n:"徐晃",f:"魏",z:"公明",t:"周亞夫之風",wp:"開山大斧",wu:90,zh:68,ld:86,
 intro:"河東楊縣人,治軍嚴整,曹操稱讚他有西漢名將「周亞夫之風」。樊城之戰他長驅直入,擊退威震華夏的關羽,解了樊城之圍。一生儉樸謹慎,常說:「戰場就是我報效國家的地方。」",
 look:"演義中他威嚴持重,手持大斧,軍容整肅如山。",
 p:{sk:"#dfb68e",ey:"calm",br:"flat",bd:"full",bc:"#26190d",ht:"helm",hc:"#4a5a4a",ac:"#4a5a4a",at:"armor",ex:[]}},
{n:"張郃",f:"魏",z:"儁乂",t:"巧變名將",wp:"長槍",wu:89,zh:69,ld:89,
 intro:"河間鄚縣人,原為袁紹部將,官渡之戰歸順曹操。他用兵「以巧變為稱」,擅長利用地形,街亭之戰大破馬謖,使諸葛亮第一次北伐功敗垂成,連劉備和諸葛亮都對他十分忌憚。",
 look:"演義中他儀表堂堂,槍法精熟,臨陣機變百出。",
 p:{sk:"#e8c398",ey:"sharp",br:"flat",bd:"mo",bc:"#26190d",ht:"helm",hc:"#5a4a6b",ac:"#5a4a6b",at:"armor",ex:[]}},
{n:"郭嘉",f:"魏",z:"奉孝",t:"鬼才",wp:"書卷",wu:25,zh:98,ld:72,
 intro:"潁川陽翟人,曹操早期最倚重的謀士,料事如神。他提出「十勝十敗論」堅定曹操與袁紹決戰的信心,又遺計定遼東,算無遺策。可惜三十八歲早逝,赤壁戰敗後曹操痛哭:「若奉孝在,不使孤至此!」",
 look:"史載他行事灑脫不拘小節,眉目清朗,帶著幾分放達不羈的才子氣。",
 p:{sk:"#f2d8b2",ey:"gentle",br:"thin",bd:"none",bc:"#222",ht:"cap",hc:"#4a5a7a",ac:"#5a6b8a",at:"robe",ex:[]}},
{n:"荀彧",f:"魏",z:"文若",t:"王佐之才",wp:"書卷",wu:30,zh:95,ld:80,
 intro:"潁川潁陰人,被譽為「王佐之才」。他為曹操規劃「奉天子以令不臣」的大戰略,坐鎮後方十餘年,舉薦郭嘉、司馬懿等大批人才,是曹操陣營的第一文臣,人稱「荀令君」。",
 look:"史載他儀容端雅,舉止有度,所到之處留有香氣,後世稱「令君香」。",
 p:{sk:"#f2d8b2",ey:"calm",br:"thin",bd:"goatee",bc:"#2a1d10",ht:"official",hc:"#6b5a3a",ac:"#e8e0cc",at:"robe",ex:[]}},
{n:"曹仁",f:"魏",z:"子孝",t:"天人將軍",wp:"長槍",wu:86,zh:62,ld:89,
 intro:"曹操的堂弟,魏國宗族第一名將,擅長防守。江陵之戰他率數十騎衝入周瑜大軍救回部將,將士驚呼:「將軍真天人也!」樊城之戰死守孤城,擋住關羽的猛攻,官至大司馬。",
 look:"演義中他沉毅勇決,鎮守城池固若金湯。",
 p:{sk:"#dfb68e",ey:"calm",br:"angry",bd:"full",bc:"#1d150c",ht:"helm",hc:"#33405e",ac:"#33405e",at:"armor",ex:[]}},
{n:"于禁",f:"魏",z:"文則",t:"最號毅重",wp:"大刀",wu:79,zh:65,ld:84,
 intro:"泰山鉅平人,治軍最為嚴整,曹操稱他「最號毅重」,是外姓將領中唯一假節鉞的大將。樊城之戰遇上關羽水淹七軍,兵敗被俘投降,晚節不保,一生功名毀於一旦,令人唏噓。",
 look:"演義中他持重威嚴,軍紀如鐵,面容剛正。",
 p:{sk:"#e8c398",ey:"calm",br:"flat",bd:"goatee",bc:"#26190d",ht:"helm",hc:"#4a4a3a",ac:"#5a5a4a",at:"armor",ex:[]}},
{n:"樂進",f:"魏",z:"文謙",t:"先登猛將",wp:"短劍",wu:83,zh:55,ld:80,
 intro:"陽平衛國人,個子矮小卻膽識過人,每次攻城都第一個登上城牆,「先登」之功無人能比。從擊袁紹、戰烏桓、守合肥,大小數十戰無不奮勇當先,與張遼、李典合力大破孫權。",
 look:"《三國志》記載他「容貌短小,以膽烈從太祖」——身材雖小,膽氣蓋軍。",
 p:{sk:"#dfb68e",ey:"sharp",br:"angry",bd:"short",bc:"#26190d",ht:"helm",hc:"#6b4a3a",ac:"#6b4a3a",at:"armor",ex:[]}},
{n:"賈詡",f:"魏",z:"文和",t:"毒士・算無遺策",wp:"書卷",wu:42,zh:97,ld:78,
 intro:"武威姑臧人,亂世中最懂自保的智者。他先後輔佐董卓、張繡、曹操,獻計無一失手:宛城之計差點要了曹操的命,離間馬超韓遂助曹操平定關中。曹丕能當上皇帝也多虧他指點,官至太尉,得享天年。",
 look:"史載他深沉低調,平日閉門自守,渾濁的眼中藏著看透人心的精光。",
 p:{sk:"#e0bd94",ey:"narrow",br:"thin",bd:"goatee",bc:"#8a8378",ht:"cap",hc:"#3a3a2a",ac:"#4a4a3a",at:"robe",ex:["oldlines"]}},
/* ---------- 吳 (13) ---------- */
{n:"孫堅",f:"吳",z:"文台",t:"江東之虎",wp:"古錠刀",wu:91,zh:70,ld:89,
 intro:"吳郡富春人,十七歲便隻身喝退海盜,勇冠江東。討伐董卓時,他是聯軍中打得最勇的一路,大破華雄、攻入洛陽,還得到了傳國玉璽。可惜在攻打荊州劉表時中埋伏戰死,他是孫策、孫權的父親,東吳基業的開創者。",
 look:"《三國志》記載他「容貌不凡,性闊達,好奇節」,常以紅巾裹頭,虎虎生威。",
 p:{sk:"#dfb68e",ey:"sharp",br:"angry",bd:"full",bc:"#26190d",ht:"band",hc:"#a33b2e",ac:"#8a3a2e",at:"armor",ex:[]}},
{n:"孫策",f:"吳",z:"伯符",t:"小霸王",wp:"霸王槍",wu:92,zh:69,ld:90,
 intro:"孫堅長子,人稱「小霸王」。父親死後,他以傳國玉璽向袁術借兵三千,數年間橫掃江東六郡,打下東吳基業。與周瑜是結拜兄弟,又同娶大喬、小喬為妻。可惜二十六歲遇刺身亡,臨終把江東託付給弟弟孫權。",
 look:"《三國志》記載他「美姿顏,好笑語」——英俊愛笑,軍民都樂意為他效死。",
 p:{sk:"#efcda6",ey:"sharp",br:"flat",bd:"none",bc:"#222",ht:"helm",hc:"#a33b2e",ac:"#a33b2e",at:"armor",ex:["plume"]}},
{n:"孫權",f:"吳",z:"仲謀",t:"吳大帝",wp:"白虹劍",wu:67,zh:80,ld:89,
 intro:"十九歲繼承父兄基業,坐斷東南。他重用周瑜、魯肅、呂蒙、陸遜四任都督,聯劉抗曹打贏赤壁之戰,又奪回荊州,西元229年稱帝建立吳國。連曹操都感嘆:「生子當如孫仲謀!」",
 look:"《三國志》注記載他「碧眼紫髯」「方頤大口」——綠眼睛、紫鬍鬚,相貌奇偉,一看就是人主之相。",
 p:{sk:"#eec9a0",ey:"green",br:"bushy",bd:"full",bc:"#6b4a5a",ht:"crown",hc:"#8a6b34",ac:"#8a3a2e",at:"robe",ex:[]}},
{n:"周瑜",f:"吳",z:"公瑾",t:"美周郎・大都督",wp:"長劍",wu:71,zh:96,ld:94,
 intro:"廬江舒縣人,文武雙全又精通音律,「曲有誤,周郎顧」。赤壁之戰他以三萬吳軍火燒曹操數十萬大軍,是三國最著名的以少勝多戰役,奠定三分天下的局面。蘇軾詞中「羽扇綸巾,談笑間,檣櫓灰飛煙滅」寫的就是他的瀟灑。",
 look:"《三國志》記載他「長壯有姿貌」,江東人稱「美周郎」,俊雅風流,氣度恢弘。",
 p:{sk:"#f2d8b2",ey:"calm",br:"thin",bd:"mo",bc:"#2a1d10",ht:"guanjin",hc:"#8a3a2e",ac:"#a34a3a",at:"robe",ex:[]}},
{n:"陸遜",f:"吳",z:"伯言",t:"書生都督",wp:"長劍",wu:69,zh:95,ld:93,
 intro:"吳郡吳縣人,外表斯文像個書生,用兵卻深不可測。夷陵之戰他堅守不出,再以火燒連營七百里大破劉備大軍,一戰成名。後又在石亭大敗魏軍,官至丞相,是吳國後期的擎天之柱。",
 look:"史載他「身長八尺,面如美玉」,溫文儒雅,胸藏百萬兵。",

/* ===== 遊戲狀態 ===== */
let G = null;      // {f, turn, owner:{cityId:力}, roster:[{n,hp,mx}], reserve:[], learned:[]}

function newWar(n){ const w = wByName(n); const mx = 80 + Math.round(w.ld/2); return {n:n, hp:mx, mx:mx}; }

function startGame(f){
  const owner = {};
  CITIES.forEach(c => owner[c.id] = (c.owner === f ? "我" : c.owner));
  const roster = FORCES[f].starters.map(newWar);
  const reserve = WARRIORS.filter(w => w.f === f && !FORCES[f].starters.includes(w.n)).map(w => w.n);
  G = {f:f, turn:1, owner:owner, roster:roster, reserve:reserve, learned:[]};
  show("scr-map"); renderMap(); saveGame(false);
}
function show(id){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $(id).classList.add("on");
}
function backTitle(){ if(G) saveGame(false); show("scr-title"); initTitle(); }
function closeModal(id){ $(id).classList.remove("on"); }

/* ===== 標題 ===== */
function initTitle(){
  const row = $("force-row"); row.innerHTML = "";
  ["蜀","魏","吳"].forEach(f => {
    const d = document.createElement("div");
    d.className = "force-card f-" + (f==="魏"?"wei":f==="蜀"?"shu":"wu");
    d.innerHTML = `<div class="fc-flag">${f}</div><div class="fc-name">${f==="蜀"?"蜀漢・劉備":f==="魏"?"曹魏・曹操":"東吳・孫權"}</div>
      <div class="fc-desc">${FORCES[f].desc}<br>起始武將:${FORCES[f].starters.join("、")}</div>`;
    d.onclick = () => { if(!G || confirm("開始新戰役?目前進度將被覆蓋。")) startGame(f); };
    row.appendChild(d);
  });
  try{ $("btn-continue").style.display = localStorage.getItem("sgz_learn_save") ? "" : "none"; }catch(e){}
}

/* ===== 存讀檔 ===== */

       if(toast) hint("已存檔!"); }
  catch(e){ if(toast) hint("此環境無法存檔"); }
}
function loadGame(){
  try{ const d = localStorage.getItem("sgz_learn_save");
    if(d){ G = JSON.parse(d); show("scr-map"); renderMap(); } }catch(e){}
}

function renderMap(){
  $("tb-force").textContent = G.f + "軍";
  $("tb-turn").textContent = "第 " + G.turn + " 回合";
  const own = CITIES.filter(c => G.owner[c.id] === "我").length;
  $("tb-city").textContent = "城池 " + own + "/" + CITIES.length;
  $("tb-wnum").textContent = "武將 " + G.roster.length;
  $("tb-learn").textContent = "已學生字 " + G.learned.length;
  let s = "";
  EDGES.forEach(e => { const a = cityById(e[0]), b = cityById(e[1]);
    s += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#8a7444" stroke-width="2.5" stroke-dasharray="7 6" opacity=".55"/>`; });

    const o = G.owner[c.id], col = OCOLOR[o], mine = o === "我";

function isAdjacentToMine(id){
  return EDGES.some(e => (e[0]===id && G.owner[e[1]]==="我") || (e[1]===id && G.owner[e[0]]==="我"));
}
function cityClick(id){
  const c = cityById(id), o = G.owner[id];
  if(o === "我"){ hint(c.n + "是我方城池(" + "★".repeat(c.tier) + ")"); return; }
  if(!isAdjacentToMine(id)){ hint("太遠了!只能進攻與我方城池相鄰的城。"); return; }
  openPick(id);
}

let pickCity = null;
function openPick(cityId){
  pickCity = cityId; const c = cityById(cityId);
  $("pick-title").textContent = "進攻" + c.n + "(守將:" + c.defs.join("、") + ")— 選擇出戰武將";
  const g = $("pick-grid"); g.innerHTML = "";
  G.roster.forEach(r => {
    const w = wByName(r.n), hurt = r.hp <= 0;
    const d = document.createElement("div");
    d.className = "gal-card" + (hurt ? " locked" : "");
    d.innerHTML = drawPortrait(w) + `<div class="gname">${w.n}</div>
      <div class="gtitle">${hurt ? "重傷休養中" : "體力 " + r.hp + "/" + r.mx + "・武力" + w.wu}</div>`;
    if(!hurt) d.onclick = () => { closeModal("modal-pick"); startBattle(cityId, r.n); };
    g.appendChild(d);
  });
  $("modal-pick").classList.add("on");
}

/* ===== 戰鬥 ===== */
function startBattle(cityId, wname){
  const c = cityById(cityId);
  B = { city:c, me:G.roster.find(r => r.n === wname), wave:0, combo:0,
        defs:c.defs.map(n => { const w = wByName(n); return {n:n, hp:60 + w.ld, mx:60 + w.ld}; }),
        newChars:[], practice:false };
  $("bt-city").textContent = "進攻 " + c.n + "(" + GTITLE[c.tier] + "生字)";
  show("scr-battle"); setupWave(); updateBars(); askQuestion();
}
function setupWave(){
  const d = B.defs[B.wave], w = wByName(d.n), me = wByName(B.me.n);
  $("bt-wave").textContent = B.practice ? "陪練武將" : "守將 " + (B.wave+1) + "/" + B.defs.length;
  $("bt-mep").innerHTML = drawPortrait(me); $("bt-men").textContent = me.n; $("bt-met").textContent = me.t;
  $("bt-enp").innerHTML = drawPortrait(w);  $("bt-enn").textContent = w.n;  $("bt-ent").textContent = w.t;
  log(B.practice ? "自由練習,答錯不扣血!" : d.n + "出城迎戰!答對國字就能發動攻擊!");
}
function updateBars(){
  const d = B.defs[B.wave];
  $("bt-mehp").style.width = Math.max(0, B.me.hp / B.me.mx * 100) + "%";
  $("bt-mehpn").textContent = Math.max(0,B.me.hp) + " / " + B.me.mx;
  $("bt-enhp").style.width = Math.max(0, d.hp / d.mx * 100) + "%";
  $("bt-enhpn").textContent = Math.max(0,d.hp) + " / " + d.mx;
  $("combo-tag").textContent = B.combo >= 2 ? "連擊 x" + B.combo + "!" : "";
}
function log(t){ $("battle-log").textContent = t; }

/* ===== 出題 ===== */
function pool(maxG, exactG){
  return CHARS.filter(ch => exactG ? ch.g === exactG : ch.g <= maxG);
}
function pick(arr, n, exclude){
  const cand = arr.filter(x => !exclude.includes(x));
  const out = [];
  while(out.length < n && cand.length){ out.push(cand.splice(Math.floor(Math.random()*cand.length),1)[0]); }
  return out;
}
function genQuestion(pl){
  const ch = pl[Math.floor(Math.random()*pl.length)];
  const types = ["zy","cz","bs","tz"];
  const t = types[Math.floor(Math.random()*types.length)];
  let q = {ch:ch, type:t};
  if(t === "zy"){
    q.label = "讀音題"; q.html = `「<span class="bigchar">${ch.c}</span>」的注音是?`;
    const ds = pick([...new Set(pl.filter(x=>x.z!==ch.z).map(x=>x.z))], 3, [ch.z]);
    q.opts = shuffle([ch.z, ...ds]); q.ans = ch.z;
    q.exp = `「${ch.c}」讀作 ${ch.z},部首「${ch.r}」,例如:${ch.w.join("、")}。`;
  }else if(t === "cz"){
    q.label = "選字題";
    const cs = pl.filter(x => x.z === ch.z ? x.c === ch.c : true);
    q.html = `注音「${ch.z}」(${ch.w[0]}的「${ch.c}」)是哪個字?`;
    const ds = pick(pl.filter(x => x.z !== ch.z).map(x=>x.c), 3, [ch.c]);
    q.opts = shuffle([ch.c, ...ds]); q.ans = ch.c;
    q.exp = `${ch.z} 就是「${ch.c}」,可以造詞:${ch.w.join("、")}。`;
  }else if(t === "bs"){
    q.label = "部首題"; q.html = `「<span class="bigchar">${ch.c}</span>」(${ch.z})的部首是?`;
    const ds = pick([...new Set(pl.filter(x=>x.r!==ch.r).map(x=>x.r))], 3, [ch.r]);
    q.opts = shuffle([ch.r, ...ds]); q.ans = ch.r;
    q.exp = `「${ch.c}」的部首是「${ch.r}」。造詞:${ch.w.join("、")}。`;
  }else{
    q.label = "造詞題";
    const word = ch.w[Math.floor(Math.random()*ch.w.length)];
    const blank = word.replace(ch.c, "▢");
    q.html = `「${blank}」(${ch.z})的 ▢ 要填哪個字?`;
    const rest = word.replace(ch.c, "");
    const ds = pick(pl.filter(x => x.c !== ch.c && x.z !== ch.z &&
        !x.w.some(w2 => w2.includes(rest) && rest.length > 0)).map(x=>x.c), 3, [ch.c]);
    q.opts = shuffle([ch.c, ...ds]); q.ans = ch.c;
    q.exp = `正確答案是「${ch.c}」(${ch.z}),組成「${word}」。`;
  }
  return q;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

let curQ = null;
function askQuestion(){
  const pl = B.practice ? B.pool : pool(B.city.tier, null);
  curQ = genQuestion(pl);
  $("q-type").textContent = curQ.label + (B.practice ? "・練功房" : "・" + GTITLE[B.city.tier] + "程度");
  $("q-text").innerHTML = curQ.html;
  $("q-fb").textContent = "";
  const box = $("q-opts"); box.innerHTML = "";
  curQ.opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.onclick = () => answer(b, o);
    box.appendChild(b);
  });
}
function answer(btn, val){
  document.querySelectorAll("#q-opts .opt").forEach(b => { b.disabled = true;
    if(b.textContent === curQ.ans) b.classList.add("correct"); });
  const ok = val === curQ.ans;
  const ch = curQ.ch;
  if(ok){
    if(!G.learned.includes(ch.c)){ G.learned.push(ch.c); if(!B.practice) B.newChars.push(ch.c); }
    $("q-fb").textContent = "答對了!" + curQ.exp;
  }else{
    btn.classList.add("wrong");
    $("q-fb").textContent = "答錯了~ " + curQ.exp;
  }
  if(B.practice){ practiceStep(ok); return; }
  const d = B.defs[B.wave], me = wByName(B.me.n), en = wByName(d.n);
  if(ok){
    B.combo++;
    const dmg = 18 + Math.round(me.wu/6) + Math.min(B.combo,5)*4;
    d.hp -= dmg;
    log(me.n + "發動攻擊,造成 " + dmg + " 點傷害!");
  }else{
    B.combo = 0;
    const dmg = 12 + Math.round(en.wu/8);
    B.me.hp -= dmg;
    log(en.n + "趁機反擊,我方損失 " + dmg + " 點體力!");
  }
  updateBars();
  setTimeout(() => {
    if(d.hp <= 0){ waveDown(); }
    else if(B.me.hp <= 0){ meDown(); }
    else askQuestion();
  }, ok ? 1600 : 3000);
}
function waveDown(){
  const d = B.defs[B.wave];
  log("擊敗守將" + d.n + "!");
  if(B.wave < B.defs.length - 1){
    B.wave++;
    setTimeout(() => { setupWave(); updateBars(); askQuestion(); }, 1200);
  }else{
    setTimeout(battleWon, 900);
  }
}
function meDown(){
  log(B.me.n + "受了重傷!");
  const alive = G.roster.filter(r => r.hp > 0);
  if(alive.length){
    setTimeout(() => {
      $("pick-title").textContent = B.me.n + "重傷退場!選擇下一位武將接替出戰";
      const g = $("pick-grid"); g.innerHTML = "";
      alive.forEach(r => {
        const w = wByName(r.n);
        const el = document.createElement("div");
        el.className = "gal-card";
        el.innerHTML = drawPortrait(w) + `<div class="gname">${w.n}</div><div class="gtitle">體力 ${r.hp}/${r.mx}</div>`;
        el.onclick = () => { closeModal("modal-pick"); B.me = r; setupWave(); updateBars(); askQuestion(); };
        g.appendChild(el);
      });
      $("modal-pick").classList.add("on");
    }, 1200);
  }else{
    setTimeout(() => endBattle(false), 1200);
  }
}
function fleeBattle(){
  if(B && B.practice){ endPractice(); return; }
  endBattle(false, true);
}
function battleWon(){
  G.owner[B.city.id] = "我";
  endBattle(true);
}
function endBattle(won, fled){
  G.turn++;
  G.roster.forEach(r => { if(r.hp <= 0) r.hp = Math.round(r.mx * 0.4); });
  let html = "";
  if(won){
    html += `成功佔領<b>${B.city.n}</b>!`;
    if(G.reserve.length){
      const j = G.reserve.shift();
      G.roster.push(newWar(j));
      html += `<br>本國武將<b>${j}</b>前來會合,加入我軍!`;
    }
  }else{
    html += fled ? "我軍撤退,下次再來!" : "我軍全員負傷,進攻失敗…休整後再出發!";
  }
  if(B.newChars.length){
    html += `<br>這場戰役學會了 ${B.newChars.length} 個新字:<br>` +
      B.newChars.map(c => `<span class="newchar">${c}</span>`).join("");
  }
  $("res-title").textContent = won ? "攻城成功!" : "暫時撤退";
  $("res-title").style.color = won ? "#2f7d4f" : "#8e2f24";
  $("res-body").innerHTML = html;
  const recruitable = won ? B.defs.map(d => d.n).filter(n => !G.roster.some(r => r.n === n)) : [];
  $("res-btn").onclick = () => {
    closeModal("modal-result");
    if(won && recruitable.length){ openRecruit(recruitable[0], B.city.tier); }
    else { show("scr-map"); renderMap(); saveGame(false); }
  };
  $("modal-result").classList.add("on");
}
function closeResult(){ closeModal("modal-result"); show("scr-map"); renderMap(); saveGame(false); }

/* ===== 招募 ===== */
function openRecruit(name, tier){
  const w = wByName(name);
  $("rec-sub").innerHTML = `敗將<b>${name}</b>(${w.t})願意考驗你:答對就歸順我軍!`;
  const q = genQuestion(pool(null, tier));
  $("rq-type").textContent = q.label + "・挑戰題(" + GTITLE[tier] + ")";
  $("rq-text").innerHTML = q.html;
  $("rq-fb").textContent = "";
  const box = $("rq-opts"); box.innerHTML = "";
  q.opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o;
    b.onclick = () => {
      document.querySelectorAll("#rq-opts .opt").forEach(x => { x.disabled = true;
        if(x.textContent === q.ans) x.classList.add("correct"); });
      const ok = o === q.ans;
      if(ok){
        if(!G.learned.includes(q.ch.c)) G.learned.push(q.ch.c);
        G.roster.push(newWar(name));
        $("rq-fb").textContent = "答對了!" + name + "歸順我軍!" + q.exp;
      }else{
        b.classList.add("wrong");
        $("rq-fb").textContent = "可惜~" + name + "離開了。" + q.exp;
      }
      setTimeout(() => { closeModal("modal-recruit"); show("scr-map"); renderMap(); saveGame(false); }, 2600);
    };
    box.appendChild(b);
  });
  $("modal-recruit").classList.add("on");
}

/* ===== 休整 / 勝利 ===== */
function restTurn(){
  G.turn++;
  G.roster.forEach(r => r.hp = Math.min(r.mx, r.hp + Math.round(r.mx*0.5)));
  hint("全軍休整,體力大幅恢復!");
  renderMap(); saveGame(false);
}
function checkVictory(){
  if(G && CITIES.every(c => G.owner[c.id] === "我")){
    $("res-title").textContent = "一統天下!";
    $("res-title").style.color = "#c9a227";
    $("res-body").innerHTML = `恭喜!${G.f}軍佔領了全部 ${CITIES.length} 座城池!<br>
      你總共學會了 <b>${G.learned.length}</b> 個國字,收服了 <b>${G.roster.length}</b> 名武將。<br>真正的英雄,是用智慧贏得天下!`;
    $("res-btn").onclick = () => { closeModal("modal-result"); };
    $("modal-result").classList.add("on");
  }
}

/* ===== 武將圖鑑 ===== */
let galFrom = "map";
function openGallery(fromTitle){ galFrom = fromTitle ? "title" : "map"; show("scr-gallery"); renderGalTabs("全部"); }
function renderGalTabs(cur){
  const tabs = ["全部","蜀","魏","吳","群"];
  $("gal-tabs").innerHTML = tabs.map(t =>
    `<button class="gtab${t===cur?" on":""}" onclick="renderGalTabs('${t}')">${t}${t==="全部"?"("+WARRIORS.length+")":""}</button>`).join("");
  const g = $("gal-grid"); g.innerHTML = "";
  WARRIORS.filter(w => cur === "全部" || w.f === cur).forEach(w => {
    const mine = G && G.roster.some(r => r.n === w.n);
    const d = document.createElement("div");
    d.className = "gal-card";
    d.innerHTML = drawPortrait(w) + `<div class="gname">${w.n}${mine?" ⚑":""}</div><div class="gtitle">${w.f}・${w.t}</div>`;
    d.onclick = () => showWarrior(w.n);
    g.appendChild(d);
  });
}
function showWarrior(n){
  const w = wByName(n);
  const bar = (l,v) => `<div class="statrow"><span class="sl">${l}</span>
    <span class="statbar"><i style="width:${v}%"></i></span><span class="sv">${v}</span></div>`;
  $("wd-body").innerHTML = `
    <div class="wd-left">${drawPortrait(w)}</div>
    <div class="wd-right">
      <div><span class="wd-name">${w.n}</span><span class="wd-zi">${w.z !== "-" ? "字 " + w.z : ""}</span></div>
      <span class="wd-tag" style="background:${FCOLOR[w.f]}">${w.f === "群" ? "群雄" : w.f + "國"}</span>
      <span class="wd-tag" style="background:#8a6a1e">${w.t}</span>
      <span class="wd-tag" style="background:#6b4a2a">兵器:${w.wp}</span>
      ${bar("武力", w.wu)}${bar("智力", w.zh)}${bar("統率", w.ld)}
      <div class="wd-intro">${w.intro}</div>
      <div class="wd-look">【史料記載的容貌】${w.look}</div>
    </div>`;
  $("modal-warrior").classList.add("on");
}

/* ===== 生字簿 ===== */
let dictFrom = "map", dictTab = 0;
function openDict(fromTitle){ dictFrom = fromTitle ? "title" : "map"; show("scr-dict"); renderDict(0); }
function renderDict(gr){
  dictTab = gr;
  const tabs = [0,1,2,3,4];
  $("dict-tabs").innerHTML = tabs.map(t =>
    `<button class="gtab${t===gr?" on":""}" onclick="renderDict(${t})">${t===0?"全部":GTITLE[t]}</button>`).join("");
  const list = CHARS.filter(ch => gr === 0 || ch.g === gr);
  const learned = G ? G.learned : [];
  const ln = list.filter(ch => learned.includes(ch.c)).length;
  $("dict-stats").textContent = `共 ${list.length} 個字|已學會 ${ln} 個(打過勝仗的字會亮起來)`;
  const g = $("dict-grid"); g.innerHTML = "";
  list.forEach(ch => {
    const d = document.createElement("div");
    d.className = "char-cell" + (learned.includes(ch.c) ? " learned" : "");
    d.innerHTML = `<div class="cc-ch">${ch.c}</div><div class="cc-zy">${ch.z}</div>`;
    d.onclick = () => showChar(ch);
    g.appendChild(d);
  });
}
function showChar(ch){
  $("cd-body").innerHTML = `
    <div style="font-size:13px;color:#8a6a1e;letter-spacing:2px">${GTITLE[ch.g]}生字</div>
    <div class="cd-ch">${ch.c}</div>
    <div style="font-size:24px;letter-spacing:3px">${ch.z}</div>
    <div class="cd-grid"><span><b>部首</b> ${ch.r} 部</span><span><b>年級</b> ${GTITLE[ch.g]}</span></div>
    <div class="cd-words">${ch.w.map(w => `<span>${w}</span>`).join("")}</div>`;
  $("modal-char").classList.add("on");
}
function closeSub(){
  const from = $("scr-gallery").classList.contains("on") ? galFrom : dictFrom;
  if(from === "title" || !G){ show("scr-title"); initTitle(); }
  else { show("scr-map"); renderMap(); }
}

/* ===== 練功房 ===== */
function startPractice(){
  const gr = dictTab === 0 ? null : dictTab;
  const pl = gr ? CHARS.filter(c => c.g === gr) : CHARS.slice();
  const sparring = WARRIORS[Math.floor(Math.random()*WARRIORS.length)];
  if(!G){ G = {f:"蜀", turn:0, owner:null, roster:[], reserve:[], learned:[], freeplay:true}; }
  B = { practice:true, pool:pl, left:10, score:0,
        city:{n:"練功房", tier:gr||4},
        me:{n:sparring.n, hp:1, mx:1},
        defs:[{n:sparring.n, hp:1, mx:1}], wave:0, combo:0, newChars:[] };
  B.me = {n:sparring.n, hp:100, mx:100};
  B.defs = [{n:sparring.n, hp:100, mx:100}];
  $("bt-city").textContent = "練功房・" + (gr ? GTITLE[gr] : "全年級") + "生字(共10題)";
  show("scr-battle"); setupWave(); updateBars(); askQuestion();
}
function practiceStep(ok){
  if(ok) B.score++;
  B.left--;
  log(ok ? "答對!目前 " + B.score + " 分" : "再接再厲!");
  if(B.left <= 0){ setTimeout(endPractice, 1800); }
  else setTimeout(askQuestion, ok ? 1500 : 2800);
}
function endPractice(){
  $("res-title").textContent = "練功結束";
  $("res-title").style.color = "#2f5b8e";
  $("res-body").innerHTML = `10 題答對 <b>${B.score}</b> 題!` +
    (B.score >= 9 ? "太厲害了,將軍之才!" : B.score >= 6 ? "不錯喔,繼續努力!" : "多練幾次一定會更好!");
  $("res-btn").onclick = () => {
    closeModal("modal-result");
    if(G && G.freeplay){ G = null; show("scr-dict"); renderDict(dictTab); }
    else { show("scr-dict"); renderDict(dictTab); saveGame(false); }
  };
  $("modal-result").classList.add("on");
}

/* ===== 啟動 ===== */
initTitle();
</script>
