html,body{margin:0;padding:0;height:100%}

.wrap{display:flex;flex-direction:column;height:100%}

}

header .grow{flex:1}
.hbtn{
  background:rgba(255,255,255,0.18);color:#fff;

}

nav.tabs{display:flex;gap:6px;padding:8px 12px 0;flex:0 0 auto}

nav.tabs button.on{background:var(--card);color:var(--main-d);box-shadow:0 -2px 0 var(--main) inset}

main{flex:1;min-height:0;display:flex;gap:12px;padding:12px;align-items:stretch}
.screen{display:none;flex:1;min-width:0;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.on{display:flex}

.panel{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:14px;margin-bottom:12px;
}
.panel h2{margin:0 0 10px;font-size:1em;color:var(--main-d);letter-spacing:1px}

/* ---- 拍照區 ---- */
.shot{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.shotbtn{
  background:var(--main);color:#fff;border-radius:14px;
  padding:14px 18px;font-weight:700;font-size:1.02em;
}
.shotbtn:active{background:var(--main-d)}
.shotbtn.alt{background:#8a9b90}
.thumb{
  width:92px;height:92px;border-radius:12px;object-fit:cover;
  border:2px solid var(--line);background:#eee;display:none;
}
.thumb.on{display:block}
input[type=file]{display:none}

.mealrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.mealrow button{
  flex:1;min-width:70px;padding:10px 0;border-radius:12px;
  background:#eee9dc;color:var(--sub);font-weight:700;
}
.mealrow button.on{background:var(--warm);color:#fff}

/* ---- 搜尋與分類 ---- */
.search{
  width:100%;padding:12px 14px;border-radius:12px;
  border:2px solid var(--line);background:#fbfaf5;

}
.search:focus{outline:none;border-color:var(--main)}

.cats button.on{color:#fff}

.foods{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;margin-top:12px}

.food:active{background:#f0ece0}
.food .fn{font-weight:700;display:block}
.food .fu{color:var(--sub);font-size:0.8em}
.food .fk{float:right;color:var(--warm);font-weight:700;font-size:0.9em}

/* ---- 熱量面板 ---- */
aside{

.total small{font-size:0.36em;color:var(--sub);font-weight:700;margin-left:4px}

/* ========================= 儲存 ========================= */
var KEY = "food_kcal_v1";
var MAX_RECS = 120;      /* 最多保留幾筆文字紀錄 */
var MAX_IMGS = 30;       /* 最多保留幾張照片 */

var save = {recs:[]};

function loadSave(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && o.recs && o.recs.length !== undefined){ save = o; }
    }
  }catch(e){ save = {recs:[]}; }
  if(!save.recs){ save.recs = []; }
}

/* 寫入；空間不足時逐步捨棄最舊的照片再重試（不使用 clear/removeItem） */
function writeSave(){
  trimSave();
  for(var attempt = 0; attempt < 40; attempt++){
    try{
      localStorage.setItem(KEY, JSON.stringify(save));
      return true;
    }catch(e){
      if(!dropOldestImage()){
        try{
          localStorage.setItem(KEY, JSON.stringify({recs:save.recs.slice(-20)}));
          save.recs = save.recs.slice(-20);
          return true;
        }catch(e2){ return false; }
      }
    }
  }
  return false;
}

function trimSave(){
  if(save.recs.length > MAX_RECS){
    save.recs = save.recs.slice(save.recs.length - MAX_RECS);
  }
  var seen = 0;
  for(var i = save.recs.length - 1; i >= 0; i--){
    if(save.recs[i].img){
      seen++;
      if(seen > MAX_IMGS){ delete save.recs[i].img; }
    }
  }
}

function dropOldestImage(){
  for(var i = 0; i < save.recs.length; i++){
    if(save.recs[i].img){ delete save.recs[i].img; return true; }
  }
  return false;
}

/* ========================= 小工具 ========================= */
function $(id){ return document.getElementById(id); }

function todayStr(){
  var d = new Date();
  var m = d.getMonth() + 1;
  var day = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" + m : m) + "-" + (day < 10 ? "0" + day : day);
}

function prettyDate(s){
  var p = s.split("-");
  if(p.length < 3){ return s; }
  return (p[1] * 1) + "月" + (p[2] * 1) + "日";
}

function catColor(i){
  var v = getComputedStyle(document.documentElement).getPropertyValue(CATS[i].v);
  v = v ? v.replace(/\s/g, "") : "";
  return v || "#888888";
}

var canSpeak = (typeof speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined");
function speak(txt){
  if(!canSpeak){ return; }
  try{
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = "zh-TW";
    u.rate = 0.95;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ========================= 目前這一餐 ========================= */
var cur = {meal:"午餐", img:"", items:[]};
var curCat = -1;   /* -1 = 全部 */

function curTotal(){
  var t = 0;
  for(var i = 0; i < cur.items.length; i++){ t += cur.items[i].k * cur.items[i].q; }
  return t;
}

function addFood(f){
  for(var i = 0; i < cur.items.length; i++){
    if(cur.items[i].n === f.n && cur.items[i].u === f.u){
      cur.items[i].q++;
      renderPanel();
      speak(f.n);
      return;
    }
  }
  cur.items.push({n:f.n, u:f.u, k:f.k, c:f.c, q:1});
  renderPanel();
  speak(f.n);
}

function bumpItem(idx, d){
  var it = cur.items[idx];
  if(!it){ return; }
  it.q += d;
  if(it.q <= 0){ cur.items.splice(idx, 1); }
  renderPanel();
}

/* ========================= 畫面 ========================= */
function renderCats(){
  var box = $("cats");
  box.innerHTML = "";
  var all = document.createElement("button");
  all.textContent = "全部";
  if(curCat === -1){ all.className = "on"; all.style.background = "#6b7a70"; }
  all.onclick = function(){ curCat = -1; renderCats(); renderFoods(); };
  box.appendChild(all);
  for(var i = 0; i < CATS.length; i++){
    (function(i){
      var b = document.createElement("button");
      b.textContent = CATS[i].n;
      if(curCat === i){ b.className = "on"; b.style.background = catColor(i); }
      b.onclick = function(){ curCat = i; renderCats(); renderFoods(); };
      box.appendChild(b);
    })(i);
  }
}

function renderFoods(){
  var box = $("foods");
  var kw = $("q").value.replace(/\s/g, "");
  box.innerHTML = "";
  var shown = 0;
  for(var i = 0; i < FOODS.length; i++){
    var f = FOODS[i];
    if(curCat !== -1 && f.c !== curCat){ continue; }
    if(kw && f.n.indexOf(kw) < 0){ continue; }
    shown++;
    (function(f){
      var b = document.createElement("button");
      b.className = "food";
      b.style.borderLeftColor = catColor(f.c);
      b.innerHTML = '<span class="fk">' + f.k + '</span>' +
                    '<span class="fn">' + f.n + '</span>' +
                    '<span class="fu">' + f.u + '</span>';
      b.onclick = function(){ addFood(f); };
      box.appendChild(b);
    })(f);
  }
  if(shown === 0){
    var e = document.createElement("div");
    e.className = "empty";
    e.textContent = "沒有找到這個食物，可以選最接近的一種";
    box.appendChild(e);
  }
}

function renderPanel(){
  $("total").innerHTML = curTotal() + '<small>大卡</small>';
  var box = $("picked");
  box.innerHTML = "";
  if(cur.items.length === 0){
    box.innerHTML = '<div class="empty">還沒選食物<br>點左邊的食物就會出現在這裡</div>';
    $("saveBtn").disabled = true;
    return;
  }
  $("saveBtn").disabled = false;
  for(var i = 0; i < cur.items.length; i++){
    (function(i){
      var it = cur.items[i];
      var row = document.createElement("div");
      row.className = "pick";

      var minus = document.createElement("button");
      minus.className = "qbtn";
      minus.textContent = "−";
      minus.onclick = function(){ bumpItem(i, -1); };

      var qn = document.createElement("span");
      qn.className = "qn";
      qn.textContent = it.q;

      var plus = document.createElement("button");
      plus.className = "qbtn";
      plus.textContent = "＋";
      plus.onclick = function(){ bumpItem(i, 1); };

      var nm = document.createElement("span");
      nm.className = "pn";
      nm.innerHTML = "<b>" + it.n + "</b><i>" + it.u + " × " + it.q + "</i>";
      nm.style.borderLeft = "5px solid " + catColor(it.c);
      nm.style.paddingLeft = "7px";

      var kk = document.createElement("span");
      kk.className = "pk";
      kk.textContent = (it.k * it.q) + " 大卡";

      row.appendChild(minus);
      row.appendChild(qn);
      row.appendChild(plus);
      row.appendChild(nm);
      row.appendChild(kk);
      box.appendChild(row);
    })(i);
  }
}

function recRow(r, withDel){
  var row = document.createElement("div");
  row.className = "rec";

  if(r.img){
    var im = document.createElement("img");
    im.src = r.img;
    im.alt = r.meal + "的照片";
    row.appendChild(im);
  }else{
    var ph = document.createElement("div");
    ph.className = "noimg";
    ph.textContent = "🍽";
    row.appendChild(ph);
  }

  var b = document.createElement("div");
  b.className = "rb";
  var names = [];
  for(var i = 0; i < r.items.length; i++){
    names.push(r.items[i].n + (r.items[i].q > 1 ? "×" + r.items[i].q : ""));
  }
  b.innerHTML = '<div class="rm">' + prettyDate(r.d) + "　" + r.meal + '</div>' +
                '<div class="rl">' + names.join("、") + '</div>';
  row.appendChild(b);

  var k = document.createElement("div");
  k.className = "rk";
  k.textContent = r.total + " 大卡";
  row.appendChild(k);

  if(withDel){
    var del = document.createElement("button");
    del.className = "delbtn";
    del.textContent = "刪";
    del.onclick = function(){
      if(!confirm("要刪掉這一筆嗎？")){ return; }
      var out = [];
      for(var i = 0; i < save.recs.length; i++){
        if(save.recs[i].id !== r.id){ out.push(save.recs[i]); }
      }
      save.recs = out;
      writeSave();
      renderToday();
      renderHist();
    };
    row.appendChild(del);
  }
  return row;
}

function renderToday(){
  var t = todayStr();
  var box = $("todayList");
  box.innerHTML = "";
  var sum = 0;
  var got = [0,0,0,0,0,0,0,0];
  var n = 0;
  for(var i = 0; i < save.recs.length; i++){
    var r = save.recs[i];
    if(r.d !== t){ continue; }
    n++;
    sum += r.total;
    for(var j = 0; j < r.items.length; j++){ got[r.items[j].c] = 1; }
    box.appendChild(recRow(r, true));
  }
  if(n === 0){
    box.innerHTML = '<div class="empty">今天還沒有紀錄<br>到「記一餐」拍張照吧</div>';
  }else{
    var s = document.createElement("div");
    s.className = "daysum";
    s.innerHTML = "<span>今天合計</span><span>" + sum + " 大卡</span>";
    box.appendChild(s);
  }
  $("todayTtl").textContent = "今天吃的（" + prettyDate(t) + "）";

  var sb = $("sixBox");
  sb.innerHTML = "";
  for(var c = 0; c < 6; c++){
    var d = document.createElement("div");
    d.className = "pick";
    d.innerHTML = '<span class="pn" style="border-left:5px solid ' + catColor(c) +
                  ';padding-left:7px"><b>' + CATS[c].full + '</b></span>' +
                  '<span class="pk">' + (got[c] ? "✅ 有" : "還沒") + '</span>';
    sb.appendChild(d);
  }
}

function renderHist(){
  var box = $("histList");
  box.innerHTML = "";
  var t = todayStr();
  var days = [];
  var map = {};
  for(var i = save.recs.length - 1; i >= 0; i--){
    var r = save.recs[i];
    if(r.d === t){ continue; }
    if(!map[r.d]){ map[r.d] = []; days.push(r.d); }
    map[r.d].push(r);
  }
  if(days.length === 0){
    box.innerHTML = '<div class="empty">還沒有過去的紀錄</div>';
    return;
  }
  for(var d = 0; d < days.length && d < 30; d++){
    var sum = 0;
    var list = map[days[d]];
    for(var j = 0; j < list.length; j++){
      sum += list[j].total;
      box.appendChild(recRow(list[j], true));
    }
    var s = document.createElement("div");
    s.className = "daysum";
    s.innerHTML = "<span>" + prettyDate(days[d]) + " 合計</span><span>" + sum + " 大卡</span>";
    box.appendChild(s);
  }
}

/* ========================= 照片 ========================= */
function handleFile(file){
  if(!file){ return; }
  var fr = new FileReader();
  fr.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      try{
        var max = 260;
        var w = img.width;
        var h = img.height;
        var sc = Math.min(max / w, max / h, 1);
        var cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(w * sc));
        cv.height = Math.max(1, Math.round(h * sc));
        var ctx = cv.getContext("2d");
        ctx.drawImage(img, 0, 0, cv.width, cv.height);
        cur.img = cv.toDataURL("image/jpeg", 0.5);
        showThumb();
      }catch(e){}
    };
    img.onerror = function(){};
    img.src = ev.target.result;
  };
  fr.readAsDataURL(file);
}

function showThumb(){
  var t = $("thumb");
  if(cur.img){
    t.src = cur.img;
    t.className = "thumb on";
    $("clrImg").style.display = "block";
  }else{
    t.className = "thumb";
    t.removeAttribute("src");
    $("clrImg").style.display = "none";
  }
}

/* ========================= 存檔 ========================= */
function saveMeal(){
  if(cur.items.length === 0){ return; }
  var items = [];
  for(var i = 0; i < cur.items.length; i++){
    var it = cur.items[i];
    items.push({n:it.n, u:it.u, k:it.k, c:it.c, q:it.q});
  }
  var r = {
    id: "r" + Date.now() + Math.floor(Math.random() * 1000),
    d: todayStr(),
    meal: cur.meal,
    items: items,
    total: curTotal()
  };
  if(cur.img){ r.img = cur.img; }
  save.recs.push(r);
  var ok = writeSave();

  cur.img = "";
  cur.items = [];
  showThumb();
  renderPanel();
  renderToday();
  renderHist();
  go(1);
  if(!ok){
    var b = $("errBar");
    b.style.display = "block";
    b.textContent = "裝置儲存空間已滿，這筆有存到但照片可能沒留下。";
  }
}

/* ========================= 分頁與設定 ========================= */
function go(i){
  for(var k = 0; k < 3; k++){
    $("s" + k).className = "screen" + (k === i ? " on" : "");
    $("tab" + k).className = (k === i ? "on" : "");
  }
}

var fs = 1;
function setFs(d){
  fs = Math.min(1.5, Math.max(0.8, fs + d));
  document.documentElement.style.setProperty("--fs", fs);
}

function init(){
  loadSave();
  renderCats();
  renderFoods();
  renderPanel();
  renderToday();
  renderHist();

  $("tab0").onclick = function(){ go(0); };
  $("tab1").onclick = function(){ go(1); renderToday(); };
  $("tab2").onclick = function(){ go(2); renderHist(); };

  $("q").oninput = renderFoods;

  var mr = $("mealRow").getElementsByTagName("button");
  for(var i = 0; i < mr.length; i++){
    (function(btn){
      btn.onclick = function(){
        for(var j = 0; j < mr.length; j++){ mr[j].className = ""; }
        btn.className = "on";
        cur.meal = btn.getAttribute("data-m");
      };
    })(mr[i]);
  }

  $("camBtn").onclick = function(){ $("camIn").click(); };
  $("albBtn").onclick = function(){ $("albIn").click(); };
  $("camIn").onchange = function(){ handleFile(this.files && this.files[0]); this.value = ""; };
  $("albIn").onchange = function(){ handleFile(this.files && this.files[0]); this.value = ""; };
  $("clrImg").onclick = function(){ cur.img = ""; showThumb(); };

  $("saveBtn").onclick = saveMeal;
  $("fontUp").onclick = function(){ setFs(0.1); };
  $("fontDn").onclick = function(){ setFs(-0.1); };
  $("fsBtn").onclick = function(){
    try{
      if(document.fullscreenElement){ document.exitFullscreen(); }
      else if(document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen(); }
    }catch(e){}
  };
}

init();
</script>
