function pollGamepad(){
  const pad=activePad(),badge=document.getElementById('padBadge');

    return;
  }
  if(padId!==pad.id){padId=pad.id;if(badge){badge.textContent='🎮 '+pad.id.replace(/\(.*?\)/g,'').trim().slice(0,26);badge.classList.add('on');}show('手把已連線','#8feaff');}

        hit=i=>down(i)&&!was(i),lift=i=>!down(i)&&was(i),
        ax=pad.axes[0]||0,ay=pad.axes[1]||0;
  // --- 移動：左蘑菇頭或十字鍵 ---
  padKeys.left=ax<-PAD_DEADZONE||down(14);
  padKeys.right=ax>PAD_DEADZONE||down(15);
  padKeys.up=ay<-PAD_DEADZONE||down(12);
  padKeys.down=ay>PAD_DEADZONE||down(13);
  // --- 選單／角色編輯器／商店：交給 UI 導覽 ---
  const panel=activeUIPanel();
  if(panel){
    padKeys.left=padKeys.right=false;
    const navX=ax<-PAD_DEADZONE||down(14)?-1:ax>PAD_DEADZONE||down(15)?1:0,
          navY=ay<-PAD_DEADZONE||down(12)?-1:ay>PAD_DEADZONE||down(13)?1:0;

  // --- 發球：左蘑菇頭往身後拉＝蓄力（上=長發／中下=短發），回中放球；或按住 A/B ---

    }else{
      if(hit(0))startServeCharge('serveShort');
      if(hit(1))startServeCharge('serveLong');
      if(serveState&&serveState.type==='serveShort'&&lift(0))releaseServe();
      else if(serveState&&serveState.type==='serveLong'&&lift(1))releaseServe();
    }
    padPrev=pad.buttons.map(b=>b.pressed);return;
  }
  // --- 慢鏡戰術：X=前點 A=追身 B=底線 Y=絕招 ---
  if(tacticState){
    if(hit(2))resolveTactics('front');
    else if(hit(0))resolveTactics('body');
    else if(hit(1))resolveTactics('back');
    else if(hit(3))resolveTactics('ultimate');
    padPrev=pad.buttons.map(b=>b.pressed);return;
  }
  // --- 一般擊球 ---
  if(replay){if(hit(0)||hit(1)||hit(2)||hit(3)||hit(9))skipReplay();padPrev=pad.buttons.map(b=>b.pressed);return;}
  if(hit(0)){flashKey('drop');tryHit('drop');}
  if(hit(1)){flashKey('clear');tryHit('clear');}
  if(hit(2)||hit(5)){flashKey('smash');A.smashCharge=0;A.smashHolding=true;tryHit('smash');}
  if(!down(2)&&!down(5))A.smashHolding=false;
  if(hit(3)||hit(4)){flashKey('ultimate');tryHit('ultimate');}
  padPrev=pad.buttons.map(b=>b.pressed);
}
