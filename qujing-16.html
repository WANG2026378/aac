<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>取經傳・十六難</title>
<meta name="description" content="西遊記十六難的橫向破關動作遊戲。師徒五人各有封號形態，二十五名妖魔守關。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="十六難">
<meta name="theme-color" content="#080b12">
<link rel="apple-touch-icon" href="icons/portal-180.png">
<link rel="icon" type="image/png" href="icons/portal-512.png">
<style>
  :root{--gold:#ffd36a;--ink:#080b12;--line:rgba(212,230,255,.28);--glass:rgba(7,12,20,.76);}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#080b12;color:#f5f3ea;
    font-family:"PingFang TC","Noto Sans TC",sans-serif;}
  button{font:inherit;color:inherit;border:0;cursor:pointer;user-select:none;-webkit-user-select:none;}
  #app{position:fixed;inset:0;background:#080b12;overflow:hidden;}
  #homeBtn{position:fixed;z-index:60;top:max(8px,env(safe-area-inset-top));
    left:max(10px,env(safe-area-inset-left));padding:7px 13px;font-size:13px;
    letter-spacing:.06em;color:#d8e2f4;text-decoration:none;border-radius:3px;
    border:1px solid rgba(212,230,255,.3);background:rgba(7,12,20,.72);
    backdrop-filter:blur(3px);touch-action:auto;}
  #homeBtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  #errBar{display:none;position:fixed;left:0;right:0;top:0;z-index:99;padding:10px 14px;
    background:#c0392b;color:#fff;font-size:13px;line-height:1.5;touch-action:auto;}
  #game{display:block;width:100%;height:100%;background:#10151e;}
  .screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:
    max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right))
    max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));z-index:20;}
  .screen.hidden,.hidden{display:none!important;}
  .select-panel{width:min(980px,96vw);max-height:94dvh;overflow:auto;background:rgba(7,10,16,.92);
    border:1px solid rgba(255,211,106,.42);box-shadow:0 22px 80px rgba(0,0,0,.6);padding:22px;}
  .game-title{text-align:center;color:var(--gold);font-family:"Hiragino Mincho ProN","Noto Serif TC",serif;
    font-size:clamp(28px,6vw,58px);letter-spacing:.12em;font-weight:800;text-shadow:0 3px 0 #5e291d,0 0 22px rgba(255,110,50,.38);}
  .chapter{text-align:center;margin-top:5px;color:#9dc9d1;font-size:12px;letter-spacing:.38em;}
  .hero-grid{display:grid;grid-template-columns:repeat(5,minmax(112px,1fr));gap:10px;margin-top:20px;}
  .hero-card{position:relative;min-width:0;border:1px solid var(--line);background:#111523;padding:6px 6px 10px;
    text-align:center;border-radius:5px;transition:transform .15s,border-color .15s;}
  .hero-card.selected{border:2px solid var(--gold);padding:5px 5px 9px;transform:translateY(-4px);background:#1b1820;}
  .hero-card canvas{display:block;width:100%;height:180px;background:#0b1019;border-bottom:1px solid rgba(255,255,255,.08);}
  .hero-card strong{display:block;font-size:16px;margin-top:7px;color:#fff;white-space:nowrap;}
  .hero-card span{display:block;color:#aeb9c8;font-size:11px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .journey-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:17px;padding:0 2px 8px;
    border-bottom:1px solid rgba(255,211,106,.25);font-family:"Hiragino Mincho ProN","Noto Serif TC",serif;}
  .journey-head strong{color:var(--gold);font-size:18px;letter-spacing:.08em}.journey-head span{color:#9dc9d1;font-size:12px;font-weight:800;}
  .stage-select{display:grid;grid-template-columns:repeat(8,minmax(74px,1fr));gap:7px;margin-top:10px;}
  .stage-card{min-height:54px;padding:7px 5px;border-radius:6px;text-align:center;background:linear-gradient(155deg,#252130,#0d1420);
    box-shadow:inset 0 0 0 1px rgba(186,205,218,.2);}
  .stage-card span,.stage-card b,.stage-card small{display:block}.stage-card span{color:#91a9b7;font-size:10px;font-weight:800;}
  .stage-card b{color:#f6f0df;font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stage-card small{color:#83cbd0;font-size:9px;margin-top:2px}.stage-card.selected{background:linear-gradient(155deg,#5b3424,#17212b);
    box-shadow:0 0 0 2px var(--gold),inset 0 0 20px rgba(255,199,92,.12);}
  .stage-card:disabled{opacity:.4;cursor:not-allowed}.stage-card:disabled small{color:#8b8d94;}
  .ui-focus{outline:3px solid #73e8ff!important;outline-offset:3px;filter:brightness(1.13);}
  .primary{display:block;margin:18px auto 0;min-width:190px;padding:13px 24px;background:var(--gold);color:#17120a;
    border-radius:4px;font-weight:900;letter-spacing:.18em;font-size:17px;box-shadow:0 5px 0 #8a5124;}
  .primary:active{transform:translateY(3px);box-shadow:0 2px 0 #8a5124;}
  #hud{position:absolute;inset:0 0 auto 0;padding:max(10px,env(safe-area-inset-top)) 14px 0;z-index:8;pointer-events:none;}
  .hud-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;}
  .player-hud,.boss-hud{width:min(38vw,420px);padding:8px 10px;background:var(--glass);border:1px solid var(--line);}
  .boss-hud{text-align:right;}
  .hud-name{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:800;margin-bottom:5px;}
  .bar{height:12px;background:#1a1d25;border:1px solid rgba(255,255,255,.2);overflow:hidden;}
  .fill{height:100%;width:100%;transform-origin:left center;background:#49bd6b;transition:width .12s linear;}
  #energyFill{background:#41b9dc;}.boss-hud .fill{background:#dd4a47;}
  .energy{height:7px;margin-top:4px;}
  .inventory{display:flex;gap:10px;margin-top:5px;color:#d8e1ea;font-size:11px;}
  #stageName{position:absolute;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);
    background:rgba(7,12,20,.76);border:1px solid rgba(255,211,106,.35);padding:7px 13px;color:var(--gold);
    font-family:"Hiragino Mincho ProN","Noto Serif TC",serif;font-weight:800;letter-spacing:.1em;white-space:nowrap;}
  #topActions{position:absolute;right:max(10px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 62px);
    display:flex;gap:8px;z-index:12;}
  .icon-btn{width:42px;height:42px;border-radius:50%;background:rgba(8,12,19,.76);border:1px solid rgba(255,255,255,.3);
    display:grid;place-items:center;font-size:20px;}
  #touchControls{position:absolute;inset:0;z-index:10;pointer-events:none;}
  #stickArea{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));
    width:150px;height:150px;border-radius:50%;background:rgba(9,16,25,.32);border:2px solid rgba(210,235,255,.3);
    pointer-events:auto;}
  #stickKnob{position:absolute;left:47px;top:47px;width:56px;height:56px;border-radius:50%;background:rgba(212,232,244,.5);
    border:2px solid rgba(255,255,255,.66);box-shadow:0 4px 18px rgba(0,0,0,.35);}
  #actionPad{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));
    width:262px;height:184px;pointer-events:none;}
  .action{position:absolute;width:76px;height:76px;border-radius:50%;pointer-events:auto;border:2px solid rgba(255,255,255,.5);
    background:rgba(11,19,28,.5);font-weight:900;font-size:16px;text-shadow:0 2px 3px #000;}
  #attackBtn{right:0;bottom:0;background:rgba(198,55,42,.62);}
  #heavyBtn{right:0;bottom:88px;background:rgba(202,105,34,.64);}
  #jumpBtn{right:84px;bottom:0;background:rgba(48,130,178,.58);}
  #skillBtn{right:84px;bottom:88px;background:rgba(151,74,183,.58);}
  .action:active,.action.down{transform:scale(.92);filter:brightness(1.3);}
  #message{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:16;text-align:center;
    font-family:"Hiragino Mincho ProN","Noto Serif TC",serif;font-weight:900;color:#fff;font-size:clamp(24px,5vw,52px);
    text-shadow:0 3px 0 #30120b,0 0 22px #e46430;pointer-events:none;white-space:nowrap;}
  #ultimateBanner{position:absolute;inset:0;z-index:17;display:grid;place-items:center;pointer-events:none;opacity:0;}
  #ultimateBanner.show{animation:ultimate-banner .95s ease-out both;}
  #ultimateGlyph{font-family:"Hiragino Mincho ProN","Noto Serif TC",serif;font-size:min(42vw,330px);font-weight:900;
    color:#fff7cf;line-height:.8;text-shadow:0 0 8px #fff,0 0 30px #ffc94f,8px 10px 0 rgba(98,30,16,.66);transform:rotate(-8deg);}
  #ultimateName{position:absolute;top:68%;font-family:"Hiragino Mincho ProN","Noto Serif TC",serif;font-size:clamp(23px,5vw,54px);
    color:#ffd36a;font-weight:900;letter-spacing:.18em;text-shadow:0 3px 0 #42150b,0 0 20px #ff6c38;white-space:nowrap;}
  #impactFlash{position:absolute;inset:0;z-index:15;background:#fff4ba;opacity:0;pointer-events:none;mix-blend-mode:screen;}
  #impactFlash.flash{animation:impact-flash .28s ease-out both;}
  @keyframes ultimate-banner{0%{opacity:0;transform:scale(1.8)}18%{opacity:1;transform:scale(.86)}38%{transform:scale(1.05)}72%{opacity:1}100%{opacity:0;transform:scale(1.12)}}
  @keyframes impact-flash{0%{opacity:.88}35%{opacity:.28}100%{opacity:0}}
  #endPanel{background:rgba(4,7,11,.74);}
  .end-box{width:min(460px,92vw);padding:28px;background:#0d131d;border:1px solid rgba(255,211,106,.45);text-align:center;}
  .end-box h2{font-size:34px;color:var(--gold);}.end-box p{margin-top:9px;color:#b8c3ce;}
  #creditsPanel{padding:0;display:block;overflow:hidden;z-index:26;background:#030508;}
  #creditsPanel::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:
    linear-gradient(180deg,rgba(0,0,0,.94),transparent 14%,transparent 82%,rgba(0,0,0,.94)),
    radial-gradient(ellipse at center,transparent 34%,rgba(0,0,0,.78) 100%);}
  #creditsExitBtn{position:absolute;z-index:5;right:max(14px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));
    width:46px;height:46px;border-radius:50%;background:rgba(8,12,18,.72);box-shadow:inset 0 0 0 1px rgba(255,221,145,.55);font-size:20px;}
  .credits-roll{position:absolute;z-index:1;left:0;right:0;top:0;will-change:transform;}
  .credits-roll.playing{animation:credits-roll 255s linear forwards;}
  .credits-intro,.credits-final{min-height:78dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;}
  .credits-intro small{color:#88c7cf;letter-spacing:.42em}.credits-intro h2,.credits-final h2{margin-top:14px;color:var(--gold);
    font-family:"Hiragino Mincho ProN","Noto Serif TC",serif;font-size:clamp(38px,8vw,88px);letter-spacing:.16em;text-shadow:0 0 30px rgba(255,177,75,.34);}
  .credits-intro p,.credits-final p{max-width:680px;margin-top:18px;color:#c5cbd0;line-height:2;font-size:clamp(14px,2vw,19px);}
  .credits-entry{width:min(920px,91vw);min-height:62dvh;margin:0 auto;display:grid;grid-template-columns:minmax(180px,36%) 1fr;
    gap:clamp(24px,5vw,70px);align-items:center;padding:34px 0;border-bottom:1px solid rgba(255,220,144,.1);}
  .credits-entry:nth-child(odd) img{order:2}.credits-entry img{width:100%;max-height:54dvh;aspect-ratio:5/6;object-fit:cover;object-position:50% 22%;
    border-radius:4px;box-shadow:0 20px 70px rgba(0,0,0,.72),0 0 0 1px rgba(255,222,154,.2);}
  .credits-copy small{color:#79bdc8;font-size:11px;letter-spacing:.28em}.credits-copy h3{margin-top:9px;color:#fff1bf;
    font-family:"Hiragino Mincho ProN","Noto Serif TC",serif;font-size:clamp(27px,4vw,48px);font-weight:800;}
  .credits-copy b{display:block;margin-top:8px;color:#d6a54e;font-size:15px;letter-spacing:.1em}.credits-copy p{margin-top:17px;color:#c6cbd0;font-size:clamp(14px,1.6vw,18px);line-height:1.95;}
  .credits-final{min-height:84dvh}.credits-final h2{font-size:clamp(34px,7vw,74px)}
  @keyframes credits-roll{from{transform:translateY(0)}to{transform:translateY(-100%)}}
  .story-box{width:min(850px,94vw);display:grid;grid-template-columns:minmax(190px,36%) 1fr;max-height:88dvh;
    overflow:hidden;background:#0a0e16;border:1px solid rgba(255,211,106,.46);box-shadow:0 24px 90px #000;}
  .story-box img{width:100%;height:100%;min-height:360px;object-fit:cover;object-position:50% 24%;background:#111;}
  .story-copy{padding:clamp(20px,4vw,42px);align-self:center;}.story-copy small{color:#8fc6d0;letter-spacing:.24em;}
  .story-copy h2{color:var(--gold);font-family:"Hiragino Mincho ProN","Noto Serif TC",serif;font-size:clamp(26px,5vw,46px);margin-top:8px;}
  .story-copy p{color:#c8d0d8;line-height:1.9;margin-top:16px;font-size:15px;white-space:pre-line;}
  .shop-box{width:min(860px,94vw);max-height:90dvh;overflow:auto;background:#0d131d;border:1px solid rgba(255,211,106,.5);padding:22px;}
  .shop-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.shop-head h2{color:var(--gold);font-size:30px}.shop-head strong{font-size:18px;color:#ffe6a0;}
  .shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px;}.shop-item{padding:14px;background:#151b26;border:1px solid var(--line);text-align:left;border-radius:4px;}
  .shop-item b{display:block;color:#fff;font-size:16px}.shop-item span{display:block;color:#9eabb8;font-size:12px;line-height:1.55;margin-top:5px}.shop-item em{display:block;color:var(--gold);font-style:normal;margin-top:10px;font-weight:800;}
  .shop-item:disabled{opacity:.42}.shop-item:not(:disabled):active{transform:scale(.97)}
  .art-forge{margin-top:16px;padding:14px 14px 18px;border-radius:7px;background:rgba(17,22,31,.72);box-shadow:inset 0 0 0 1px rgba(255,213,112,.22);}
  .art-forge h3{color:var(--gold);font-family:"Noto Serif TC",serif;font-size:17px}.art-forge p{color:#9facb8;font-size:12px;margin-top:4px;}
  .art-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}.art-chip{min-width:82px;padding:9px 12px;border-radius:5px;background:#151c27;box-shadow:inset 0 0 0 1px rgba(188,210,220,.22);font-size:13px;font-weight:800;}
  .art-chip.equipped{color:#161006;background:linear-gradient(#ffe39a,#d99c3d);box-shadow:0 0 0 2px rgba(255,235,168,.35);}.art-chip:disabled{opacity:.28;}
  .item-btn{position:absolute;width:46px;height:46px;border-radius:50%;pointer-events:auto;background:rgba(11,19,28,.58);border:1px solid rgba(255,255,255,.5);font-size:12px;font-weight:800;}
  #hpPotionBtn{left:0;bottom:56px;color:#ff8a83}#mpPotionBtn{left:0;bottom:5px;color:#72d8ff}

  /* 古風戰卷介面：雲紋收頂、海水紋收底，避免面板只剩僵硬直線。 */
  .select-panel,.story-box,.shop-box,.end-box{
    position:relative;isolation:isolate;border:0;border-radius:8px;
    background-color:rgba(9,13,22,.95);
    background-image:
      radial-gradient(ellipse at 12px 100%,transparent 9px,rgba(108,176,184,.22) 10px 12px,transparent 13px),
      radial-gradient(ellipse at 38px 100%,transparent 13px,rgba(108,176,184,.15) 14px 16px,transparent 17px),
      linear-gradient(135deg,rgba(126,42,29,.23),transparent 34%),
      linear-gradient(180deg,rgba(255,214,116,.08),transparent 18%,transparent 76%,rgba(64,132,145,.12));
    background-size:52px 26px,76px 34px,100% 100%,100% 100%;
    background-position:0 100%,18px 100%,0 0,0 0;background-repeat:repeat-x,repeat-x,no-repeat,no-repeat;
    box-shadow:0 24px 86px rgba(0,0,0,.68),inset 0 0 0 1px rgba(255,211,106,.28),inset 0 0 32px rgba(132,69,37,.12);
  }
  .select-panel::before,.story-box::before,.shop-box::before,.end-box::before{
    content:"";position:absolute;z-index:0;inset:8px 12px auto;height:34px;pointer-events:none;opacity:.58;
    background:
      radial-gradient(ellipse at 20px 17px,transparent 10px,rgba(255,213,111,.38) 11px 12px,transparent 13px) 0 0/74px 30px repeat-x,
      radial-gradient(ellipse at 52px 9px,transparent 7px,rgba(255,213,111,.22) 8px 9px,transparent 10px) 0 0/90px 26px repeat-x;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  }
  .select-panel>* ,.story-box>* ,.shop-box>* ,.end-box>*{position:relative;z-index:1;}
  .hero-card,.shop-item{border:0;border-radius:7px;background:
    radial-gradient(circle at 8px 8px,rgba(255,215,122,.16) 0 2px,transparent 3px),
    linear-gradient(155deg,rgba(40,35,49,.98),rgba(12,17,28,.98));
    box-shadow:inset 0 0 0 1px rgba(186,205,218,.2),inset 0 -12px 25px rgba(36,104,112,.08);}
  .hero-card::after,.shop-item::after{content:"";position:absolute;left:10%;right:10%;bottom:3px;height:9px;opacity:.5;pointer-events:none;
    background:radial-gradient(ellipse at 10px 9px,transparent 6px,rgba(105,184,194,.42) 7px 8px,transparent 9px) 0 0/32px 9px repeat-x;}
  .hero-card.selected{border:0;box-shadow:0 0 0 2px var(--gold),0 10px 30px rgba(0,0,0,.48),inset 0 -18px 30px rgba(128,46,30,.2);}
  .primary{border-radius:5px 5px 18px 18px;background:linear-gradient(180deg,#ffe39a,#d99c3d);box-shadow:0 5px 0 #70401f,inset 0 0 0 2px rgba(255,249,205,.48);}
  .player-hud,.boss-hud,#stageName{border:0;border-radius:0 14px 14px 14px;background:
    radial-gradient(ellipse at 16px 100%,transparent 8px,rgba(98,188,195,.2) 9px 10px,transparent 11px) 0 100%/38px 14px repeat-x,
    linear-gradient(100deg,rgba(7,12,20,.94),rgba(27,31,39,.78));
    box-shadow:inset 0 0 0 1px rgba(255,216,122,.24),0 5px 20px rgba(0,0,0,.26);}
  .boss-hud{border-radius:14px 0 14px 14px;}
  .bar{border:0;border-radius:8px;background:
    radial-gradient(ellipse at 10px 8px,transparent 5px,rgba(255,255,255,.08) 6px 7px,transparent 8px) 0 0/24px 12px repeat-x,
    rgba(12,14,20,.84);box-shadow:inset 0 0 0 1px rgba(255,231,177,.2);}
  .fill{border-radius:8px;box-shadow:inset 0 2px rgba(255,255,255,.2),0 0 10px currentColor;}
  #stickArea{background:
    repeating-radial-gradient(circle at center,transparent 0 27px,rgba(105,190,198,.14) 28px 30px,transparent 31px 42px),
    rgba(9,16,25,.34);border-color:rgba(209,185,124,.46);box-shadow:inset 0 0 22px rgba(70,166,178,.15);}
  #stickKnob{background:radial-gradient(circle at 36% 30%,rgba(255,241,198,.74),rgba(96,147,157,.52) 48%,rgba(22,42,51,.7));border-color:rgba(255,224,151,.58);}
  .action,.item-btn,.icon-btn{border-color:rgba(255,224,158,.56);box-shadow:inset 0 0 0 4px rgba(0,0,0,.16),inset 0 0 18px rgba(255,225,154,.08),0 5px 16px rgba(0,0,0,.3);}
  .icon-btn{position:relative;}
  .action::after,.item-btn::after,.icon-btn::after{content:"";position:absolute;inset:5px;border-radius:50%;pointer-events:none;
    border:1px solid rgba(255,227,169,.2);border-top-color:rgba(255,244,208,.54);}
  #attackBtn{background:radial-gradient(circle at 35% 28%,rgba(255,139,91,.76),rgba(128,29,25,.72));}
  #heavyBtn{background:radial-gradient(circle at 35% 28%,rgba(255,183,90,.78),rgba(126,60,19,.75));}
  #jumpBtn{background:radial-gradient(circle at 35% 28%,rgba(111,204,226,.75),rgba(24,82,119,.72));}
  #skillBtn{background:radial-gradient(circle at 35% 28%,rgba(211,132,236,.76),rgba(80,35,112,.76));}
  @media(pointer:fine){#touchControls{opacity:.55;}}
  @media(max-width:760px){
    .select-panel{padding:15px 10px}.hero-grid{grid-template-columns:repeat(3,minmax(92px,1fr));gap:7px}
    .hero-card canvas{height:135px}.hero-card strong{font-size:14px}
    .stage-select{grid-template-columns:repeat(4,minmax(68px,1fr))}.stage-card{min-height:49px}
    .player-hud,.boss-hud{width:37vw;padding:6px}.hud-name{font-size:11px}.bar{height:9px}
    #stageName{top:48px;font-size:11px;padding:5px 8px}

<script>
"use strict";
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
let time=0;
const ATTACK_MODEL_RIG=Object.freeze({
  footY:0, hipY:-50, torsoLift:-22, headY:-72,
  thigh:27, shin:26,
  upperArm:18, forearm:16.5,
  rearUpperArm:17.5, rearForearm:16.5,
  freeUpperArm:17, freeForearm:15.5
});
const RANKS=[{hc:'#6b6250'},{hc:'#8a7a52'},{hc:'#b04a3a'},{hc:'#c94b4b'},
             {hc:'#e0553f'},{hc:'#e0553f'},{hc:'#ffcf6b'}];
function ease(t){return t*t*(3-2*t)}
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return "#"+((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");
}
/* 兩節肢體的反向運動學（IK）。
   給定根部（肩／髖）與末端（手／腳），用餘弦定理解出中間關節。
   pref='front' 關節朝前（膝），'back' 朝後（肘）——這是人體的實際彎曲方向。 */
function limb2(c,sx,sy,ex,ey,l1,l2,pref,w,color){
  let dx=ex-sx, dy=ey-sy, d=Math.hypot(dx,dy);
  const max=l1+l2-0.001, min=Math.abs(l1-l2)+0.001;
  if(d>max){ const k=max/d; ex=sx+dx*k; ey=sy+dy*k; dx*=k; dy*=k; d=max; }
  if(d<min){ const k=min/Math.max(d,0.001); ex=sx+dx*k; ey=sy+dy*k; dx*=k; dy*=k; d=min; }
  const base=Math.atan2(dy,dx);
  const cosA=clamp((d*d+l1*l1-l2*l2)/(2*d*l1),-1,1);
  const A=Math.acos(cosA);
  // 兩組解，取關節較前或較後的那一組
  const j1x=sx+Math.cos(base+A)*l1, j1y=sy+Math.sin(base+A)*l1;
  const j2x=sx+Math.cos(base-A)*l1, j2y=sy+Math.sin(base-A)*l1;
  const useFirst = pref==='front' ? (j1x>j2x) : (j1x<j2x);
  const jx=useFirst?j1x:j2x, jy=useFirst?j1y:j2y;
  limb(c,sx,sy,jx,jy,w,color);                 // 上臂／大腿
  limb(c,jx,jy,ex,ey,w*0.84,color);            // 前臂／小腿
  return {jx:jx,jy:jy,ex:ex,ey:ey};
}
function limb(c,x1,y1,x2,y2,w,color){c.strokeStyle='#120f0b';c.lineWidth=w+2.4;c.lineCap='round';
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
  c.strokeStyle=color;c.lineWidth=w;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function drawHand(c,x,y,ang,skin,cuff,slim,gripping){
  const palmL=slim?7.1:8.4, palmW=slim?3.8:4.5;
  c.save(); c.translate(x,y); c.rotate(ang);
  // 袖口包住手腕，前臂不會直接變成一顆圓球。
  c.fillStyle=shade(cuff,-18); c.strokeStyle='#120f0b'; c.lineWidth=1;
  c.fillRect(-5.5,-palmW,5.2,palmW*2); c.strokeRect(-5.5,-palmW,5.2,palmW*2);
  c.fillStyle=skin; c.strokeStyle='#120f0b'; c.lineWidth=1.05;
  c.beginPath(); c.ellipse(1.8,0,palmL*.58,palmW,0,0,TAU); c.fill(); c.stroke();
  // 握武器時手掌包住柄，三條短線表現手指，不畫成張開的手掌。
  c.strokeStyle=shade(skin,-48); c.lineWidth=.75; c.lineCap='round';
  if(gripping){
    for(let i=-1;i<=1;i++){c.beginPath();c.moveTo(.2,i*1.65);c.quadraticCurveTo(2.5,i*2.1,4.4,i*1.45);c.stroke();}
    c.beginPath(); c.moveTo(-.6,-palmW*.72); c.quadraticCurveTo(2,-palmW*1.12,4.2,-palmW*.5); c.stroke();
  } else {
    for(let i=-1;i<=1;i++){c.beginPath();c.moveTo(3.1,i*1.35);c.lineTo(6.2,i*1.55);c.stroke();}
  }
  c.restore();
}
function combatGait(ph,stride,lift){
  const u=(((ph%TAU)+TAU)%TAU)/TAU, duty=.64;
  if(u<duty){
    const k=u/duty;
    return {x:stride*(1-2*k),y:ATTACK_MODEL_RIG.footY,planted:true};
  }
  const k=(u-duty)/(1-duty);
  return {x:stride*(-1+2*k),y:ATTACK_MODEL_RIG.footY-lift*Math.sin(k*Math.PI),planted:false};
}
/* 所有動作只改關節與重心。骨長、頭身、髖與角色外框永遠取自同一個攻擊母模型。 */
function pose(type,t,fem){
  const q={bob:0,walk:0,attack:0,recoil:0,sway:0,lean:0,breath:0,antic:0,
    crouch:0,armLift:0,air:0,land:0,hurt:0,skill:0,heavy:0,slam:0,cast:0,variant:1};
  q.breath = Math.sin(t*(fem?1.9:2.4))*(fem?1.5:0.9);     // 站著也有呼吸起伏
  if(type==='idle'){
    q.sway=Math.sin(t*1.45)*.5;
    q.armLift=.08+Math.sin(t*1.8)*.035;
  }
  if(type==='march'){
    const sp=fem?7.4:8.1;
    q.walk=Math.sin(t*sp)*(fem?.72:.84);
    q.bob=Math.abs(Math.sin(t*sp))*1.7;
    q.sway=Math.sin(t*sp*.5)*(fem?.5:.4);
    q.lean=-.09;q.armLift=.18;
  }
  if(type==='jump'){
    q.air=1;q.crouch=.15;q.bob=2.5;q.lean=-.12;q.armLift=.72;q.sway=-1.5;
  }
  if(type==='fall'){
    q.air=1;q.crouch=.08;q.lean=.08;q.armLift=.48;q.sway=1.2;
  }
  if(type==='land'){
    const s=clamp(t/.18,0,1);q.land=1-s;q.crouch=Math.sin(s*Math.PI)*.9;q.bob=-q.crouch*3;q.armLift=.28;
  }
  if(type==='hurt'){
    q.hurt=1;q.recoil=1;q.lean=.28;q.crouch=.48;q.armLift=-.35;q.sway=-4;
  }
  if(type==='cast'){
    q.cast=1;q.antic=.7;q.crouch=.32;q.armLift=1;q.bob=1.5;q.sway=Math.sin(t*9)*1.2;
  }
  if(type==='attack'||type==='attack2'||type==='attack3'||type==='light'||type==='heavy'||type==='jumpHeavy'||type==='skill'){
    const s=(t%1.55)/1.55;
    q.variant=type==='attack2'?2:type==='attack3'?3:type==='heavy'?4:type==='jumpHeavy'?5:1;
    q.skill=type==='skill'?1:0;
    q.heavy=type==='heavy'||type==='jumpHeavy'?1:0;q.slam=type==='jumpHeavy'?1:0;
    // 預備：真正的反向蓄力相位（不是從揮擊值推導）
    const AW=q.skill?.24:(fem?0.20:0.16);
    q.antic = s<AW ? Math.sin(s/AW*Math.PI) : 0;
    if(fem){
      // 起手慢、揮擊圓、收招留一拍，整體不那麼硬
      q.attack = s<.34 ? ease(Math.max(0,(s-AW*0.6)/(.34-AW*0.6)))
               : s<.54 ? 1-ease((s-.34)/.20)*.16
               : s<.88 ? .84*(1-ease((s-.54)/.34)) : 0;
      q.sway=Math.sin(s*Math.PI)*2.2;
    } else {
      q.attack = s<.3 ? ease(Math.max(0,(s-AW*0.6)/(.3-AW*0.6)))
               : s<.5 ? 1-ease((s-.3)/.2)*.22
               : s<.82 ? .78*(1-ease((s-.5)/.32)) : 0;
    }
    if(q.variant===2){q.lean=.08;q.sway=-Math.sin(s*Math.PI)*2.8;}
    if(q.variant===3){q.crouch=Math.sin(s*Math.PI)*.38;q.lean=-.16;q.armLift=.25;}
    if(q.heavy){q.crouch=Math.sin(s*Math.PI)*.46;q.lean=-.18+q.attack*.2;q.armLift=.32;q.sway=Math.sin(s*Math.PI)*3.4;}
    if(type==='jumpHeavy'){q.air=1;q.crouch=.34+Math.sin(s*Math.PI)*.22;q.lean=.2+q.attack*.16;q.armLift=.82;q.sway=-2.2+q.attack*4.4;q.bob=2;}
    if(q.skill){q.attack=Math.min(1,q.attack*1.12);q.crouch=Math.sin(s*Math.PI)*.42;q.armLift=.42;q.sway=Math.sin(s*Math.PI)*3.6;}
  }
  return q;
}

/* ================= 2.5D 側身立繪 =================
   讀的是跟頭像同一份 p 欄位：sk 膚色 / ey 眼 / br 眉 / bd 鬍 / bc 鬍色
   / ht 頭飾 / hc 頭飾色 / ac 甲色 / at 服裝 / ex 特徵
   軍階 ri 只加不換：甲片、肩甲、披風、描金、背纓一層層疊上去。   */
function wpKind(wp,h){
  // 手感類型。角色可用 wk 欄位直接指定，優先於名字推測。
  if(h&&h.wk&&WEAPON[h.wk]) return h.wk;
  if(/錫|經|卷/.test(wp)) return 'sutra';
  if(/弓|弩|鏢|箭/.test(wp)) return 'bow';
  if(/耙/.test(wp)) return 'rake';
  if(/棒|棍|桿|杵/.test(wp)) return 'staff';
  if(/偃月|鎚|錘|鏟|斧/.test(wp)) return 'glaive';
  if(/扇|拂塵|塵尾|淨瓶|楊柳|笏/.test(wp)||wp==='如意') return 'fan';
  if(/矛|槍|戟|尖|杖|叉/.test(wp)) return 'pole';
  return 'sword';
}
/* 外觀類型：跟手感分開，所以 25 個 Boss 能有 25 種一眼認得出的兵器，
   但共用少數幾種打擊手感。角色可用 wv 欄位指定，沒寫就依名字推。 */
function wpView(wp,h){
  if(h&&h.wv) return h.wv;
  if(/白骨/.test(wp)) return 'bone';
  if(/芭蕉/.test(wp)) return 'bigfan';
  if(/爪/.test(wp)) return 'claw';
  if(/雙劍|雙股/.test(wp)) return 'twin';
  if(/杵/.test(wp)) return 'pestle';
  if(/淨瓶|楊柳/.test(wp)) return 'vase';
  if(/拂塵|塵尾/.test(wp)) return 'whisk';
  if(/火尖/.test(wp)) return 'firespear';
  if(/三股|鋼叉/.test(wp)) return 'trident';
  if(/鎚|錘/.test(wp)) return 'mace';
  if(/畫戟/.test(wp)) return 'halberd';
  if(/兩刃/.test(wp)) return 'trident';
  if(/如意$/.test(wp)) return 'ruyi';
  if(/笏/.test(wp)) return 'tablet';
  if(/鏢/.test(wp)) return 'dart';
  if(/刀/.test(wp)) return 'saber';
  if(/長鼻/.test(wp)) return 'trunkspear';
  return wpKind(wp,h);
}

function drawWeaponEvolution(c,level,color,longWeapon,front=false){
  if(level<2)return;
  const x1=longWeapon?-32:0,y1=longWeapon?17:0,x2=longWeapon?38:48,y2=longWeapon?-19:0;
  c.save();c.globalAlpha=front?.82:.2+.07*level;c.strokeStyle=color;c.shadowColor=color;c.shadowBlur=front?5:8+level*3;
  c.lineCap='round';c.lineWidth=front?1.25:level>=5?9:4+level*.7;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
  if(level>=5&&!front){c.globalAlpha=.34;c.lineWidth=2.5;c.beginPath();c.moveTo(x1,y1-6);c.lineTo(x2+8,y2-6);c.stroke();}
  if(front){
    c.shadowBlur=3;c.fillStyle='#e8c66a';
    for(let i=0;i<Math.min(4,level-1);i++){const u=.28+i*.13,x=x1+(x2-x1)*u,y=y1+(y2-y1)*u;c.beginPath();c.arc(x,y,1.6,0,TAU);c.fill();}
    if(level>=4){c.fillStyle=color;c.font='900 7px serif';c.textAlign='center';c.textBaseline='middle';for(let i=0;i<3;i++){const a=time*1.7+i*TAU/3;c.fillText(['天','玄','破'][i],Math.cos(a)*25,Math.sin(a)*11);}}
  }
  c.restore();
}

function bodyProfile(h){
  const key=BODY_BY_NAME[h.n]||((h.p.ex||[]).includes('fem')?'graceful':'standard');
  return Object.assign({key:key},BODY_PROFILE[key]);
}
function createCharacterModel(h){
  return Object.freeze({
    h:h,
    body:Object.freeze(bodyProfile(h)),
    rig:ATTACK_MODEL_RIG
  });
}
function costumeProfile(h){
  if(['孫悟空','六耳獼猴'].includes(h.n)) return '猴王披掛';
  if(h.n==='唐三藏') return '金紅袈裟';
  if(h.n==='沙悟淨'||h.n==='豬八戒') return '取經僧裝';
  if(h.n==='白龍馬'||h.n==='二郎神') return '銀甲神將';
  if(['鐵扇公主','白骨精','蜘蛛精','蠍子精','老鼠精','玉兔精'].includes(h.n)) return '妖姬長袍';
  if(h.n==='觀音菩薩') return '白衣法相';
  if(h.p.at==='robe') return '道袍法衣';
  if(h.p.at==='scale') return '獸王鱗甲';
  return '妖王戰甲';
}
function drawCostumeDetail(c,h,p,fem,dark,gold){
  const n=h.n;
  c.save();
  if(n==='孫悟空'||n==='六耳獼猴'){
    c.strokeStyle=n==='孫悟空'?'#a9362c':'#51406f'; c.lineWidth=4.2;
    c.beginPath(); c.moveTo(-7,-58); c.lineTo(9,-38); c.moveTo(10,-58); c.lineTo(-5,-39); c.stroke();
    c.fillStyle='#d7b34a'; c.beginPath(); c.arc(2,-47,3.3,0,TAU); c.fill();
  } else if(n==='豬八戒'){
    // 天蓬元帥式厚胸與護腹，保留重量但不是矮胖喜劇身形。
    c.strokeStyle=shade(p.ac,42); c.lineWidth=3.3;
    c.beginPath(); c.moveTo(-9,-56); c.quadraticCurveTo(2,-48,11,-56); c.stroke();
    c.strokeStyle=shade(p.ac,28); c.lineWidth=2;
    c.beginPath(); c.arc(2,-39,11,Math.PI*.14,Math.PI*.86); c.stroke();
    c.fillStyle='#b89552'; c.strokeStyle=dark; c.lineWidth=1;
    c.fillRect(-3,-43,10,7); c.strokeRect(-3,-43,10,7);
  } else if(n==='唐三藏'){
    c.strokeStyle='#e1b83f'; c.lineWidth=6;
    c.beginPath(); c.moveTo(-7,-59); c.lineTo(10,-32); c.stroke();
    c.strokeStyle='#f2d978'; c.lineWidth=1.3;
    for(let y=-54;y<-34;y+=7){c.beginPath();c.moveTo(-5+(y+54)*.55,y);c.lineTo(3+(y+54)*.55,y);c.stroke();}
  } else if(n==='沙悟淨'){
    c.strokeStyle='#b7a36e'; c.lineWidth=3;
    c.beginPath(); c.moveTo(-7,-58); c.lineTo(8,-39); c.moveTo(8,-58); c.lineTo(-6,-39); c.stroke();
  } else if(n==='鐵扇公主'){
    c.strokeStyle='#d7b75b'; c.lineWidth=1.5;
    c.beginPath(); c.moveTo(-7,-55); c.quadraticCurveTo(2,-46,9,-55); c.stroke();
    c.beginPath(); c.moveTo(-5,-42); c.quadraticCurveTo(2,-36,8,-42); c.stroke();
    c.fillStyle='#65a88a'; c.beginPath(); c.arc(2,-47,2.5,0,TAU); c.fill();
  } else if(n==='白骨精'){
    c.strokeStyle='#c5bccb'; c.lineWidth=2;
    c.beginPath(); c.moveTo(-7,-55); c.lineTo(10,-42); c.moveTo(-7,-42); c.lineTo(9,-55); c.stroke();
  } else if(n==='蜘蛛精'){
    c.strokeStyle='rgba(220,200,236,.72)'; c.lineWidth=.9;
    for(let i=0;i<3;i++){c.beginPath();c.arc(2,-48,5+i*4,Math.PI*.12,Math.PI*.88);c.stroke();}
    c.beginPath();c.moveTo(2,-48);c.lineTo(-8,-41);c.moveTo(2,-48);c.lineTo(11,-41);c.stroke();
  } else if(n==='蠍子精'){
    c.strokeStyle='#d6a050'; c.lineWidth=2;
    c.beginPath(); c.moveTo(-7,-55); c.lineTo(9,-43); c.moveTo(-5,-39); c.lineTo(8,-39); c.stroke();
    c.fillStyle='#8e2949'; c.beginPath(); c.moveTo(2,-52);c.lineTo(6,-47);c.lineTo(2,-42);c.lineTo(-2,-47);c.closePath();c.fill();
  } else if(n==='觀音菩薩'){
    c.strokeStyle='#9bc7c1'; c.lineWidth=3;
    c.beginPath(); c.moveTo(-7,-58); c.quadraticCurveTo(2,-47,10,-58); c.stroke();
    c.fillStyle='#d9c36e'; c.beginPath(); c.arc(2,-46,2.7,0,TAU); c.fill();
  } else if(p.at==='scale'||p.at==='armor'){
    c.strokeStyle=gold; c.lineWidth=1.5;
    c.beginPath(); c.moveTo(-7,-56); c.lineTo(2,-48); c.lineTo(10,-56); c.stroke();
    c.strokeStyle='rgba(0,0,0,.35)';
    c.beginPath(); c.moveTo(2,-48); c.lineTo(2,-34); c.stroke();
  } else if(fem){
    c.strokeStyle=shade(p.ac,42); c.lineWidth=1.4;
    c.beginPath(); c.moveTo(-6,-53); c.quadraticCurveTo(2,-43,9,-53); c.stroke();
  }
  c.restore();
}

function drawHeroP(c,model,x,y,dir,scale,motion,ri){
  const h=model.h, p=h.p, fem=(p.ex||[]).indexOf('fem')>=0, bp=model.body, rig=model.rig;
  const q=pose(motion,time+h.n.length*.31,fem);
  const gold='#e5c04a', dark='#120f0b';
  c.save(); c.translate(x,y); c.scale(dir*scale,scale); c.scale(bp.sx,bp.sy);
  // 影子
  const sg=c.createRadialGradient(0,2,2,0,2,17);
  sg.addColorStop(0,'rgba(0,0,0,.42)'); sg.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=sg; c.beginPath(); c.ellipse(0,2,19,6.5,0,0,TAU); c.fill();
  c.translate(0,-q.bob);

  // 披風只給甲胄角色；僧袍、道袍本身已有長下襬。
  if(ri>=3 && p.at!=='robe'){
    c.fillStyle=shade(p.ac,-45);
    c.beginPath(); c.moveTo(-4,-58); c.lineTo(-20-q.walk*3,-6); c.lineTo(-2,-8); c.closePath(); c.fill();
  }
  // 腿：兩節骨架（大腿＋小腿），膝蓋朝前彎，支撐腳踩地不滑
  const legW=fem?5:6, walking=motion==='march';
  const gaitPhase=time*(fem?5.0:5.5)+h.n.length*.31;
  const stride=fem?10.2:12.2, lift=fem?6.2:7.8;
  let gA=walking?combatGait(gaitPhase,stride,lift):{x:-7,y:rig.footY,planted:true};
  let gB=walking?combatGait(gaitPhase+Math.PI,stride,lift):{x:7,y:rig.footY,planted:true};
  if(motion==='jump'){gA={x:-11,y:-13,planted:false};gB={x:10,y:-9,planted:false};}
  if(motion==='fall'){gA={x:-9,y:-7,planted:false};gB={x:12,y:-4,planted:false};}
  if(motion==='jumpHeavy'){gA={x:-14,y:-23-q.attack*3,planted:false};gB={x:13,y:-19-q.attack*5,planted:false};}
  if(motion==='hurt'){gA={x:-12,y:0,planted:true};gB={x:7,y:0,planted:true};}
  if(motion==='land'){gA={x:-12,y:0,planted:true};gB={x:12,y:0,planted:true};}
  if(motion==='skill'){gA={x:-14,y:0,planted:true};gB={x:14,y:0,planted:true};}
  const wsh=walking?(gA.planted?-1:1)*.5:0;
  // 戰鬥身形保留長腿與寬肩，頭部恢復原版尺寸以維持角色辨識度。
  const HIPY=rig.hipY+q.crouch*9, THIGH=rig.thigh, SHIN=rig.shin;
  const jA=limb2(c,-2+wsh,HIPY,-2+gA.x,gA.y,THIGH,SHIN,'front',legW,shade(p.ac,-60));
  const jB=limb2(c, 3+wsh,HIPY, 3+gB.x,gB.y,THIGH,SHIN,'front',legW,shade(p.ac,-40));
  // 褲管：大腿上段包在衣料裡，比小腿粗
  limb(c,-2+wsh,HIPY,(-2+wsh)*0.35+jA.jx*0.65,HIPY*0.35+jA.jy*0.65,legW+3.4,shade(p.ac,-34));
  limb(c, 3+wsh,HIPY,( 3+wsh)*0.35+jB.jx*0.65,HIPY*0.35+jB.jy*0.65,legW+3.4,shade(p.ac,-20));
  // 腳掌：貼地時平放，抬起時腳尖下垂
  c.fillStyle=shade(p.ac,-70);
  for(const g2 of [{g:gA,x:-2},{g:gB,x:3}]){
    const fx3=g2.x+g2.g.x, fy3=g2.g.y;
    c.save(); c.translate(fx3,fy3);
    if(!g2.g.planted) c.rotate(motion==='jump'?-0.3:motion==='jumpHeavy'?-0.52:0.45);
    c.fillRect(-2.6,-2.4,9,3.4);
    c.restore();
  }
  // 上身整體抬高：腿變長了，軀幹以上的局部座標維持不變，只是往上移
  c.translate(0,rig.torsoLift+q.crouch*8);

  // 上身：揮擊時骨盆先擰、上身後帶再前送（預備動作），
  // 重兵器另加反向抵抗，避免整個人像被平移的紙片
  const heavy = (typeof WEAPON!=='undefined' && WEAPON[wpKind(h.wp,h)])
                ? (WEAPON[wpKind(h.wp,h)].dmg>1 || WEAPON[wpKind(h.wp,h)].kb>1.6) : false;
  const twist = q.attack*(fem?0.24:0.34)*(heavy?0.78:1);
  const wind  = q.antic*(heavy?0.26:0.18);              // 起手先往後擰
  const counter = heavy ? q.attack*0.10 : 0;            // 重兵器的上身抵抗
  const guardTurn=0;
  c.translate(0,-30);
  c.rotate(-twist+wind+q.lean+counter-guardTurn+q.hurt*.12);
  // 重心：先後坐蓄力，再隨揮擊前移
  c.translate(q.sway*0.4 - q.antic*(heavy?3.2:2.2) + q.attack*(heavy?1.6:2.6)-q.recoil*4,30);
  c.fillStyle=p.ac; c.strokeStyle=dark; c.lineWidth=2;
  c.beginPath();
  if(p.at==='robe'){
    if(fem){ c.moveTo(-10,-28); c.lineTo(-8,-58); c.lineTo(10,-58); c.lineTo(12,-28); }
    else { c.moveTo(-13,-28); c.lineTo(-13,-60); c.lineTo(13,-60); c.lineTo(14,-28); }
  } else {
    if(fem){ c.moveTo(-10,-30); c.lineTo(-8,-40); c.lineTo(-9,-58); c.lineTo(11,-58); c.lineTo(10,-40); c.lineTo(12,-30); }
    else { c.moveTo(-13,-30); c.lineTo(-13,-62); c.lineTo(13,-62); c.lineTo(14,-30); }
  }
  c.closePath(); c.fill(); c.stroke();
  // 裙擺／下襬：長袍飄，甲裙硬
  {
    // 半寬要蓋得住步幅（步幅 stride + 髖偏移），否則大腿一擺就露出來
    // 半寬必須蓋得住膝在擺盪期的最前點（步幅變大後要一併放大）
    const hemW = p.at==='robe' ? (fem?24:27) : (fem?23:26);
    const hemBottom = p.at==='robe' ? 6 : 0;           // 腿變長，裙也要跟著加長
    // 裙子跟著前腿走：腿往前送，裙擺跟著被帶開
    const legLead = (gA.x+gB.x)*0.5*0.55;
    const flow = (legLead+q.sway*0.8+Math.sin(time*2.2+h.n.length)*(fem?2.6:1.2));
    c.fillStyle=shade(p.ac,-16); c.strokeStyle=dark; c.lineWidth=1.6;
    c.beginPath();
    c.moveTo(-10,-33); c.lineTo(12,-33);
    if(p.at==='robe'){
      c.quadraticCurveTo(hemW+flow, -14, hemW*0.88+flow, hemBottom);   // 長袍下襬會飄
      c.lineTo(-hemW*0.88+flow*0.7, hemBottom);
      c.quadraticCurveTo(-hemW+flow*0.7, -14, -10, -33);
    } else {
      c.lineTo(hemW+flow*0.5, hemBottom);                     // 甲裙短而硬，但要蓋住大腿
      c.lineTo(-hemW+flow*0.5, hemBottom);
    }
    c.closePath(); c.fill(); c.stroke();
    if(p.at!=='robe'){                                        // 甲裙分片
      c.strokeStyle='rgba(0,0,0,.35)'; c.lineWidth=1.2;
      for(let i=-2;i<=2;i++){ c.beginPath();
        c.moveTo(i*6,-32); c.lineTo(i*6+flow*0.35,hemBottom+1); c.stroke(); }
    }
  }
  // 鱗甲：畫成交錯的小鱗片而不是橫條
  if(p.at==='scale'){
    c.fillStyle='rgba(0,0,0,.18)';
    for(let r2=0;r2<5;r2++) for(let cc=0;cc<4;cc++){
      const xx=-8+cc*5+(r2%2?2.5:0), yy=-58+r2*6;
      c.beginPath(); c.arc(xx,yy,2.2,0,Math.PI); c.fill();
    }
  }
  // 札甲橫片：軍階越高片數越多
  if(p.at==='armor'){
    c.strokeStyle='rgba(0,0,0,.4)'; c.lineWidth=1.3;
    const rowsN=2+Math.min(4,ri);
    for(let i=0;i<rowsN;i++){ const yy=-58+i*(28/rowsN);
      c.beginPath(); c.moveTo(-9,yy); c.lineTo(11,yy); c.stroke(); }
  }
  // 毛皮裙（孫悟空的虎皮）
  if((p.ex||[]).indexOf('fur')>=0){
    c.fillStyle=shade('#8a6a3a',0); c.strokeStyle=dark; c.lineWidth=1.3;
    c.beginPath(); c.moveTo(-11,-34); c.lineTo(13,-34);
    for(let i=0;i<5;i++){ const xx=13-i*6.2; c.lineTo(xx-2.4,-34+(i%2?11:7)); c.lineTo(xx-4.8,-34+3); }
    c.closePath(); c.fill(); c.stroke();
  }
  // 破布下襬（沙悟淨的殘袍）
  if((p.ex||[]).indexOf('tattered')>=0){
    c.fillStyle=shade(p.ac,-30);
    for(let i=0;i<5;i++){ const xx=-10+i*5.6;
      c.beginPath(); c.moveTo(xx,-30); c.lineTo(xx+4.4,-30);
      c.lineTo(xx+2.6+Math.sin(time*2+i)*2,-30+14+((i*7)%9)); c.closePath(); c.fill(); }
  }
  // 毛領（老鼠精、玉兔精的白裘）
  if((p.ex||[]).indexOf('furcollar')>=0){
    c.fillStyle='#f4f0ea';
    for(let i=0;i<9;i++){
      const a=Math.PI*0.08+i*(Math.PI*0.84/8);
      c.beginPath();
      c.arc(1+Math.cos(a)*13,-58+Math.sin(a)*9-3,4.4,0,TAU); c.fill();
    }
    c.strokeStyle='rgba(180,170,160,.6)'; c.lineWidth=0.9;
    for(let i=0;i<9;i++){ const a=Math.PI*0.08+i*(Math.PI*0.84/8);
      c.beginPath(); c.arc(1+Math.cos(a)*13,-58+Math.sin(a)*9-3,4.4,0,TAU); c.stroke(); }
  }
  // 骷髏腰飾（白骨精的骨帶）
  if((p.ex||[]).indexOf('skullbelt')>=0){
    c.fillStyle='#efe8dc'; c.strokeStyle=dark; c.lineWidth=0.9;
    c.beginPath(); c.arc(2,-35,4.2,0,TAU); c.fill(); c.stroke();
    c.fillStyle='#3a3440';
    c.beginPath(); c.arc(0.6,-36,1.2,0,TAU); c.fill();
    c.beginPath(); c.arc(3.6,-36,1.2,0,TAU); c.fill();
    c.strokeStyle='#dcd4c8'; c.lineWidth=1.6;
    c.beginPath(); c.moveTo(-9,-34); c.lineTo(-3,-35); c.moveTo(7,-35); c.lineTo(12,-34); c.stroke();
  }
  // 交領：漢服的斜襟，一眼看得出是東方服裝
  {
    c.strokeStyle=shade(p.ac,fem?42:-38); c.lineWidth=fem?3.2:2.6;
    c.beginPath(); c.moveTo(-6,-60); c.lineTo(2,-46); c.lineTo(10,-58); c.stroke();
    if(fem){                                                // 女角加內襯領
      c.strokeStyle='rgba(255,255,255,.55)'; c.lineWidth=1.6;
      c.beginPath(); c.moveTo(-4,-60); c.lineTo(2,-49); c.lineTo(8,-58); c.stroke();
    }
  }
  drawCostumeDetail(c,h,p,fem,dark,gold);
  // 念珠（豬八戒、唐三藏）：一大串掛在胸前
  if((p.ex||[]).indexOf('beads')>=0){
    const big=(p.ex||[]).indexOf('bigbeads')>=0;
    const r0=big?3.1:2.2, R0=big?15:11;
    c.fillStyle=big?'#6b4a2e':'#8a5a3a'; c.strokeStyle=dark; c.lineWidth=0.9;
    for(let i=0;i<11;i++){
      const a=Math.PI*0.12+i*(Math.PI*0.76/10);
      const bx=1+Math.cos(a)*R0*0.92, by=-56+Math.sin(a)*R0+R0*0.34;
      c.beginPath(); c.arc(bx,by,r0,0,TAU); c.fill(); c.stroke();
    }
  }
  // 骷髏串（沙悟淨）
  if((p.ex||[]).indexOf('skulls')>=0){
    for(let i=0;i<5;i++){
      const a=Math.PI*0.16+i*(Math.PI*0.66/4);
      const bx=1+Math.cos(a)*12, by=-55+Math.sin(a)*13+5;
      c.fillStyle='#e8e0cc'; c.strokeStyle=dark; c.lineWidth=0.9;
      c.beginPath(); c.arc(bx,by,3.1,0,TAU); c.fill(); c.stroke();
      c.fillStyle='#3a3028';
      c.fillRect(bx-1.7,by-0.9,1.3,1.5); c.fillRect(bx+0.5,by-0.9,1.3,1.5);
    }
  }
  // 袖口
  c.fillStyle=shade(p.ac,26); c.strokeStyle=dark; c.lineWidth=1.2;
  c.beginPath(); c.ellipse(12,-44,4.2,fem?6:5,0.3,0,TAU); c.fill(); c.stroke();
  // 肩甲只屬於戰甲與鱗甲；僧袍、道袍保留布料肩線。
  if(ri>=1 && p.at!=='robe'){
    c.fillStyle=shade(p.ac,34); c.strokeStyle=dark; c.lineWidth=1.6;
    c.beginPath(); c.ellipse(4,-59,9,6,0,Math.PI,TAU); c.fill(); c.stroke();
  } else if(p.at==='robe'){
    c.strokeStyle=shade(p.ac,34); c.lineWidth=1.4;
    c.beginPath(); c.moveTo(-6,-58); c.quadraticCurveTo(2,-62,10,-57); c.stroke();
  }
  // 腰帶（屯長以上）＋ 腰帶結與飄帶
  if(ri>=2){
    c.fillStyle=ri>=4?gold:shade(p.ac,-30); c.fillRect(-10,-36,22,4);
    c.fillStyle=ri>=4?shade(gold,-40):shade(p.ac,-52);
    c.fillRect(-2,-37.5,7,7);                                // 結
    const rb=(q.walk*4+q.sway*1.2+Math.sin(time*2.6+h.n.length)*(fem?4:2));
    c.strokeStyle=ri>=4?gold:shade(p.ac,20); c.lineWidth=fem?2.6:2;
    c.beginPath(); c.moveTo(0,-33);
    c.quadraticCurveTo(-6+rb*0.5,-22,-3+rb,-9);              // 飄帶
    c.stroke();
    if(fem){ c.beginPath(); c.moveTo(3,-33);
      c.quadraticCurveTo(-2+rb*0.6,-20,1+rb*1.3,-6); c.stroke(); }
  }
  // 描金（校尉以上）
  if(ri>=4){
    c.strokeStyle=gold; c.lineWidth=1.8;
    c.beginPath(); c.moveTo(-9,-62); c.lineTo(11,-62); c.moveTo(-10,-30); c.lineTo(12,-30); c.stroke();
  }
  // 背纓（牙門將以上）
  if(ri>=5){
    c.fillStyle=gold;
    for(let i=0;i<3;i++){ c.beginPath(); c.moveTo(-6,-58);
      c.lineTo(-16-i*4,-74-Math.sin(time*5+i)*4); c.lineTo(-8,-56); c.closePath(); c.fill(); }
  }

  // ===== 手臂與兵器 =====
  //  棍法：雙手握棍，攻擊時整根旋轉一圈，桿子從身體兩側都伸出去
  //  釘耙：九齒耙頭，又寬又重
  //  寶杖：月牙鏟，大型長兵
  const sw=q.attack, wk=wpKind(h.wp,h), wv=wpView(h.wp,h);
  const playable=Object.prototype.hasOwnProperty.call(WEAPON_FORMS,h.n);
  const weaponLv=playable&&typeof save!=='undefined'?save.weapon:1;
  const activeArtKey=playable&&typeof player!=='undefined'&&player&&player.model===model&&player.spellBuff?player.spellBuff.type:(typeof save!=='undefined'?save.equippedArt:'physical');
  const weaponGlow=typeof ELEMENT_ARTS!=='undefined'&&ELEMENT_ARTS[activeArtKey]?ELEMENT_ARTS[activeArtKey].color:'#f4dd9a';
  const ready=q.armLift;
  const W2=(typeof WEAPON!=='undefined'?WEAPON[wk]:null)||{};
  const twoHand = (wk==='staff'||wk==='rake'||wk==='pole'||wk==='glaive'||wk==='lance')
                  && wv!=='claw' && wv!=='twin' && wv!=='dart';
  // 輕擊固定從頭頂往前下方敲；重擊才讓武器繞身旋轉一整圈。
  const swingA=q.variant===2 ? .9-sw*4.25 : q.variant===3 ? -2.6+sw*5.35 : -1.52+sw*2.62;
  const spinA = -1.42 + sw*TAU*(q.skill?1.55:1.08);
  const slamA = -1.62 + sw*3.6;
  const an=q.antic;
  let hx=9+ready*5+sw*(twoHand?15:30)-an*(twoHand?9:11),
      hy=-44-ready*24-sw*(twoHand?14:26)+an*6;
  if(q.slam){hx=7+sw*6;hy=-76+sw*52;}
  if(q.hurt){hx=-7;hy=-38;}
  if(q.air&&motion==='fall'){hx=18;hy=-55;}

  // 揮擊殘影
  if(sw>0.06 && wk!=='bow' && wk!=='sutra'){
    c.save(); c.translate(9,-50);
    const rr2=(wk==='sword'?52:(wk==='staff'?74:66))+ri*3;
    const gg2=c.createLinearGradient(-rr2,0,rr2,0);
    gg2.addColorStop(0,'rgba(127,233,255,0)');
    gg2.addColorStop(.5,weaponLv>=3?weaponGlow:'rgba(223,246,255,'+(0.55*sw)+')');
    gg2.addColorStop(1,'rgba(127,233,255,0)');
    c.strokeStyle=gg2; c.lineWidth=(wk==='rake'?18:13)*sw; c.lineCap='round';
    c.beginPath();
    if(q.slam)c.arc(0,0,rr2,-1.62,slamA);
    else if(q.heavy||q.skill) c.arc(0,0,rr2,-1.42,spinA);
    else c.arc(0,0,rr2,-1.52,swingA);
    c.stroke(); c.restore();
  }

  // 女角兵器走秀氣路線：桿身收細、加金絲纏繞與垂墜流蘇
  const slim=fem;
  const tassel=(tx,ty,col,n)=>{
    c.strokeStyle=col||'#e0b83a'; c.lineWidth=1; c.lineCap='round';
    for(let i=0;i<(n||4);i++){ const fl=Math.sin(time*3+i)*2.2;
      c.beginPath(); c.moveTo(tx,ty);
      c.quadraticCurveTo(tx-2+fl,ty+6+i,tx-4+fl*1.4,ty+12+i*1.6); c.stroke(); }
    c.fillStyle=col||'#e0b83a'; c.beginPath(); c.arc(tx,ty,1.7,0,TAU); c.fill();
  };
  const filigree=(x1,y1,x2,y2,n)=>{                 // 桿身金絲纏繞
    c.strokeStyle='rgba(224,184,58,.85)'; c.lineWidth=1;
    for(let i=1;i<=(n||4);i++){ const u=i/((n||4)+1);
      const mx=x1+(x2-x1)*u, my=y1+(y2-y1)*u;
      c.beginPath(); c.ellipse(mx,my,2.6,1.5,Math.atan2(y2-y1,x2-x1),0,TAU); c.stroke(); }
  };

  const weaponAngle=wv==='claw' ? (-0.35+sw*(q.heavy?TAU:1.15))
                    : (q.slam?slamA:((q.heavy||q.skill)&&wv!=='pestle' ? spinA : swingA));
  c.save(); c.translate(hx,hy);
  // 爪是戴在手上的，跟著手腕小幅擺動即可，不做長桿那種大迴旋
  c.rotate(weaponAngle);
  const longWeapon=twoHand||wk==='staff'||wk==='rake'||wk==='pole'||wk==='glaive'||wk==='lance'||wk==='sutra';
  if(weaponLv>1)c.scale(1+(weaponLv-1)*.027,1+(weaponLv-1)*.014);
  drawWeaponEvolution(c,weaponLv,weaponGlow,longWeapon,false);

  if(wv==='bone'){
    // 白骨杖：細長骨節杖 + 頂端彎月與小骷髏 + 垂墜珠串
    c.strokeStyle='#efe8dc'; c.lineWidth=slim?2.8:4.4;
    c.beginPath(); c.moveTo(-28,17); c.lineTo(30,-17); c.stroke();
    c.fillStyle='#ded6c6'; c.strokeStyle=dark; c.lineWidth=0.9;
    for(let i=0;i<5;i++){ const u=i/5;
      c.beginPath(); c.ellipse(-28+58*u,17-34*u,slim?2.4:3.6,slim?1.5:2.4,-0.53,0,TAU);
      c.fill(); c.stroke(); }
    // 彎月刃
    c.fillStyle='#f4f0e6'; c.strokeStyle=dark; c.lineWidth=1;
    c.beginPath();
    c.arc(33,-21,slim?11:13,-2.3,0.7);
    c.quadraticCurveTo(35,-21,33,-32);
    c.closePath(); c.fill(); c.stroke();
    // 小骷髏綴飾
    c.fillStyle='#f6f2e8';
    c.beginPath(); c.arc(30,-16,slim?3.6:5,0,TAU); c.fill(); c.stroke();
    c.fillStyle='#2a2430';
    c.beginPath(); c.arc(29,-17,1.1,0,TAU); c.fill();
    c.beginPath(); c.arc(32,-16.4,1.1,0,TAU); c.fill();
    if(slim){ filigree(-24,15,26,-15,4); tassel(24,-11,'#cfc6d8',5); }
  }
  else if(wv==='bigfan'){
    // 芭蕉扇：一整片巨大蕉葉，比人臉還大
    c.strokeStyle='#6b5a3a'; c.lineWidth=3.4;
    c.beginPath(); c.moveTo(-8,10); c.lineTo(10,-6); c.stroke();
    const gf=c.createLinearGradient(10,-6,44,-34);
    gf.addColorStop(0,'#5a7a3a'); gf.addColorStop(1,'#9ac06a');
    c.fillStyle=gf; c.strokeStyle='#3a4a24'; c.lineWidth=1.6;
    c.beginPath();
    c.moveTo(10,-6);
    c.quadraticCurveTo(30,-42,50,-26);
    c.quadraticCurveTo(44,-4,10,-6);
    c.closePath(); c.fill(); c.stroke();
    c.strokeStyle='rgba(40,60,26,.55)'; c.lineWidth=1;
    for(let i=1;i<6;i++){ c.beginPath(); c.moveTo(12,-8);
      c.lineTo(16+i*6.4,-12-i*3.4); c.stroke(); }
    if(slim){                                        // 金邊與扇墜
      c.strokeStyle='rgba(224,184,58,.9)'; c.lineWidth=1.4;
      c.beginPath(); c.moveTo(10,-6);
      c.quadraticCurveTo(30,-42,50,-26); c.stroke();
      tassel(6,-2,'#e0b83a',5);
    }
  }
  else if(wv==='claw'){
    // 銀絲爪：戴在手上的爪套，不是握著的兵器
    // 護腕
    const gwr=c.createLinearGradient(-14,-6,-2,6);
    gwr.addColorStop(0,'#b8aac8'); gwr.addColorStop(1,'#6b5a7a');
    c.fillStyle=gwr; c.strokeStyle=dark; c.lineWidth=1.1;
    c.beginPath(); c.moveTo(-15,-6.4); c.lineTo(-3,-7.4);
    c.lineTo(-2,7.4); c.lineTo(-14,6.4); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle='rgba(226,216,240,.7)'; c.lineWidth=0.8;
    for(let i=0;i<3;i++){ c.beginPath(); c.moveTo(-13+i*4,-6.6); c.lineTo(-12+i*4,6.6); c.stroke(); }
    // 手背金屬片與寶石
    c.fillStyle='#8a7a9a'; c.strokeStyle=dark; c.lineWidth=1;
    c.beginPath(); c.moveTo(-3,-6.6); c.lineTo(7,-5.2); c.lineTo(8,5.2); c.lineTo(-2,6.6);
    c.closePath(); c.fill(); c.stroke();
    c.fillStyle='#8a5ac8'; c.strokeStyle='#e0d8f0'; c.lineWidth=0.7;
    c.beginPath(); c.moveTo(3,-3.4); c.lineTo(5.6,0); c.lineTo(3,3.4); c.lineTo(0.4,0);
    c.closePath(); c.fill(); c.stroke();
    // 五根指爪：從指節長出來，長度不一
    const LEN=[15,20,22,19,13], YS=[-6.2,-3.2,0,3.2,6.2];
    for(let i=0;i<5;i++){
      const L=LEN[i]*(slim?1:1.15), y0=YS[i];
      const gcl=c.createLinearGradient(7,y0,7+L,y0*1.5);
      gcl.addColorStop(0,'#cfc4dc'); gcl.addColorStop(.6,'#f2eefa'); gcl.addColorStop(1,'#9a8ab0');
      c.fillStyle=gcl; c.strokeStyle=dark; c.lineWidth=0.8;

  else if(p.bd==='full'){ c.beginPath(); c.moveTo(-3,cy-3); c.quadraticCurveTo(6,cy+16,10,cy-4);
    c.quadraticCurveTo(6,cy+2,-3,cy-3); c.closePath(); c.fill();
    c.beginPath(); c.ellipse(3,cy+5,8,7,0,0,TAU); c.fill(); }
  else if(p.bd==='short'){ c.beginPath(); c.ellipse(4,cy+2,7,5,0,0,TAU); c.fill(); }
  else if(p.bd==='goatee'){ c.beginPath(); c.moveTo(2,cy); c.lineTo(7,cy); c.lineTo(4,cy+12); c.closePath(); c.fill(); }
  else if(p.bd==='mo'){ c.fillRect(3,cy-4,8,2.6); }
  // 頭飾
  c.fillStyle=p.hc; c.strokeStyle=dark; c.lineWidth=1.5;
  if(p.ht==='helm'||p.ht==='goldhelm'){
    c.beginPath(); c.ellipse(1,hyy-4,wide?15:12.5,10,0,Math.PI,TAU); c.fill(); c.stroke();
    c.fillRect(-12,hyy-5,26,3.4);
    if(p.ht==='goldhelm'){ c.fillStyle='#e8c96a'; c.beginPath();
      c.moveTo(1,hyy-14); c.lineTo(5,hyy-26); c.lineTo(-3,hyy-26); c.closePath(); c.fill(); }
  } else if(p.ht==='band'){
    c.beginPath(); c.moveTo(-11,hyy-3); c.quadraticCurveTo(1,hyy-11,13,hyy-3);
    c.lineTo(13,hyy-7); c.quadraticCurveTo(1,hyy-15,-11,hyy-7); c.closePath(); c.fill(); c.stroke();
  } else if(p.ht==='guanjin'){
    c.beginPath(); c.moveTo(-12,hyy-3); c.quadraticCurveTo(1,hyy-20,13,hyy-3); c.lineTo(13,hyy-9);
    c.quadraticCurveTo(1,hyy-24,-12,hyy-9); c.closePath(); c.fill(); c.stroke();
  } else if(p.ht==='official'){
    c.fillRect(-11,hyy-14,24,7); c.fillRect(-6,hyy-20,14,7); c.strokeRect(-11,hyy-14,24,7);
  } else if(p.ht==='crown'){
    c.beginPath(); c.moveTo(-11,hyy-6); c.lineTo(13,hyy-6); c.lineTo(10,hyy-20);
    c.lineTo(4,hyy-13); c.lineTo(-1,hyy-22); c.lineTo(-6,hyy-13); c.lineTo(-11,hyy-20);
    c.closePath(); c.fill(); c.stroke();
  } else if(p.ht==='cap'){
    c.beginPath(); c.moveTo(-9,hyy-5); c.quadraticCurveTo(2,hyy-19,12,hyy-5); c.closePath(); c.fill(); c.stroke();
  } else if(p.ht==='bun'){                     // 髮髻
    c.beginPath(); c.ellipse(1,hyy-6,12,9,0,Math.PI,TAU); c.fill(); c.stroke();
    c.beginPath(); c.arc(-1,hyy-19,6.5,0,TAU); c.fill(); c.stroke();
    c.strokeStyle=shade(p.hc,50); c.lineWidth=1.6;
    c.beginPath(); c.moveTo(-7,hyy-21); c.lineTo(6,hyy-17); c.stroke();
  } else if(p.ht==='turban'){                  // 裹巾，尾巴會飄
    c.beginPath(); c.ellipse(1,hyy-4,13,10,0,Math.PI,TAU); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(-11,hyy-6);
    c.quadraticCurveTo(-24,hyy-2+Math.sin(time*4)*4,-19,hyy+9+Math.sin(time*4)*4);
    c.quadraticCurveTo(-14,hyy+1,-9,hyy-3); c.closePath(); c.fill();
  }
  // 老紋
  if((p.ex||[]).indexOf('oldlines')>=0){
    c.strokeStyle='rgba(0,0,0,.28)'; c.lineWidth=1.2;
    c.beginPath(); c.moveTo(6,hyy+5); c.quadraticCurveTo(9,hyy+7,6,hyy+9); c.stroke();
  }
  // 龍角（白龍馬）
  if((p.ex||[]).indexOf('horns')>=0){
    c.fillStyle='#e8eef5'; c.strokeStyle=dark; c.lineWidth=1.3;
    for(const s of [-1,1]){
      c.beginPath();
      c.moveTo(1+s*5,hyy-9);
      c.quadraticCurveTo(1+s*15,hyy-22,1+s*9,hyy-30);
      c.quadraticCurveTo(1+s*11,hyy-20,1+s*2,hyy-10);
      c.closePath(); c.fill(); c.stroke();
    }
  }
  // 雉雞雙翎（孫悟空的紫金冠）
  if((p.ex||[]).indexOf('feather')>=0){
    for(const s of [-1,1]){
      const bend=Math.sin(time*2.4+s)*4;
      const gg4=c.createLinearGradient(0,hyy-14,0,hyy-46);
      gg4.addColorStop(0,'#c8496b'); gg4.addColorStop(1,'#6b4a9a');
      c.strokeStyle=gg4; c.lineWidth=3.2; c.lineCap='round';
      c.beginPath(); c.moveTo(1+s*2,hyy-13);
      c.quadraticCurveTo(1+s*9+bend,hyy-30,1+s*6+bend*1.6,hyy-46);
      c.stroke();
    }
  }
  // 盔纓（plume / plume2 / 軍階）
  const exs=p.ex||[], hasP=exs.indexOf('plume')>=0, hasP2=exs.indexOf('plume2')>=0;
  if(hasP||hasP2||ri>=3){
    const n2=hasP2?7:4, len=hasP2?38:30;
    c.fillStyle=(hasP||hasP2)?'#e8c96a':RANKS[ri].hc;
    for(let i=0;i<n2;i++){ c.beginPath(); c.moveTo(1,hyy-13);
      c.lineTo(-4+i*2.2,hyy-len-Math.sin(time*5+i)*3); c.lineTo(-2+i*2.2,hyy-13); c.closePath(); c.fill(); }
  }
  c.restore();                                  // 結束頭部縮放
  c.restore();
}

function uiButtons(scope){return [...scope.querySelectorAll('button:not(:disabled)')].filter(b=>b.offsetParent!==null);}
function setUiFocus(scope,el,scroll=true){
  scope.querySelectorAll('.ui-focus').forEach(x=>x.classList.remove('ui-focus'));if(!el)return;
  el.classList.add('ui-focus');if(scope===selectScreen)selectFocusEl=el;else if(scope===shopPanel){shopFocusEl=el;shopFocusKey=el.dataset.uiId||shopFocusKey;}
  if(scroll)el.scrollIntoView({block:'nearest',inline:'nearest'});

function moveUiFocus(scope,current,dx,dy){
  const list=uiButtons(scope);if(!list.length)return null;if(!current||!list.includes(current)){setUiFocus(scope,list[0]);return list[0];}
  const a=current.getBoundingClientRect(),ax=a.left+a.width/2,ay=a.top+a.height/2;let best=null,bestScore=Infinity;
  for(const el of list){if(el===current)continue;const r=el.getBoundingClientRect(),vx=r.left+r.width/2-ax,vy=r.top+r.height/2-ay;
    if(dx<0&&vx>=-4||dx>0&&vx<=4||dy<0&&vy>=-4||dy>0&&vy<=4)continue;
    const main=Math.abs(dx?vx:vy),cross=Math.abs(dx?vy:vx),score=main+cross*2.35+Math.hypot(vx,vy)*.08;
    if(score<bestScore){bestScore=score;best=el;}
  }
  if(best)setUiFocus(scope,best);return best||current;
}

function activeGamepad(){return navigator.getGamepads?[...navigator.getGamepads()].find(Boolean):null;}
function pollGamepad(){

    c.fillStyle=stage.theme==='fire'?'#4a2b2b':'#263237';c.fillRect(x,p.y,p.w,22);c.fillStyle='#71807c';c.fillRect(x,p.y,p.w,5);

function actorMotion(a){
  if(a.hurt>0)return'hurt';
  if(a.attackT>0){
    if(/^boss/.test(a.attackKind||'')){
      if(a.attackKind==='bossCharge')return'attack2';
      if(a.attackKind==='bossMelee')return'attack';
      return a.attackElapsed<.48?'cast':'attack3';
    }
    if(a.attackKind==='mediumSpell')return a.attackElapsed<.46?'cast':'attack3';
    if(a.attackKind==='skill')return a.attackElapsed<.27?'cast':'skill';
    if(a.attackKind==='jumpHeavy')return'jumpHeavy';
    if(a.attackKind==='heavy')return'heavy';
    if(a.attackKind==='light')return'light';
    return a.attackVariant>1?'attack'+a.attackVariant:'attack';
  }
  if(a.onGround===false)return a.vy<0?'jump':'fall';
  if(a.landT>0)return'land';
  if(Math.abs(a.vx)>28)return'march';return'idle';
}
const ORIGINAL_BOSSES=new Set(['白骨精','黑熊精','紅孩兒','黃風怪','靈感大王','蠍子精','六耳獼猴','牛魔王','蜘蛛精','多目怪','青獅精','白象精','大鵬金翅雕','老鼠精','玉兔精']);
function drawActor(c,a,isPlayer=false){
  if(a.dead)return;const sx=a.x-cameraX;if(sx<-180||sx>viewW+180)return;
  c.save();
  if(a.defeated){
    c.globalAlpha=a.deathAlpha==null?1:a.deathAlpha;c.translate(sx,a.y-66);c.rotate(a.deathAngle||0);time=gameClock;
    if(a.boss&&a.phase2&&ORIGINAL_BOSSES.has(a.name))drawOriginalBoss(c,a,0,66);
    else drawHeroP(c,a.model,0,66,a.dir,a.scale,'hurt',RI);c.restore();return;
  }
  if(a.illusion)c.globalAlpha=.62+Math.sin(gameClock*9+a.x)*.14;
  if(a.hurt>0||isPlayer&&a.invuln>0&&Math.floor(gameClock*16)%2)c.globalAlpha=.48;
  const motion=actorMotion(a),oldTime=time;
  const attackDuration=a.attackKind==='skill'?1.05:a.attackKind==='jumpHeavy'?.82:a.attackKind==='heavy'?.94:a.attackKind==='light'?.52:a.attackKind==='mediumSpell'?.86:a.boss?.96:.72;
  time=a.attackT>0?Math.min(1.5,(a.attackElapsed/attackDuration)*1.5)
    :motion==='land'?Math.max(0,.18-a.landT):gameClock+(a.x%100)*.01;
  if(motion==='cast'||motion==='skill'){
    const medium=a.tier==='medium'&&!a.boss,spell=medium?spellForEnemy(a.name):null,glow=spell?spell.color:'#ffd36a';
    const charge=motion==='cast'?1.12:1,rad=(medium?52:78)+Math.sin(gameClock*18)*(medium?4:7)*charge;
    const aura=c.createRadialGradient(sx,a.y-76,8,sx,a.y-76,rad);aura.addColorStop(0,medium?glow:'rgba(255,238,150,.34)');aura.addColorStop(.56,medium?'rgba(255,255,255,.08)':'rgba(255,201,72,.15)');aura.addColorStop(1,'rgba(255,190,62,0)');
    c.fillStyle=aura;c.beginPath();c.arc(sx,a.y-76,rad,0,TAU);c.fill();
    c.save();c.translate(sx,a.y-76);c.rotate(gameClock*(motion==='cast'?2.8:5.2));c.fillStyle=medium?glow:'rgba(255,232,139,.88)';c.font='900 '+(medium?13:18)+'px serif';c.textAlign='center';c.textBaseline='middle';
    const runes=medium?['妖','氣','聚','法']:['天','地','玄','黃','破','邪'];
    for(let i=0;i<runes.length;i++){c.save();c.rotate(i*TAU/runes.length);c.translate(0,-rad*.82);c.rotate(-i*TAU/runes.length-gameClock*(motion==='cast'?2.8:5.2));c.fillText(runes[i],0,0);c.restore();}c.restore();
  }
  if(a.boss&&a.phase2&&ORIGINAL_BOSSES.has(a.name))drawOriginalBoss(c,a,sx,a.y);
  else drawHeroP(c,a.model,sx,a.y,a.dir,a.scale,motion,RI);
  if(a.slowT>0||a.snareT>0||a.poisonT>0){
    const statusColor=a.poisonT>0?'#b56cff':a.snareT>0?'#d9c7ee':'#8fe8ff';c.strokeStyle=statusColor;c.lineWidth=2;c.globalAlpha=.72;
    c.beginPath();c.ellipse(sx,a.y-10,30+a.scale*5,7,0,0,TAU);c.stroke();
    for(let i=0;i<4;i++){const ang=gameClock*(a.poisonT>0?2.8:-2.2)+i*TAU/4;c.fillStyle=statusColor;c.beginPath();c.arc(sx+Math.cos(ang)*(24+a.scale*5),a.y-74+Math.sin(ang)*18,2.5+(i%2),0,TAU);c.fill();}
  }
  time=oldTime;c.restore();
}

function render(){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
  const unit=cssH/GAME_H;ctx.setTransform(dpr*unit,0,0,dpr*unit,0,0);
  const sx=shake?rnd(-shake,shake):0,sy=shake?rnd(-shake*.5,shake*.5):0;ctx.save();ctx.translate(sx,sy);
  drawBackground(ctx,stage?stage.theme:'bone');
  if(stage){drawPlatforms(ctx);drawItems(ctx);for(const e of enemies)drawActor(ctx,e,false);drawActor(ctx,player,true);drawProjectiles(ctx);drawParticles(ctx);drawImpacts(ctx);drawStageAtmosphere(ctx);}
  ctx.restore();
  if(paused&&state==='playing'){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,viewW,GAME_H);ctx.fillStyle='#fff';ctx.font='900 34px sans-serif';ctx.textAlign='center';ctx.fillText('暫停',viewW/2,GAME_H/2);}
}
function updateHud(){
  if(!player)return;document.getElementById('playerName').textContent=player.name;document.getElementById('hpText').textContent=Math.ceil(player.hp);
  document.getElementById('hpFill').style.width=(player.hp/player.maxHp*100)+'%';document.getElementById('energyFill').style.width=player.energy+'%';
  document.getElementById('coinText').textContent=save.coins;document.getElementById('hpPotionText').textContent=save.hpPotion;document.getElementById('mpPotionText').textContent=save.mpPotion;
  const art=currentWeaponArt(),element=ELEMENT_ARTS[art.type]?art.type:'physical',artLevel=save.artMastery[element]||1;
  document.getElementById('spellText').textContent=player.spellBuff?player.spellBuff.label+' '+Math.ceil(player.spellBuff.time)+'秒':art.label+' Lv.'+artLevel;
  const boss=enemies.find(e=>e.boss&&!e.dead);
  if(boss&&player.x>stage.width-980){bossHud.classList.remove('hidden');document.getElementById('bossName').textContent=boss.name;
    document.getElementById('bossPhase').textContent=boss.shield>0?'火盾 '+Math.ceil(boss.shield/boss.shieldMax*100)+'%':boss.phase2?'原形':'人形';document.getElementById('bossFill').style.width=(boss.hp/boss.maxHp*100)+'%';}
  else bossHud.classList.add('hidden');
}
function frame(now){
  const dt=Math.min(.034,(now-lastFrame)/1000);lastFrame=now;
  if(state==='select')drawHeroCards(now);else update(dt);
  if(state==='select'||state==='shop'||state==='story'||state==='won'||state==='lost'||state==='credits')pollUiGamepad();
  render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function keyName(e){return(e.key||'').toLowerCase();}
addEventListener('keydown',e=>{
  const k=keyName(e),uiState=state==='select'||state==='shop';
  if(uiState&&['arrowleft','arrowright','arrowup','arrowdown','enter',' '].includes(k)){
    e.preventDefault();if(e.repeat)return;
    const scope=state==='select'?selectScreen:shopPanel;let current=state==='select'?selectFocusEl:shopFocusEl;
    if(k==='arrowleft')current=moveUiFocus(scope,current,-1,0);else if(k==='arrowright')current=moveUiFocus(scope,current,1,0);
    else if(k==='arrowup')current=moveUiFocus(scope,current,0,-1);else if(k==='arrowdown')current=moveUiFocus(scope,current,0,1);else activateUiFocus();
    return;
  }
  if(state==='story'&&!e.repeat&&(k==='enter'||k===' ')){e.preventDefault();resumeStory();return;}
  if(state==='credits'&&!e.repeat&&(k==='enter'||k===' '||k==='escape')){e.preventDefault();showJourneySelect();return;}
  if((state==='won'||state==='lost')&&!e.repeat&&(k==='enter'||k===' ')){e.preventDefault();document.getElementById('restartBtn').click();return;}
  if(state==='shop'&&k==='escape'){e.preventDefault();leaveShop();return;}
  if(['arrowleft','arrowright','arrowup',' ','a','d','w','j','k','l','q','e'].includes(k))e.preventDefault();
  if(k==='a'||k==='arrowleft')keys.left=true;if(k==='d'||k==='arrowright')keys.right=true;
  if(!e.repeat&&(k==='w'||k==='arrowup'||k===' '))press.jump=true;if(!e.repeat&&k==='j')press.attack=true;if(!e.repeat&&k==='l')press.heavy=true;if(!e.repeat&&k==='k')press.skill=true;
  if(!e.repeat&&k==='q')usePotion('hpPotion');if(!e.repeat&&k==='e')usePotion('mpPotion');
  if(k==='escape'&&state==='playing')togglePause();
},{passive:false});
addEventListener('keyup',e=>{const k=keyName(e);if(k==='a'||k==='arrowleft')keys.left=false;if(k==='d'||k==='arrowright')keys.right=false;});

const stickArea=document.getElementById('stickArea'),stickKnob=document.getElementById('stickKnob');
function updateStick(e){
  const r=stickArea.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),lim=r.width*.31;
  stickX=clamp(dx/lim,-1,1);stickY=clamp(dy/lim,-1,1);const len=Math.hypot(stickX,stickY);if(len>1){stickX/=len;stickY/=len;}
  stickKnob.style.transform='translate('+(stickX*lim)+'px,'+(stickY*lim)+'px)';if(stickY<-.62&&player&&player.onGround)press.jump=true;
}
stickArea.addEventListener('pointerdown',e=>{stickPointer=e.pointerId;stickArea.setPointerCapture(e.pointerId);updateStick(e);});
stickArea.addEventListener('pointermove',e=>{if(e.pointerId===stickPointer)updateStick(e);});
function releaseStick(e){if(e.pointerId!==stickPointer)return;stickPointer=null;stickX=stickY=0;stickKnob.style.transform='';}
stickArea.addEventListener('pointerup',releaseStick);stickArea.addEventListener('pointercancel',releaseStick);
function bindAction(id,kind){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();b.classList.add('down');press[kind]=true;});
  const up=()=>b.classList.remove('down');b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('pointerleave',up);}
bindAction('jumpBtn','jump');bindAction('attackBtn','attack');bindAction('heavyBtn','heavy');bindAction('skillBtn','skill');
document.getElementById('hpPotionBtn').addEventListener('pointerdown',e=>{e.preventDefault();usePotion('hpPotion');});
document.getElementById('mpPotionBtn').addEventListener('pointerdown',e=>{e.preventDefault();usePotion('mpPotion');});
function togglePause(){if(state!=='playing')return;paused=!paused;document.getElementById('pauseBtn').textContent=paused?'▶':'Ⅱ';}
document.getElementById('pauseBtn').addEventListener('click',togglePause);
document.getElementById('fullBtn').addEventListener('click',async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}catch(_){}});
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('storyBtn').addEventListener('click',resumeStory);
document.getElementById('leaveShopBtn').addEventListener('click',leaveShop);
document.getElementById('creditsExitBtn').addEventListener('click',showJourneySelect);
document.getElementById('restartBtn').addEventListener('click',()=>{
  if(state==='lost'){continueFromDeath();return;}
  showJourneySelect();
});
</script>
<script src="offline-register.js" defer></script>
</body></html>
